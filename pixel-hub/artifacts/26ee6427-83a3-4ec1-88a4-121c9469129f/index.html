<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Hub 2.0, onboarding e Agent Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --branco:#FFFFFF; --sup-1:#FAFAF9; --sup-2:#F5F5F3; --div:#EDEDEA;
  --tinta:#0E1238; --marca:#101C7E;
  --t2:#6E6A66; --t3:#9A958F;
  --laranja:#FF5A1F; --laranja-topo:#FF6B33; --laranja-borda:#E04A12;
  --verde:#1C7A4A; --ambar:#B4740A; --info:#2B5CE0;
  --fd:"Funnel Display","Plus Jakarta Sans",system-ui,sans-serif;
  --fb:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --base-h:88px;
}
/* Claro primeiro; o escuro fica para a v2 do produto. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:light; } }
:root[data-theme="dark"]{ color-scheme:light; }
*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--branco); color:var(--tinta); font-family:var(--fb); font-size:16px; font-weight:400; line-height:1.5; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; }
h1,h2,h3,p,ul,ol{ margin:0; padding:0; font-weight:400; } ul,ol{ list-style:none; }
button{ font:inherit; color:inherit; }
.num{ font-variant-numeric:tabular-nums; }
:focus-visible{ outline:2px solid var(--info); outline-offset:3px; }

/*
  Peso: 400 em todo texto, inclusive títulos.
  500 só em botões e nos dois cabeçalhos de seção. 600 só no logo.
  A hierarquia vem de tamanho e de cor.
*/
.t40{ font-family:var(--fd); font-size:40px; line-height:1.08; letter-spacing:-.03em; }
.t28{ font-family:var(--fd); font-size:28px; line-height:1.14; letter-spacing:-.03em; }
.t20{ font-size:20px; line-height:1.45; letter-spacing:-.02em; }
.s14{ font-size:14px; }
.s12{ font-size:12px; letter-spacing:0; }
.c2{ color:var(--t2); } .c3{ color:var(--t3); }
.frase{ color:var(--t2); }
.frase em{ font-style:normal; color:var(--tinta); }

/* chrome do protótipo, fora do produto */
.chrome{ display:flex; justify-content:space-between; align-items:center; gap:16px; padding:8px 32px; background:var(--sup-2); font-size:12px; letter-spacing:0; color:var(--t3); min-height:33px; }
.abas{ display:flex; gap:20px; margin-left:auto; }
.aba{ background:none; border:0; padding:2px 0; cursor:pointer; font-size:12px; letter-spacing:0; color:var(--t3); }
.aba[aria-selected="true"]{ color:var(--tinta); }

.tela{ display:none; } .tela.ativa{ display:block; }
.topo{ display:flex; justify-content:space-between; align-items:center; padding:22px 40px; }
.logo{ display:inline-flex; align-items:center; gap:10px; }
.logo b{ font-family:var(--fd); font-size:22px; font-weight:600; letter-spacing:-.03em; line-height:1; }
.topo a{ font-size:14px; color:var(--t2); text-decoration:none; }
.topo a:hover{ color:var(--tinta); }
.pagina{ max-width:1200px; margin:0 auto; padding:32px 40px calc(var(--base-h) + 72px); }

/* rodapé de controle */
.base{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  padding:16px 40px calc(16px + env(safe-area-inset-bottom,0px));
  background:rgba(255,255,255,.95); backdrop-filter:blur(10px);
  border-top:1px solid var(--div);
  display:grid; grid-template-columns:1fr minmax(0,440px) 1fr; gap:24px; align-items:center;
}
.prog{ display:flex; flex-direction:column; gap:8px; font-size:12px; letter-spacing:0; color:var(--t2); }
.segs{ display:flex; gap:4px; }
.segs i{ width:22px; height:3px; border-radius:2px; background:var(--div); }
.segs i.f{ background:var(--tinta); }
.lado-acoes{ display:flex; justify-content:flex-end; align-items:center; gap:24px; }

.caixa{ display:flex; align-items:center; gap:10px; padding:6px 6px 6px 18px; background:#fff; border:1px solid var(--div); border-radius:999px; box-shadow:0 1px 2px rgba(14,18,56,.05), 0 10px 24px -16px rgba(14,18,56,.22); transition:border-radius .18s cubic-bezier(.2,.8,.2,1); }
.caixa:focus-within{ border-radius:20px; }
.caixa input{ flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:14px; padding:4px 0; transition:padding .18s cubic-bezier(.2,.8,.2,1); }
.caixa:focus-within input{ padding:12px 0 20px; }
.caixa input::placeholder{ color:var(--t3); }
.mic{ flex:0 0 auto; width:30px; height:30px; border-radius:999px; border:1px solid var(--div); background:linear-gradient(180deg,#fff,#FAFAF9); box-shadow:0 1px 2px rgba(14,18,56,.06); display:grid; place-items:center; cursor:pointer; }
.mic:active{ transform:translateY(.5px); box-shadow:none; }

.btn{ display:inline-flex; align-items:center; border-radius:999px; padding:12px 26px; font-size:14px; font-weight:500; letter-spacing:-.01em; cursor:pointer; border:1px solid transparent; white-space:nowrap; transition:transform .15s ease-out, box-shadow .15s ease-out, background .15s ease-out; }
.btn-p{ color:#fff; border-color:var(--laranja-borda); background:linear-gradient(180deg,var(--laranja-topo),var(--laranja)); box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 1px 2px rgba(150,45,10,.28), 0 2px 4px -2px rgba(150,45,10,.3); }
.btn-p:hover{ background:linear-gradient(180deg,#FF7742,#FF622A); }
.btn-p:active{ transform:translateY(.5px); box-shadow:0 1px 1px rgba(150,45,10,.26); }
.lk{ background:none; border:0; padding:0; cursor:pointer; font-size:14px; color:var(--laranja-borda); }
.lk:hover{ color:#B83A0C; }
.lk-n{ background:none; border:0; padding:0; cursor:pointer; font-size:14px; color:var(--t2); }
.lk-n:hover{ color:var(--tinta); }

.glifo{ --g:40px; width:var(--g); height:var(--g); border-radius:calc(var(--g)*.3); background:var(--marca); display:inline-flex; align-items:center; justify-content:center; gap:calc(var(--g)*.16); flex:0 0 auto; }
.glifo i{ width:calc(var(--g)*.14); height:calc(var(--g)*.14); border-radius:999px; background:#fff; }

/* ===== TELA 1 ===== */
.capa{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:0 32px; padding-top:48px; }
.manchete{ grid-column:1 / span 7; padding-right:32px; }
.manchete .t40{ max-width:16ch; }
.manchete .t20{ margin-top:24px; max-width:40ch; color:var(--t2); }
.placa{ grid-column:8 / span 5; background:var(--marca); color:#fff; border-radius:24px; padding:32px; align-self:start; }
.blocos{ margin-top:24px; border-top:1px solid rgba(255,255,255,.16); }
.blocos li{ display:grid; grid-template-columns:32px 1fr; gap:12px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,.16); }
.blocos li:last-child{ border-bottom:0; padding-bottom:0; }
.blocos .n{ font-size:14px; color:rgba(255,255,255,.5); }
.blocos h3{ font-size:16px; }
.blocos p{ font-size:14px; color:rgba(255,255,255,.62); }
.blocos li + li h3{ color:rgba(255,255,255,.72); }
.blocos li + li p{ color:rgba(255,255,255,.45); }
.faixa{ display:grid; grid-template-columns:repeat(4,1fr); margin-top:88px; border-top:1px solid var(--tinta); }
.faixa div{ padding:16px 20px 0 0; }
.faixa div + div{ padding-left:20px; border-left:1px solid var(--div); }
.faixa .v{ display:block; font-family:var(--fd); font-size:28px; letter-spacing:-.03em; line-height:1.1; }
.faixa .r{ display:block; margin-top:6px; font-size:12px; letter-spacing:0; color:var(--t3); }

/* ===== TELA 2 ===== */
.cab{ max-width:620px; padding-top:40px; }
.cab .frase{ margin-top:14px; }
.caminhos{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:48px; border-top:1px solid var(--div); }
.caminho{ position:relative; display:flex; flex-direction:column; padding:24px 28px 28px; cursor:pointer; transition:background .15s ease-out; }
.caminho + .caminho{ border-left:1px solid var(--div); }
.caminho::before{ content:""; position:absolute; left:0; right:0; top:-1px; height:2px; background:transparent; transition:background .15s ease-out; }
.caminho:hover, .caminho:has(input:checked){ background:var(--sup-1); }
.caminho:has(input:checked)::before{ background:var(--tinta); }
.caminho:has(input:focus-visible){ outline:2px solid var(--info); outline-offset:-2px; }
.cm-topo{ display:flex; align-items:center; justify-content:space-between; font-size:12px; letter-spacing:0; color:var(--marca); }
.radio{ appearance:none; margin:0; width:18px; height:18px; border-radius:999px; border:1px solid #D6D6D0; background:linear-gradient(180deg,#fff,#FAFAF9); box-shadow:inset 0 1px 1px rgba(14,18,56,.06); cursor:pointer; transition:background .15s ease-out, border-color .15s ease-out; }
.radio:checked{ border-color:#070A26; background:radial-gradient(circle,#fff 0 3px,transparent 3.5px), linear-gradient(180deg,#1C2150,var(--tinta)); box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 1px 2px rgba(14,18,56,.3); }
.caminho h3{ margin-top:22px; font-size:20px; letter-spacing:-.02em; line-height:1.3; }
.caminho .d{ margin-top:6px; font-size:14px; color:var(--t2); }
.cm-corpo{ margin-top:24px; }
.agente{ display:flex; align-items:center; gap:12px; margin-bottom:12px; font-size:16px; }
.lista li{ padding:9px 0; font-size:14px; border-top:1px solid var(--div); }
.lista.c li{ color:var(--t2); }
.lista.dores li{ color:var(--tinta); }
.lista.dores li span{ display:block; font-size:12px; letter-spacing:0; color:var(--t3); margin-top:1px; }
.exemplo{ font-size:14px; color:var(--t2); padding-top:9px; border-top:1px solid var(--div); }
.outro{ margin-top:28px; }

/* ===== TELA 3 ===== */
.sec{ margin-top:48px; }
.sec h2{ font-size:16px; font-weight:500; letter-spacing:-.01em; padding-bottom:12px; border-bottom:1px solid var(--tinta); }
.linha{ display:grid; grid-template-columns:34px minmax(0,1fr) 160px; gap:0 16px; align-items:start; padding:14px 0; border-bottom:1px solid var(--div); transition:opacity .15s ease-out; }
.linha.off > :not(:first-child){ opacity:.45; }
.linha .nm{ display:flex; align-items:flex-start; gap:14px; }
.linha .nm p{ font-size:14px; }
.linha .nm p span{ display:block; color:var(--t2); margin-top:2px; }
.linha .nm p small{ display:block; font-size:12px; letter-spacing:0; color:var(--t3); margin-top:4px; }
.logo-ferr{ width:28px; height:28px; border-radius:8px; background:#fff; box-shadow:inset 0 0 0 1px var(--div); display:grid; place-items:center; flex:0 0 auto; margin-top:-2px; }
.logo-ferr img{ width:62%; height:62%; object-fit:contain; display:block; }
.est{ display:inline-flex; align-items:center; gap:7px; font-size:12px; letter-spacing:0; color:var(--t2); white-space:nowrap; padding-top:2px; }
.est i{ width:6px; height:6px; border-radius:999px; }
.est .ok{ background:var(--verde); } .est .ag{ background:var(--ambar); }
.check{ appearance:none; margin:1px 0 0; width:18px; height:18px; border-radius:6px; border:1px solid #D6D6D0; background:linear-gradient(180deg,#fff,#FAFAF9); box-shadow:inset 0 1px 1px rgba(14,18,56,.06); cursor:pointer; position:relative; transition:background .15s ease-out, border-color .15s ease-out; }
.check:checked{ border-color:#070A26; background:linear-gradient(180deg,#1C2150,var(--tinta)); box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 1px 2px rgba(14,18,56,.3); }
.check:checked::after{ content:""; position:absolute; left:5.5px; top:2.5px; width:5px; height:9px; border:solid #fff; border-width:0 1.8px 1.8px 0; transform:rotate(42deg); }
.pe{ margin-top:14px; }
.lacuna{ display:flex; gap:10px; align-items:baseline; margin-top:18px; font-size:14px; color:var(--t2); }
.lacuna i{ width:6px; height:6px; border-radius:999px; background:var(--ambar); flex:0 0 auto; transform:translateY(-2px); }

/* ===== chrome agrupado ===== */
.grupos{ display:flex; gap:28px; margin-left:auto; overflow-x:auto; scrollbar-width:none; }
.grupos::-webkit-scrollbar{ display:none; }
.grp{ display:flex; gap:14px; align-items:center; white-space:nowrap; }
.grp span{ color:#BDB8B1; }

/* ===== estados de botão ===== */
.btn-p:disabled{ cursor:not-allowed; color:var(--t3); border-color:var(--div); background:var(--sup-2); box-shadow:none; transform:none; }
.btn-c{ color:var(--tinta); background:linear-gradient(180deg,#fff,#F4F4F2); border-color:rgba(255,255,255,.6); box-shadow:inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.18); }
.btn-c:hover{ background:#fff; }
.btn-c:active{ transform:translateY(.5px); box-shadow:none; }
.btn-s{ color:var(--tinta); border-color:var(--div); background:linear-gradient(180deg,#fff,#FAFAF9); box-shadow:0 1px 2px rgba(14,18,56,.06); padding:8px 16px; }
.btn-s:hover{ border-color:#DEDEDA; }
.btn-s:active{ transform:translateY(.5px); box-shadow:none; }

/* ===== diagnóstico: uma pergunta por vez ===== */
.pergunta{ max-width:640px; margin:0 auto; padding-top:56px; }
.pergunta .frase{ margin-top:12px; }
.alts{ margin-top:36px; border-top:1px solid var(--div); }
.alt{ display:grid; grid-template-columns:18px 1fr; gap:16px; align-items:start; padding:16px 12px; border-bottom:1px solid var(--div); cursor:pointer; transition:background .15s ease-out; }
.alt:hover{ background:var(--sup-1); }
.alt:has(input:checked){ background:var(--sup-1); }
.alt:has(input:focus-visible){ outline:2px solid var(--info); outline-offset:-2px; }
.alt .radio{ margin-top:2px; }
.alt p{ font-size:16px; }
.alt p span{ display:block; font-size:14px; color:var(--t2); margin-top:2px; }
.voltar-resp{ margin-top:24px; }

/* ===== campo e gravação ===== */
.campo{ margin-top:32px; border:1px solid var(--div); border-radius:8px; background:var(--sup-1); box-shadow:inset 0 1px 1px rgba(14,18,56,.05); transition:border-color .15s ease-out, background .15s ease-out; }
.campo:focus-within{ border-color:#C9C9C2; background:#fff; }
.campo textarea{ display:block; width:100%; min-height:148px; resize:vertical; border:0; outline:0; background:transparent; padding:16px; font:inherit; font-size:16px; line-height:1.55; color:var(--tinta); }
.campo textarea::placeholder{ color:var(--t3); }
.campo-pe{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 12px 10px 16px; border-top:1px solid var(--div); }
.gravar{ display:inline-flex; align-items:center; gap:10px; }
.gravar .rec{ width:36px; height:36px; border-radius:999px; display:grid; place-items:center; cursor:pointer; border:1px solid var(--div); background:linear-gradient(180deg,#fff,#FAFAF9); box-shadow:0 1px 2px rgba(14,18,56,.06); }
.gravar .rec:active{ transform:translateY(.5px); box-shadow:none; }
.gravar .rec i{ width:10px; height:10px; border-radius:999px; background:#C0362C; transition:border-radius .15s ease-out; }
.gravando .rec{ border-color:#070A26; background:linear-gradient(180deg,#1C2150,var(--tinta)); box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 1px 2px rgba(14,18,56,.3); }
.gravando .rec i{ border-radius:2px; background:#fff; }
.onda{ display:none; align-items:center; gap:2px; height:18px; }
.gravando .onda{ display:inline-flex; }
.onda b{ display:block; width:2px; border-radius:1px; background:var(--tinta); }
.anexo{ display:inline-flex; align-items:center; gap:8px; }

/* ===== resultado do diagnóstico ===== */
.resultado{ display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:72px; padding-top:40px; }
.resultado .t40{ max-width:14ch; }
.resultado .frase{ margin-top:20px; max-width:38ch; }
.resultado .acoes{ display:flex; align-items:center; gap:24px; margin-top:32px; flex-wrap:wrap; }
.contraste{ background:var(--marca); color:#fff; border-radius:24px; padding:28px 32px; }
.contraste .rot2{ font-size:12px; letter-spacing:0; color:rgba(255,255,255,.55); }
.estagios{ display:flex; gap:6px; margin-top:16px; }
.estagios i{ flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,.16); }
.estagios i.f{ background:#fff; }
.estagios-r{ display:flex; justify-content:space-between; margin-top:8px; font-size:12px; letter-spacing:0; color:rgba(255,255,255,.5); }
.contraste .gargalo{ margin-top:24px; padding-top:20px; border-top:1px solid rgba(255,255,255,.16); }
.contraste .gargalo p{ font-size:20px; letter-spacing:-.02em; line-height:1.35; margin-top:6px; }
.bloco-ev{ margin-top:40px; }
.bloco-ev h2{ font-size:14px; color:var(--t2); padding-bottom:10px; border-bottom:1px solid var(--div); }
.ganhos{ display:grid; grid-template-columns:repeat(3,1fr); }
.ganhos div{ padding:16px 16px 0 0; }
.ganhos div + div{ padding-left:16px; border-left:1px solid var(--div); }
.ganhos .v{ display:block; font-family:var(--fd); font-size:28px; letter-spacing:-.03em; line-height:1.1; }
.ganhos .r{ display:block; margin-top:4px; font-size:14px; color:var(--t2); }
.ganhos .p{ display:block; margin-top:8px; font-size:12px; letter-spacing:0; color:var(--t3); }
.ganhos .v.nd{ font-family:var(--fb); font-size:14px; letter-spacing:-.01em; color:var(--t2); line-height:1.5; padding-top:4px; }
.apl li{ display:grid; grid-template-columns:1fr auto; gap:16px; padding:12px 0; border-bottom:1px solid var(--div); font-size:14px; }
.apl li span{ color:var(--t3); font-size:12px; letter-spacing:0; }

/* ===== instalação ===== */
.inst{ max-width:720px; padding-top:40px; }
.inst .frase{ margin-top:12px; }
.etapas{ margin-top:36px; border-top:1px solid var(--div); }
.etapa{ border-bottom:1px solid var(--div); }
.etapa-cab{ display:grid; grid-template-columns:28px 1fr auto; gap:12px; align-items:center; padding:16px 0; }
.etapa-cab .n{ width:22px; height:22px; border-radius:999px; display:grid; place-items:center; font-size:12px; letter-spacing:0; color:var(--t3); box-shadow:inset 0 0 0 1px var(--div); }
.etapa.feita .etapa-cab .n{ box-shadow:none; background:transparent; }
.etapa.atual .etapa-cab .n{ color:#fff; background:var(--tinta); box-shadow:none; }
.etapa-cab h3{ font-size:16px; }
.etapa:not(.atual):not(.feita) .etapa-cab h3{ color:var(--t3); }
.etapa .corpo-e{ display:none; padding:0 0 24px 40px; }
.etapa.atual .corpo-e{ display:block; }
.corpo-e > p{ font-size:14px; color:var(--t2); max-width:56ch; }
.cod{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; padding:12px 12px 12px 16px; border-radius:8px; background:var(--sup-2); box-shadow:inset 0 1px 1px rgba(14,18,56,.05); font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:13px; letter-spacing:0; overflow-x:auto; }
.cod code{ white-space:nowrap; }
.esperado{ margin-top:16px; font-size:14px; }
.esperado span{ color:var(--t3); font-size:12px; letter-spacing:0; display:block; margin-bottom:2px; }
.dica{ display:grid; grid-template-columns:22px 1fr; gap:12px; margin-top:20px; padding-top:16px; border-top:1px solid var(--div); font-size:14px; color:var(--t2); }
.dica em{ font-style:normal; color:var(--tinta); }
.dica .glifo{ --g:22px; }
.credenciais{ margin-top:28px; font-size:12px; letter-spacing:0; color:var(--t3); }

/* ===== casca do app ===== */
.app{ display:grid; grid-template-columns:232px minmax(0,1fr); min-height:calc(100vh - 33px); }
.lateral{ background:var(--sup-1); border-right:1px solid var(--div); padding:20px 14px; display:flex; flex-direction:column; gap:22px; }
.lateral .logo{ padding:0 8px; }
.empresa{ display:flex; align-items:center; gap:10px; width:100%; padding:7px 12px 7px 7px; border-radius:999px; border:1px solid var(--div); background:linear-gradient(180deg,#fff,#FAFAF9); box-shadow:0 1px 2px rgba(14,18,56,.05); font-size:14px; cursor:pointer; text-align:left; }
.empresa:hover{ border-color:#DEDEDA; }
.empresa .ini{ width:24px; height:24px; border-radius:7px; background:var(--tinta); color:#fff; font-size:12px; letter-spacing:0; display:grid; place-items:center; flex:0 0 auto; }
.empresa svg{ margin-left:auto; }
.nav a{ display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:8px; font-size:14px; color:var(--t2); text-decoration:none; }
.nav a:hover{ color:var(--tinta); }
.nav a[aria-current="page"]{ color:var(--tinta); background:var(--sup-2); }
.nav svg{ flex:0 0 auto; }
.pessoa{ margin-top:auto; display:flex; align-items:center; gap:10px; padding:0 8px; font-size:14px; }
.av{ width:28px; height:28px; border-radius:999px; background:#E7E3DD; color:var(--t2); display:grid; place-items:center; font-size:12px; letter-spacing:0; flex:0 0 auto; }
.pessoa span{ display:block; font-size:12px; letter-spacing:0; color:var(--t3); }
.pessoa .av{ display:grid; place-items:center; width:32px; height:32px; font-size:12px; font-weight:500; line-height:1; color:var(--tinta); background:#E7E3DD; }
.pessoa div{ line-height:1.3; }
.conteudo{ padding:40px 48px 140px; max-width:1180px; width:100%; }
.estado-tela{ display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:64px; align-items:start; }
.saud{ font-size:14px; color:var(--t3); }
.resumo{ margin-top:10px; font-size:20px; line-height:1.45; letter-spacing:-.02em; color:var(--t2); }
.resumo em{ font-style:normal; color:var(--tinta); }
.contraste.prox{ margin-top:32px; }
.contraste.prox h2{ margin-top:8px; }
.contraste.prox p.d{ margin-top:10px; font-size:14px; color:rgba(255,255,255,.66); }
.contraste .acoes-c{ display:flex; align-items:center; gap:20px; margin-top:24px; }
.contraste .lk-c{ background:none; border:0; padding:0; cursor:pointer; font-size:14px; color:rgba(255,255,255,.75); }
.contraste .lk-c:hover{ color:#fff; }
.insight{ margin-top:32px; display:grid; grid-template-columns:22px 1fr; gap:12px; font-size:14px; color:var(--t2); }
.insight .glifo{ --g:22px; }
.insight em{ font-style:normal; color:var(--tinta); }
.insight button{ margin-top:8px; }
.limite{ margin-top:36px; padding-top:16px; border-top:1px solid var(--div); }
.limite .l1{ display:flex; justify-content:space-between; font-size:14px; }
.limite .l1 span:first-child{ color:var(--t2); }
.limite .tr{ height:3px; border-radius:2px; background:var(--div); margin-top:10px; overflow:hidden; }
.limite .tr span{ display:block; height:100%; width:62%; background:var(--tinta); }
.limite .pe-l{ display:flex; justify-content:space-between; margin-top:8px; font-size:12px; letter-spacing:0; color:var(--t3); }
.limite .pe-l .lk{ font-size:12px; letter-spacing:0; }
.trilha-cab{ display:flex; justify-content:space-between; align-items:baseline; padding-bottom:10px; border-bottom:1px solid var(--div); }
.trilha-cab h2{ font-size:14px; font-weight:400; font-family:var(--fb); letter-spacing:-.01em; color:var(--t2); }
.trilha-cab span{ font-size:12px; letter-spacing:0; color:var(--t3); }
.passos li{ display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center; min-height:48px; padding:0; border-bottom:1px solid var(--div); font-size:14px; }
.passos .k{ font-size:12px; letter-spacing:0; color:var(--t3); }
.passos li.feito{ color:var(--t2); }
.passos li.agora{ color:var(--tinta); }
.passos li.depois{ color:var(--t3); }
.passos .ck{ font-size:12px; letter-spacing:0; color:var(--t3); }
.st{ display:inline-flex; align-items:center; gap:6px; font-size:12px; letter-spacing:0; color:var(--t2); white-space:nowrap; }
.st .reticencia{ display:inline-flex; gap:2px; }
.st .reticencia i{ width:3px; height:3px; border-radius:999px; background:var(--ambar); }
.blocos-f{ margin-top:20px; }
.blocos-f li{ display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--div); font-size:14px; color:var(--t3); }
.consultor-app{ position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:calc(232px + (100% - 232px)/2); transform:translateX(-50%); width:min(460px, calc(100% - 232px - 48px)); z-index:20; }

/* ===== lista de agentes ===== */
.lista-cab{ display:flex; justify-content:space-between; align-items:center; gap:24px; }
.filtros{ display:flex; gap:24px; margin-top:28px; border-bottom:1px solid var(--div); }
.filtro{ background:none; border:0; padding:0 0 12px; cursor:pointer; font-size:14px; color:var(--t3); position:relative; }
.filtro .num{ margin-left:6px; }
.filtro[aria-selected="true"]{ color:var(--tinta); }
.filtro[aria-selected="true"]::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--tinta); }
.tabela{ width:100%; border-collapse:collapse; margin-top:4px; }
.tabela th{ text-align:left; font-weight:400; font-size:12px; letter-spacing:0; color:var(--t3); padding:14px 16px 8px 0; border-bottom:1px solid var(--div); }
.tabela td{ padding:12px 16px 12px 0; border-bottom:1px solid var(--div); font-size:14px; vertical-align:middle; }
.tabela tr:hover td{ background:var(--sup-1); }
.tabela td:first-child{ padding-left:4px; }
.ag-nome{ display:flex; align-items:center; gap:12px; }
.ag-nome .glifo{ --g:28px; }
.ag-nome div > span{ display:block; font-size:12px; letter-spacing:0; color:var(--t3); }
.resp-p{ display:flex; align-items:center; gap:8px; }
.resp-p .av{ width:22px; height:22px; font-size:11px; }
.c2t{ color:var(--t2); }
.mais{ position:relative; }
.mais > button{ width:30px; height:30px; border-radius:8px; border:0; background:transparent; cursor:pointer; display:grid; place-items:center; color:var(--t2); }
.mais > button:hover, .mais > button[aria-expanded="true"]{ background:var(--sup-2); color:var(--tinta); }
.menu{ position:absolute; right:0; top:36px; z-index:30; width:220px; padding:6px; background:#fff; border:1px solid var(--div); border-radius:20px; box-shadow:0 1px 3px rgba(14,18,56,.08), 0 18px 40px -12px rgba(14,18,56,.24); opacity:0; transform:translateY(-4px) scale(.98); transform-origin:top right; pointer-events:none; transition:opacity .16s ease-out, transform .16s cubic-bezier(.2,.8,.2,1); }
.menu{ visibility:hidden; }
.menu.aberto{ opacity:1; transform:none; pointer-events:auto; visibility:visible; }
.menu button{ display:block; width:100%; text-align:left; background:none; border:0; padding:9px 12px; border-radius:12px; font-size:14px; cursor:pointer; }
.menu button:hover{ background:var(--sup-2); }
.menu hr{ border:0; border-top:1px solid var(--div); margin:6px 4px; }
.menu .perigo{ color:#C0362C; }

/* ===== marco ===== */
.marco{ min-height:calc(100vh - 33px); background:var(--marca); color:#fff; display:flex; flex-direction:column; }
.marco .topo a{ color:rgba(255,255,255,.7); }
.marco .logo b{ color:#fff; }
.marco-capa{ flex:1; display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:0 32px; align-content:center; max-width:1200px; width:100%; margin:0 auto; padding:48px 40px 72px; }
.marco-capa .esq{ grid-column:1 / span 7; }
.marco-capa .rot2{ font-size:14px; color:rgba(255,255,255,.6); }
.marco-capa .t40{ margin-top:16px; max-width:15ch; }
.marco-capa .acoes-c{ display:flex; align-items:center; gap:24px; margin-top:40px; }
.marco-capa .dir{ grid-column:9 / span 4; align-self:end; }
.marco-capa .dir li{ padding:16px 0; border-top:1px solid rgba(255,255,255,.18); }
.marco-capa .dir .v{ display:block; font-family:var(--fd); font-size:28px; letter-spacing:-.03em; line-height:1.1; }
.marco-capa .dir .r{ display:block; margin-top:4px; font-size:14px; color:rgba(255,255,255,.6); }
.marco .lk-c{ background:none; border:0; padding:0; cursor:pointer; font-size:14px; color:rgba(255,255,255,.75); }
.marco .lk-c:hover{ color:#fff; }
.glifo-marco{ --g:56px; background:rgba(255,255,255,.14); margin-bottom:28px; }


/* ===== tabelas, segundo a referência do painel de faturamento ===== */
.tb{ width:100%; border-collapse:collapse; }
.tb th{ text-align:left; font-weight:400; font-size:12px; letter-spacing:0; color:var(--t3); padding:0 16px 10px 0; border-bottom:1px solid var(--div); white-space:nowrap; }
.tb td{ height:48px; padding:0 16px 0 0; border-bottom:1px solid var(--div); font-size:14px; color:var(--tinta); vertical-align:middle; }
.tb .vazio{ color:var(--t3); }
.tb .nome{ display:inline-flex; align-items:center; gap:12px; white-space:nowrap; }
.tb .nome img{ width:16px; height:16px; object-fit:contain; display:block; }
.tb .nome .glifo{ --g:18px; border-radius:5px; gap:3px; }
.tb .col-c{ width:34px; }
.tb .col-st{ width:48px; text-align:right; padding-right:0; }
.tb .col-mais{ width:40px; text-align:right; padding-right:0; }
.tb tr.off td:not(.col-c){ opacity:.4; transition:opacity .15s ease-out; }
.tb .m-desc{ display:none; }
.si{ display:inline-grid; place-items:center; width:16px; height:16px; border-radius:999px; vertical-align:middle; }
.si.ok{ background:var(--verde); } .si.ag{ background:var(--ambar); } .si.er{ background:#C0362C; }
.si.nd{ box-shadow:inset 0 0 0 1.5px #C9C9C2; }
.sec-t{ display:flex; justify-content:space-between; align-items:center; gap:16px; }
.sec-t h2{ font-family:var(--fb); font-size:14px; font-weight:400; letter-spacing:-.01em; color:var(--t2); }
.totais{ display:flex; flex-wrap:wrap; gap:6px 28px; margin:8px 0 20px; }
.totais span{ font-size:14px; letter-spacing:-.01em; }
.totais .ok{ color:var(--verde); } .totais .ag{ color:var(--ambar); } .totais .nd{ color:var(--t3); }
.sec .sec-t h2{ border:0; padding:0; }
.tb td.num{ white-space:nowrap; }
.chrome{ flex-wrap:wrap; row-gap:6px; }
.busca{ width:36px; height:36px; border-radius:999px; border:0; background:var(--sup-2); display:grid; place-items:center; cursor:pointer; color:var(--tinta); }
.busca:hover{ background:var(--div); }


/* ===== personagem do agente (glifo, A, B, C) ===== */
.px{ display:inline-block; flex:0 0 auto; line-height:0; }
.px svg{ display:block; }
.px-marco{ margin-bottom:28px; }
.dica .px, .insight .px{ margin-top:1px; }
.seletor{ display:flex; align-items:center; gap:14px; white-space:nowrap; }
.seletor span{ color:#BDB8B1; }
.aba-px{ background:none; border:0; padding:2px 0; cursor:pointer; font-size:12px; letter-spacing:0; color:var(--t3); }
.aba-px[aria-checked="true"]{ color:var(--tinta); }
@media (max-width:900px){ .chrome{ flex-wrap:wrap; row-gap:6px; } .seletor{ width:100%; overflow-x:auto; } }


/* ===== reaproveitados do Pixel AI Hub e da landing ===== */
/* áreas com prioridade */
.duas-col{ display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:64px; align-items:start; padding-top:40px; }
.duas-col .frase{ margin-top:12px; max-width:52ch; }
.areas{ display:grid; grid-template-columns:1fr 1fr; gap:0 24px; margin-top:32px; border-top:1px solid var(--div); }
.area{ display:grid; grid-template-columns:22px 1fr 22px; gap:14px; align-items:center; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--div); padding:14px 8px; cursor:pointer; transition:background .15s ease-out; }
.area:hover, .area[aria-pressed="true"]{ background:var(--sup-1); }
.area p{ font-size:14px; }
.area p span{ display:block; color:var(--t2); margin-top:1px; }
.ordem{ width:20px; height:20px; border-radius:999px; display:grid; place-items:center; font-size:12px; letter-spacing:0; color:#fff; box-shadow:inset 0 0 0 1px #D6D6D0; background:linear-gradient(180deg,#fff,#FAFAF9); transition:background .15s ease-out; }
.area[aria-pressed="true"] .ordem{ box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 1px 2px rgba(14,18,56,.3); background:linear-gradient(180deg,#1C2150,var(--tinta)); }
.area.outra{ grid-template-columns:22px 1fr; }
.area.outra .mais-ic{ width:22px; height:22px; border-radius:7px; box-shadow:inset 0 0 0 1px var(--div); display:grid; place-items:center; color:var(--t3); }
.limite-aviso{ min-height:20px; margin-top:12px; font-size:14px; color:var(--ambar); }
.previa{ position:sticky; top:24px; background:var(--sup-1); border-radius:24px; padding:32px; }
.previa .rot{ font-size:12px; letter-spacing:0; color:var(--t3); }
.previa h2{ margin-top:20px; font-family:var(--fd); font-size:28px; letter-spacing:-.03em; line-height:1.14; }
.previa .tarefa{ margin-top:24px; padding-top:16px; border-top:1px solid var(--div); font-size:14px; }
.previa .tarefa span{ display:block; font-size:12px; letter-spacing:0; color:var(--t3); margin-bottom:4px; }
.prios{ margin-top:24px; padding-top:16px; border-top:1px solid var(--div); }
.prios .rot{ margin-bottom:4px; }
.prios .lista-p li{ display:grid; grid-template-columns:18px 1fr auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--div); font-size:14px; }
.prios .lista-p li:first-child{ padding-top:4px; }
.prios .lista-p li:last-child{ border-bottom:0; padding-bottom:0; }
.tag-p{ display:inline-flex; align-items:center; padding:2px 10px; border-radius:999px; font-size:12px; letter-spacing:0; color:var(--tinta); white-space:nowrap; background:color-mix(in srgb, var(--c) 12%, #fff); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 34%, transparent), inset 0 1px 0 rgba(255,255,255,.7); }

.prios .nota{ margin-top:16px; font-size:12px; letter-spacing:0; color:var(--t3); }
.previa .vazia{ color:var(--t3); font-size:14px; margin-top:12px; }
.previa .px-wrap{ margin-top:16px; display:flex; align-items:flex-start; }

/* cases na abertura */
.cases{ display:grid; grid-template-columns:repeat(3,1fr); gap:32px; margin-top:56px; }
.case{ border-top:1px solid var(--div); padding-top:16px; }
.case .v{ display:block; font-family:var(--fd); font-size:28px; letter-spacing:-.03em; line-height:1.1; }
.case p{ margin-top:8px; font-size:14px; color:var(--t2); }
.case .quem{ margin-top:12px; font-size:12px; letter-spacing:0; color:var(--t3); }
.case .quem b{ font-weight:400; color:var(--tinta); }

/* requisitos no plano */
.requisitos{ margin-top:40px; padding-top:16px; border-top:1px solid var(--div); }
.requisitos h2{ font-family:var(--fb); font-size:14px; color:var(--t2); }
.requisitos li{ display:grid; grid-template-columns:20px 1fr; gap:10px; padding:10px 0; border-bottom:1px solid var(--div); font-size:14px; }
.requisitos li .k{ font-size:12px; letter-spacing:0; color:var(--t3); padding-top:2px; }

/* feed do início */
.feed{ margin-top:40px; }
.feed li{ display:grid; grid-template-columns:22px 1fr auto; gap:12px; align-items:start; padding:12px 0; border-bottom:1px solid var(--div); font-size:14px; }
.feed li b{ font-weight:400; display:block; font-size:12px; letter-spacing:0; color:var(--t3); margin-bottom:2px; }
.feed li .h{ font-size:12px; letter-spacing:0; color:var(--t3); padding-top:2px; }

/* tela do agente */
.ag-tela{ display:grid; grid-template-columns:minmax(0,7fr) minmax(0,4fr); gap:56px; align-items:start; }
.ag-cab{ display:flex; align-items:center; gap:16px; }
.ag-cab .sub{ font-size:14px; color:var(--t2); margin-top:2px; display:flex; align-items:center; gap:8px; }
.exec{ margin-top:36px; }
.exec-cab{ display:flex; justify-content:space-between; align-items:baseline; padding-bottom:10px; border-bottom:1px solid var(--div); }
.exec-cab h2{ font-family:var(--fb); font-size:14px; color:var(--t2); }
.exec-cab span{ font-size:12px; letter-spacing:0; color:var(--t3); }
.exec-titulo{ margin-top:16px; font-size:20px; letter-spacing:-.02em; line-height:1.35; }
.passo-ex{ display:grid; grid-template-columns:24px 1fr auto auto; gap:12px; align-items:center; min-height:44px; border-bottom:1px solid var(--div); font-size:14px; }
.passo-ex .fer{ display:inline-flex; align-items:center; gap:6px; font-size:12px; letter-spacing:0; color:var(--t2); }
.passo-ex .fer img{ width:14px; height:14px; object-fit:contain; }
.passo-ex .h{ font-size:12px; letter-spacing:0; color:var(--t3); width:40px; text-align:right; }
.resultado-ex{ margin-top:16px; padding:16px 20px; border-radius:12px; background:var(--sup-1); }
.resultado-ex span{ display:block; font-size:12px; letter-spacing:0; color:var(--t3); }
.resultado-ex p{ margin-top:4px; font-family:var(--fd); font-size:20px; letter-spacing:-.02em; }
.painel{ border-left:1px solid var(--div); padding-left:32px; }
.painel section + section{ margin-top:32px; }
.painel h2{ display:flex; justify-content:space-between; align-items:baseline; font-family:var(--fb); font-size:14px; color:var(--t2); padding-bottom:10px; border-bottom:1px solid var(--div); }
.painel h2 .lk{ font-size:12px; letter-spacing:0; }
.instrucoes{ margin-top:12px; padding:12px 14px; border-radius:8px; background:var(--sup-1); box-shadow:inset 0 1px 1px rgba(14,18,56,.05); font-size:14px; line-height:1.55; }
.painel li{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:42px; border-bottom:1px solid var(--div); font-size:14px; }
.painel li .nome{ display:inline-flex; align-items:center; gap:10px; }
.painel li .nome img{ width:16px; height:16px; object-fit:contain; }
.painel .gat li{ justify-content:flex-start; gap:10px; }
.painel .gat svg{ color:var(--t3); flex:0 0 auto; }

/* estado vazio */
.vazio-tela{ max-width:560px; padding-top:0; }
.vazio-tela .frase{ margin-top:12px; }
.vazio-tela .acoes{ margin-top:28px; }
.vazio-tela .por-area{ margin-top:56px; }
.vazio-tela .por-area p{ font-size:12px; letter-spacing:0; color:var(--t3); padding-bottom:10px; border-bottom:1px solid var(--div); }
.vazio-tela .por-area button{ display:grid; grid-template-columns:22px 1fr; gap:12px; align-items:center; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--div); min-height:48px; font-size:14px; cursor:pointer; }
.vazio-tela .por-area button span span{ color:var(--t2); }
.vazio-tela .por-area button:hover{ background:var(--sup-1); }

/* modal de plano */
.veu{ position:fixed; inset:0; z-index:50; background:rgba(14,18,56,.24); display:grid; place-items:center; padding:24px; opacity:0; pointer-events:none; transition:opacity .18s ease-out; }
.veu.aberto{ opacity:1; pointer-events:auto; }
.modal{ width:min(880px,100%); max-height:calc(100vh - 48px); overflow:auto; background:#fff; border-radius:16px; box-shadow:0 2px 6px rgba(14,18,56,.08), 0 30px 70px -20px rgba(14,18,56,.4); padding:32px; transform:translateY(8px) scale(.99); transition:transform .2s cubic-bezier(.2,.8,.2,1); }
.veu.aberto .modal{ transform:none; }
.modal-cab{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
.fechar{ width:32px; height:32px; border-radius:999px; border:0; background:var(--sup-2); display:grid; place-items:center; cursor:pointer; color:var(--t2); }
.fechar:hover{ color:var(--tinta); }
.planos{ display:grid; grid-template-columns:repeat(3,1fr); margin-top:28px; border-top:1px solid var(--div); }
.plano{ padding:20px 24px 4px 0; }
.plano + .plano{ padding-left:24px; border-left:1px solid var(--div); }
.plano.atual{ }
.plano .tag{ font-size:12px; letter-spacing:0; color:var(--marca); min-height:18px; }
.plano h3{ margin-top:6px; font-size:16px; }
.plano .quem{ font-size:14px; color:var(--t2); }
.plano .preco{ margin-top:16px; font-family:var(--fd); font-size:28px; letter-spacing:-.03em; line-height:1.1; }
.plano .preco-n{ font-size:12px; letter-spacing:0; color:var(--t3); margin-top:4px; }
.plano ul{ margin-top:16px; }
.plano li{ font-size:14px; padding:8px 0; border-top:1px solid var(--div); }
.plano .acao{ margin-top:16px; }
.franquia-m{ margin-top:28px; padding-top:16px; border-top:1px solid var(--div); display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; font-size:14px; }
.franquia-m span{ color:var(--t2); }


/* ===== instalação, redesenho: etapa atual em foco, mapa e prévia ao lado ===== */
.inst2{ display:grid; grid-template-columns:minmax(0,7fr) minmax(0,4fr); gap:64px; align-items:start; padding-top:40px; }
.inst-foco .frase{ margin-top:12px; }
.foco{ margin-top:36px; padding-top:28px; border-top:1px solid var(--div); outline:0; }
.foco.troca{ animation:foco-in .18s ease-out; }
@keyframes foco-in{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }
.foco-cab{ display:flex; align-items:center; gap:12px; }
.foco-cab .n{ width:28px; height:28px; border-radius:999px; display:grid; place-items:center; font-size:14px; color:#fff; background:var(--tinta); flex:0 0 auto; }

.foco > p{ margin-top:16px; font-size:16px; color:var(--t2); max-width:54ch; }
.foco .cod{ margin-top:20px; }
.foco .campo-tk{ margin-top:20px; display:flex; gap:8px; }
.foco .campo-tk input{ flex:1; min-width:0; border:1px solid var(--div); border-radius:8px; background:var(--sup-1); box-shadow:inset 0 1px 1px rgba(14,18,56,.05); padding:11px 14px; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:13px; color:var(--tinta); outline:0; }
.foco .campo-tk input:focus{ border-color:#C9C9C2; background:#fff; }

.foco .dica{ margin-top:24px; }

.mapa li{ display:grid; grid-template-columns:24px 1fr auto; gap:12px; align-items:center; min-height:48px; border-bottom:1px solid var(--div); font-size:14px; color:var(--t3); }
.mapa li .k{ width:22px; height:22px; border-radius:999px; display:grid; place-items:center; font-size:12px; letter-spacing:0; box-shadow:inset 0 0 0 1px var(--div); }
.mapa li.feita{ color:var(--t2); } .mapa li.feita .k{ box-shadow:none; }
.mapa li.atual{ color:var(--tinta); } .mapa li.atual .k{ box-shadow:none; background:var(--tinta); color:#fff; }
.previa-inst{ position:static; margin-top:32px; }
.pi-topo{ display:flex; justify-content:space-between; align-items:flex-start; }
.previa-inst h2{ margin-top:16px; font-size:20px; letter-spacing:-.02em; }
.pi-dados{ margin:16px 0 0; }
.pi-dados div{ padding:12px 0; border-top:1px solid var(--div); }
.pi-dados dt{ font-size:12px; letter-spacing:0; color:var(--t3); }
.pi-dados dd{ margin:4px 0 0; font-size:14px; }
.pi-dados dd.pend{ color:var(--t3); }


/* ===== execuções anteriores: resumo em frase, pendência no topo, agrupado por dia, linhas que abrem ===== */
.hist .sec-t h2{ font-size:14px; }
.hist-resumo{ margin-top:10px; font-size:16px; }
.pendente{ display:flex; align-items:center; justify-content:space-between; gap:20px; margin-top:20px; padding:16px 16px 16px 20px; border-radius:12px; background:color-mix(in srgb, var(--ambar) 7%, #fff); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--ambar) 22%, transparent); }
.pend-txt{ display:flex; align-items:baseline; gap:12px; font-size:14px; }
.pend-txt b{ font-weight:400; color:var(--tinta); }
.pend-txt p{ color:var(--t2); }
.pend-txt .tag-p{ flex:0 0 auto; transform:translateY(-1px); }
.pendente .btn{ padding:9px 18px; }
.dia{ margin-top:28px; }
.dia-cab{ display:flex; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid var(--div); font-size:12px; letter-spacing:0; color:var(--t3); }
.dia-cab span:first-child{ color:var(--tinta); }
.run{ border-bottom:1px solid var(--div); }
.run summary{ list-style:none; display:grid; grid-template-columns:52px minmax(0,1fr) auto 20px; gap:12px; align-items:center; min-height:52px; cursor:pointer; font-size:14px; }
.run summary::-webkit-details-marker{ display:none; }
.run summary:hover .o b{ text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--div); }
.run summary:focus-visible{ outline:2px solid var(--info); outline-offset:2px; border-radius:6px; }
.run .h{ font-size:12px; letter-spacing:0; color:var(--t3); }
.run .o{ min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.run .o b{ font-weight:400; color:var(--tinta); margin-right:8px; }
.run .o span{ color:var(--t2); }
.run .chev{ color:var(--t3); transition:transform .15s ease-out; }
.run[open] .chev{ transform:rotate(90deg); }
.run-passos{ margin:0 0 14px 64px; border-top:1px solid var(--div); }
.run-passos .passo-ex{ min-height:38px; }

/* ===================== prova de trabalho ===================== */
body{ min-height:100vh; }
.chrome .perfis, .chrome .saltos{ display:flex; gap:14px; align-items:center; white-space:nowrap; }
.chrome .perfis span, .chrome .saltos span{ color:#BDB8B1; }
.chrome button.aba-p{ background:none; border:0; padding:2px 0; cursor:pointer; font-size:12px; letter-spacing:0; color:var(--t3); }
.chrome button.aba-p[aria-checked="true"]{ color:var(--tinta); }
.chrome .grupos{ gap:28px; }

.topo .meio{ display:flex; align-items:center; gap:14px; font-size:16px; font-weight:500; letter-spacing:-.01em; color:var(--tinta); }
.topo .barra-q{ width:200px; height:3px; border-radius:2px; background:var(--div); overflow:hidden; }
.topo .barra-q i{ display:block; height:100%; background:var(--tinta); transition:width .2s ease-out; }
.topo .sair-b{ background:none; border:0; cursor:pointer; font-size:14px; color:var(--t2); }
.topo .sair-b:hover{ color:var(--tinta); }

/* abertura */
.ab-capa{ display:grid; grid-template-columns:minmax(0,6fr) minmax(0,6fr); gap:64px; padding-top:40px; align-items:start; }
.ab-capa .t40{ max-width:16ch; }
.ab-capa .t20{ margin-top:22px; max-width:42ch; color:var(--t2); }
.convite{ display:inline-block; margin-bottom:20px; }
.antes-depois{ border-top:1px solid var(--div); }
.antes-depois .cab{ display:grid; grid-template-columns:1fr 1fr; gap:24px; padding:12px 0 8px; font-size:12px; letter-spacing:0; color:var(--t3); border-bottom:1px solid var(--div); }
.antes-depois .ln{ display:grid; grid-template-columns:1fr 1fr; gap:24px; padding:16px 0; border-bottom:1px solid var(--div); font-size:14px; align-items:start; }
.antes-depois .hoje{ color:var(--t2); }
.antes-depois .com{ display:grid; grid-template-columns:28px 1fr; gap:12px; }
.antes-depois .com b{ display:block; font-weight:400; color:var(--tinta); }
.antes-depois .com span span{ color:var(--t2); }
.cases-cab{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-top:64px; padding-bottom:10px; border-bottom:1px solid var(--div); }
.cases-cab h2{ font-family:var(--fb); font-size:14px; color:var(--t2); }
.cases-cab span{ font-size:12px; letter-spacing:0; color:var(--t3); }
.cases-cab + .cases{ margin-top:16px; }
.case .quem b{ font-weight:400; }

/* diagnóstico em chat */
.chat{ max-width:680px; margin:0 auto; padding:32px 24px calc(var(--dock-h, 320px) + 40px); }
.log{ display:flex; flex-direction:column; gap:16px; }
.msg{ display:grid; grid-template-columns:22px 1fr; gap:12px; font-size:16px; line-height:1.55; }
.msg.bot p{ color:var(--tinta); }
.msg.me{ grid-template-columns:1fr; justify-items:end; }
.msg.me p{ max-width:80%; padding:10px 14px; border-radius:16px 16px 4px 16px; background:var(--sup-2); color:var(--tinta); font-size:14px; }
.msg.esc p{ color:var(--t3); font-size:14px; }
.dock{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:rgba(255,255,255,.97); backdrop-filter:blur(10px); border-top:1px solid var(--div); padding-bottom:env(safe-area-inset-bottom,0px); }
.dock .prog-q{ height:2px; background:transparent; }
.dock .prog-q i{ display:block; height:2px; background:var(--tinta); transition:width .2s ease-out; }
.dock-in{ max-width:680px; margin:0 auto; padding:20px 24px 18px; max-height:62vh; overflow-y:auto; }
.dock-q{ font-size:20px; font-weight:600; line-height:1.35; letter-spacing:-.02em; }
.dock-sub{ margin-top:4px; font-size:14px; color:var(--t2); }
.ops{ margin-top:14px; border-top:1px solid var(--div); }
.op{ display:grid; grid-template-columns:20px 1fr 20px; gap:12px; align-items:center; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--div); padding:11px 6px; cursor:pointer; font-size:14px; color:var(--tinta); transition:background .15s ease-out; }
.op:hover{ background:var(--sup-1); }
.op .k{ font-size:12px; letter-spacing:0; color:var(--t3); }
.op[aria-checked="true"]{ background:var(--sup-1); }
.op .check{ margin:0; pointer-events:none; }
.dock-pe{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:14px; min-height:20px; position:sticky; bottom:-18px; z-index:2; margin-bottom:-18px; padding:12px 0 18px; background:linear-gradient(180deg,rgba(255,255,255,0),#fff 14px); }
.ops.muitas{ display:grid; grid-template-columns:1fr 1fr; column-gap:24px; }
.dock-pe .s12{ color:var(--t3); }
.tbox{ margin-top:14px; border:1px solid var(--div); border-radius:8px; background:var(--sup-1); box-shadow:inset 0 1px 1px rgba(14,18,56,.05); transition:border-color .15s ease-out, background .15s ease-out; }
.tbox:focus-within{ border-color:#C9C9C2; background:#fff; }
.tbox textarea, .tbox input{ display:block; width:100%; border:0; outline:0; background:transparent; font:inherit; font-size:16px; padding:12px 14px; color:var(--tinta); resize:none; }
.tbox textarea{ min-height:52px; }
.tbox .barra-t{ display:flex; align-items:center; gap:14px; padding:8px 8px 8px 14px; border-top:1px solid var(--div); }
.tbox .barra-t .sp{ flex:1; }
.anexo-b{ display:inline-flex; align-items:center; gap:6px; background:none; border:0; cursor:pointer; font-size:14px; color:var(--t2); }
.anexo-b:hover{ color:var(--tinta); }
.chip-anexo{ display:inline-flex; align-items:center; gap:8px; margin:10px 14px 0; }
.chip-anexo button{ background:none; border:0; cursor:pointer; color:var(--t3); padding:0; }
.voz{ display:flex; align-items:center; gap:14px; width:100%; margin-top:14px; padding:14px 16px; border-radius:12px; border:1px solid var(--div); background:linear-gradient(180deg,#fff,#FAFAF9); box-shadow:0 1px 2px rgba(14,18,56,.06); cursor:pointer; text-align:left; }
.voz:hover{ border-color:#DEDEDA; }
.voz .rec{ width:40px; height:40px; border-radius:999px; display:grid; place-items:center; border:1px solid var(--div); background:#fff; flex:0 0 auto; }
.voz .rec i{ width:12px; height:12px; border-radius:999px; background:#C0362C; transition:border-radius .15s ease-out; }
.voz.on .rec{ border-color:#070A26; background:linear-gradient(180deg,#1C2150,var(--tinta)); }
.voz.on .rec i{ border-radius:2px; background:#fff; }
.voz b{ display:block; font-weight:400; font-size:16px; color:var(--tinta); }
.voz span span{ font-size:14px; color:var(--t2); }
.ou{ display:block; margin-top:12px; font-size:12px; letter-spacing:0; color:var(--t3); }
.exemplos{ margin-top:16px; }
.exemplos p{ font-size:12px; letter-spacing:0; color:var(--t3); }
.exemplos .tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
button.tag-p{ border:0; cursor:pointer; font:inherit; font-size:12px; letter-spacing:0; }
button.tag-p:hover{ box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 60%, transparent), 0 1px 2px rgba(14,18,56,.08); }
.outra{ margin-top:12px; }
.outra label{ display:block; font-size:12px; letter-spacing:0; color:var(--t3); margin-bottom:6px; }
.inp{ width:100%; border:1px solid var(--div); border-radius:8px; background:var(--sup-1); box-shadow:inset 0 1px 1px rgba(14,18,56,.05); padding:11px 14px; font:inherit; font-size:14px; color:var(--tinta); outline:0; }
.inp:focus{ border-color:#C9C9C2; background:#fff; }
textarea.inp{ resize:vertical; min-height:72px; line-height:1.5; }
.btn-sm{ padding:8px 16px; }

/* preparando o plano */
.gera{ max-width:560px; margin:0 auto; padding-top:80px; }
.gera .frase{ margin-top:12px; }
.gera .barra-g{ margin-top:28px; height:3px; border-radius:2px; background:var(--div); overflow:hidden; }
.gera .barra-g i{ display:block; height:100%; background:var(--tinta); transition:width .3s ease-out; }
.gera ol{ margin-top:24px; border-top:1px solid var(--div); }
.gera li{ display:grid; grid-template-columns:22px 1fr auto; gap:12px; align-items:center; min-height:46px; border-bottom:1px solid var(--div); font-size:14px; color:var(--t3); transition:color .15s ease-out; }
.gera li.feito, .gera li.agora{ color:var(--tinta); }
.gera li .vz{ width:16px; height:16px; border-radius:999px; box-shadow:inset 0 0 0 1.5px var(--div); }

/* resumo do diagnóstico */
.sum-topo{ display:grid; grid-template-columns:minmax(0,6fr) minmax(0,5fr); gap:64px; padding-top:40px; align-items:start; }
.sum-topo .t40{ margin-top:18px; max-width:14ch; }
.sum-topo .frase{ margin-top:18px; max-width:44ch; font-size:16px; }
.contraste .orig{ margin-top:20px; padding-top:14px; border-top:1px solid rgba(255,255,255,.16); font-size:12px; letter-spacing:0; color:rgba(255,255,255,.55); }
.contraste .est-d{ margin-top:4px; font-size:14px; color:rgba(255,255,255,.7); }
.secao{ margin-top:64px; }
.secao-cab{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding-bottom:12px; border-bottom:1px solid var(--div); }
.secao-cab h2{ font-family:var(--fb); font-size:16px; font-weight:500; letter-spacing:-.01em; }
.trilho{ display:grid; grid-template-columns:repeat(5,1fr); margin-top:20px; }
.trilho li{ position:relative; padding-top:18px; font-size:14px; color:var(--t3); }
.trilho li::before{ content:""; position:absolute; left:0; right:4px; top:0; height:4px; border-radius:2px; background:var(--div); }
.trilho li.passado::before, .trilho li.agora::before{ background:var(--tinta); }
.trilho li.agora, .trilho li.passado{ color:var(--tinta); }
.trilho li .tag-p{ display:inline-flex; margin-top:8px; }
.prox{ margin-top:28px; border-top:1px solid var(--div); }
.prox li{ display:grid; grid-template-columns:28px 1fr auto; gap:12px; align-items:start; padding:14px 0; border-bottom:1px solid var(--div); font-size:14px; }
.prox li .k{ font-size:12px; letter-spacing:0; color:var(--t3); padding-top:2px; }
.prox li b{ display:block; font-weight:400; font-size:16px; }
.prox li span span{ color:var(--t2); }
.premissas{ margin-top:20px; }
.premissas summary{ cursor:pointer; font-size:14px; color:var(--t2); list-style:none; display:inline-flex; align-items:center; gap:6px; }
.premissas summary::-webkit-details-marker{ display:none; }
.premissas summary svg{ transition:transform .15s ease-out; }
.premissas[open] summary svg{ transform:rotate(90deg); }
.premissas ul{ margin-top:10px; border-top:1px solid var(--div); }
.premissas li{ padding:10px 0; border-bottom:1px solid var(--div); font-size:14px; color:var(--t2); }
.apps{ display:grid; grid-template-columns:1fr 1fr; gap:0 40px; margin-top:4px; }
.app-i{ display:grid; grid-template-columns:28px 1fr; grid-template-rows:subgrid; grid-row:span 3; column-gap:14px; row-gap:12px; padding:22px 0; border-bottom:1px solid var(--div); align-content:start; }
.app-px{ grid-column:1; grid-row:1; line-height:0; padding-top:2px; }
.app-h, .app-b{ grid-column:2; }
.app-area{ display:block; font-size:12px; letter-spacing:0; color:var(--t3); }
.app-i h3{ font-size:16px; margin-top:2px; }
.app-tag{ margin-top:8px; }
.app-rot{ display:block; font-size:12px; letter-spacing:0; color:var(--t3); }
.app-b p{ margin-top:2px; font-size:14px; color:var(--t2); }
.privacidade{ margin-top:32px; font-size:12px; letter-spacing:0; color:var(--t3); max-width:70ch; }

/* agendamento */
.agenda{ display:grid; grid-template-columns:minmax(0,6fr) minmax(0,5fr); gap:64px; padding-top:40px; align-items:start; }
.agenda .frase{ margin-top:14px; max-width:50ch; }
.levamos{ background:var(--sup-1); border-radius:24px; padding:28px; }
.levamos .rot{ font-size:12px; letter-spacing:0; color:var(--t3); }
.levamos dl{ margin:12px 0 0; }
.levamos dl div{ padding:12px 0; border-top:1px solid var(--div); }
.levamos dt{ font-size:12px; letter-spacing:0; color:var(--t3); }
.levamos dd{ margin:4px 0 0; font-size:14px; }
.slots{ margin-top:28px; border-top:1px solid var(--div); }
.slot{ display:grid; grid-template-columns:18px 1fr auto; gap:14px; align-items:center; width:100%; padding:14px 6px; background:none; border:0; border-bottom:1px solid var(--div); cursor:pointer; text-align:left; font-size:14px; }
.slot:hover, .slot[aria-checked="true"]{ background:var(--sup-1); }
.slot .h{ color:var(--t2); }
.slot .radio{ pointer-events:none; }
.convidar{ margin-top:40px; }
.convidar h2{ font-family:var(--fb); font-size:16px; font-weight:500; letter-spacing:-.01em; }
.convidar .frase{ margin-top:6px; font-size:14px; }
.convidar .linha-c{ display:flex; gap:8px; margin-top:14px; }
.convidar .lista-c{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
.convidar .lista-c .tag-p{ gap:8px; padding-right:6px; }
.convidar .lista-c button{ background:none; border:0; cursor:pointer; padding:0; color:var(--t3); display:grid; place-items:center; }

/* trilha */
.trilha-ini{ max-width:720px; }

/* agent builder */
.ab{ display:grid; grid-template-columns:232px minmax(0,1fr) 320px; gap:48px; max-width:1360px; margin:0 auto; padding:24px 40px calc(var(--base-h) + 64px); align-items:start; }
.ab.sem-previa{ grid-template-columns:232px minmax(0,1fr); }
.trilho-ab{ position:sticky; top:24px; }
.trilho-ab .t{ font-size:14px; color:var(--t2); padding-bottom:10px; border-bottom:1px solid var(--div); }
.trilho-ab li{ display:grid; grid-template-columns:22px 1fr; gap:10px; align-items:center; min-height:40px; border-bottom:1px solid var(--div); font-size:14px; color:var(--t3); }
.trilho-ab li .k{ width:20px; height:20px; border-radius:999px; display:grid; place-items:center; font-size:12px; letter-spacing:0; box-shadow:inset 0 0 0 1px var(--div); }
.trilho-ab li.feito{ color:var(--t2); } .trilho-ab li.feito .k{ box-shadow:none; }
.trilho-ab li.agora{ color:var(--tinta); } .trilho-ab li.agora .k{ box-shadow:none; background:var(--tinta); color:#fff; }
.ab-main{ min-width:0; }
.ab-main > .frase{ margin-top:12px; max-width:60ch; }
.prev{ position:sticky; top:24px; background:var(--sup-1); border-radius:24px; padding:28px; }
.prev .topo-p{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.prev h2{ margin-top:14px; font-family:var(--fd); font-size:20px; letter-spacing:-.02em; line-height:1.25; }
.prev .papel{ margin-top:2px; font-size:14px; color:var(--t2); }
.prev dl{ margin:16px 0 0; }
.prev dl > div{ padding:12px 0; border-top:1px solid var(--div); }
.prev dt{ font-size:12px; letter-spacing:0; color:var(--t3); }
.prev dd{ margin:4px 0 0; font-size:14px; }
.prev dd ul li{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:6px 0; }
.prev dd ul li .tag-p{ flex:0 0 auto; align-self:flex-start; padding:1px 9px; line-height:18px; white-space:nowrap; margin-top:1px; }
.prev .logos{ display:flex; gap:6px; flex-wrap:wrap; }
.prev .logos .lg{ width:24px; height:24px; }
.lg{ width:28px; height:28px; border-radius:8px; background:#fff; box-shadow:inset 0 0 0 1px var(--div); display:inline-grid; place-items:center; flex:0 0 auto; color:var(--t2); }
.lg img{ width:62%; height:62%; object-fit:contain; display:block; }
.lg.duo{ width:auto; padding:0 5px; gap:3px; grid-auto-flow:column; }
.lg.duo img{ width:14px; height:14px; }

/* passo 1: três caminhos */
.cm3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:36px; border-top:1px solid var(--div); }
.cm3 .col{ position:relative; padding:24px 24px 28px; cursor:pointer; transition:background .15s ease-out; }
.cm3 .col + .col{ border-left:1px solid var(--div); }
.cm3 .col::before{ content:""; position:absolute; left:0; right:0; top:-1px; height:2px; background:transparent; }
.cm3 .col:hover, .cm3 .col.on{ background:var(--sup-1); }
.cm3 .col.on::before{ background:var(--tinta); }
.cm3 .col h3{ margin-top:20px; font-size:20px; letter-spacing:-.02em; line-height:1.3; }
.cm3 .col .d{ margin-top:6px; font-size:14px; color:var(--t2); }
.cm3 .cab-c{ display:flex; justify-content:space-between; align-items:center; font-size:12px; letter-spacing:0; color:var(--marca); }
.cm3 .ag{ display:flex; align-items:center; gap:12px; margin-top:22px; font-size:16px; }
.cm3 .rot-c{ margin-top:18px; font-size:12px; letter-spacing:0; color:var(--t3); }
.cm3 .resps-c li{ padding:9px 0; border-top:1px solid var(--div); font-size:14px; }
.cm3 .resps-c li:first-child{ margin-top:8px; }
.tpl-l{ margin-top:18px; border-top:1px solid var(--div); }
.tpl{ display:grid; grid-template-columns:18px 22px 1fr; gap:10px; align-items:start; width:100%; padding:10px 4px; background:none; border:0; border-bottom:1px solid var(--div); text-align:left; cursor:pointer; font-size:14px; }
.tpl:hover{ background:#fff; }
.tpl .radio{ margin-top:2px; pointer-events:none; }
.tpl span span{ display:block; font-size:12px; letter-spacing:0; color:var(--t3); margin-top:2px; }
.tpl[aria-checked="true"] .resps-t{ display:block; }
.resps-t{ display:none; grid-column:3; margin-top:6px; }
.resps-t li{ font-size:12px; letter-spacing:0; color:var(--t2); padding:2px 0; }
.cm3 .tbox{ margin-top:18px; background:#fff; }
.cm3 .tbox textarea{ min-height:96px; font-size:14px; }
.ajuda-t{ margin-top:10px; font-size:12px; letter-spacing:0; color:var(--t3); }
.proposta{ margin-top:16px; padding-top:14px; border-top:1px solid var(--div); }
.proposta dl{ margin:8px 0 0; }
.proposta dt{ font-size:12px; letter-spacing:0; color:var(--t3); margin-top:8px; }
.proposta dd{ margin:2px 0 0; font-size:14px; }

/* responsabilidades */
.resps{ margin-top:28px; border-top:1px solid var(--div); }
.rsp{ display:grid; grid-template-columns:22px 1fr auto; gap:14px; align-items:start; padding:14px 0; border-bottom:1px solid var(--div); }
.rsp .check{ margin-top:2px; }
.rsp b{ display:block; font-weight:400; font-size:16px; }
.rsp .dsc{ font-size:14px; color:var(--t2); margin-top:2px; }
.rsp .acoes-r{ display:flex; align-items:center; gap:16px; padding-top:2px; }
.rsp.off b, .rsp.off .dsc{ color:var(--t3); }
.prio-b{ border:0; cursor:pointer; font:inherit; font-size:12px; letter-spacing:0; padding:2px 10px; border-radius:999px; background:#fff; color:var(--t2); box-shadow:inset 0 0 0 1px var(--div); }
.prio-b:hover{ color:var(--tinta); }
.prio-b[aria-checked="true"]{ --c:var(--tinta); color:var(--tinta); background:color-mix(in srgb, var(--tinta) 10%, #fff); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--tinta) 30%, transparent); }
.edita{ margin-top:12px; grid-column:2 / span 2; }
.add-r{ margin-top:24px; }
.add-r label{ display:block; font-size:14px; color:var(--t2); }
.campo-f{ margin-top:22px; }
.campo-f > label, .campo-f > .rot-f{ display:block; font-size:14px; color:var(--t2); margin-bottom:8px; }
.campo-f .ajuda-f{ font-size:12px; letter-spacing:0; color:var(--t3); margin-top:6px; }
.op-r{ display:grid; grid-template-columns:18px 1fr; gap:12px; align-items:start; width:100%; padding:12px 6px; background:none; border:0; border-bottom:1px solid var(--div); cursor:pointer; text-align:left; font-size:14px; }
.op-r:first-child{ border-top:1px solid var(--div); }
.op-r:hover, .op-r[aria-checked="true"]{ background:var(--sup-1); }
.op-r .radio, .op-r .check{ margin-top:1px; pointer-events:none; }
.op-r span span{ display:block; color:var(--t2); margin-top:2px; }
.resumo-f{ margin-top:32px; padding:24px; border-radius:24px; background:var(--sup-1); }
.resumo-f .rot{ font-size:12px; letter-spacing:0; color:var(--t3); }
.resumo-f .prim{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:10px; font-size:16px; }
.resumo-f ol{ margin-top:12px; border-top:1px solid var(--div); }
.resumo-f ol li{ padding:8px 0; border-bottom:1px solid var(--div); font-size:14px; color:var(--t2); }

/* forma de trabalho */
.dim{ margin-top:36px; }
.dim-cab{ display:flex; align-items:baseline; gap:10px; padding-bottom:10px; }
.dim-cab h2{ font-family:var(--fb); font-size:16px; font-weight:500; letter-spacing:-.01em; }
.dim-cab span{ font-size:14px; color:var(--t3); }
.chips-r{ display:flex; flex-wrap:wrap; gap:8px; }
.chip-r{ border:0; cursor:pointer; font:inherit; font-size:14px; padding:6px 14px; border-radius:999px; background:linear-gradient(180deg,#fff,#FAFAF9); color:var(--t2); box-shadow:inset 0 0 0 1px var(--div), 0 1px 2px rgba(14,18,56,.05); }
.chip-r:hover{ color:var(--tinta); }
.chip-r[aria-checked="true"]{ color:#fff; background:linear-gradient(180deg,#1C2150,var(--tinta)); box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 1px 2px rgba(14,18,56,.3); }
.linha-com{ display:grid; grid-template-columns:160px 1fr; gap:16px; align-items:center; padding:12px 0; border-top:1px solid var(--div); font-size:14px; color:var(--t2); }
.mais-aj{ margin-top:36px; border-top:1px solid var(--div); }
.mais-aj > summary{ cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px; padding:14px 0; font-size:14px; color:var(--t2); }
.mais-aj > summary::-webkit-details-marker{ display:none; }
.mais-aj > summary svg{ transition:transform .15s ease-out; }
.mais-aj[open] > summary svg{ transform:rotate(90deg); }
.nl{ margin-top:36px; }
.nl label{ display:block; font-size:14px; color:var(--t2); }

/* ferramentas e skills */
.sec-ab{ margin-top:40px; }
.sec-ab .sec-t h2{ font-size:16px; font-weight:500; color:var(--tinta); }
.tb td.por{ color:var(--t2); }
.tb td .lig{ display:block; font-size:12px; letter-spacing:0; color:var(--t3); margin-top:2px; }
.lacunas{ margin-top:16px; }
.lacunas li{ display:flex; gap:10px; align-items:baseline; padding:10px 0; border-bottom:1px solid var(--div); font-size:14px; color:var(--t2); }
.lacunas li b{ font-weight:400; color:var(--tinta); }
.pb{ margin-top:32px; display:flex; justify-content:space-between; align-items:center; gap:24px; padding:20px 24px; border-radius:12px; background:var(--sup-1); font-size:14px; }
.pb p{ color:var(--t2); margin-top:4px; max-width:60ch; }
.cat-l{ margin-top:16px; border-top:1px solid var(--div); max-height:50vh; overflow:auto; }
.cat-i{ display:grid; grid-template-columns:22px 28px 1fr; gap:12px; align-items:center; width:100%; padding:10px 4px; background:none; border:0; border-bottom:1px solid var(--div); cursor:pointer; text-align:left; font-size:14px; }
.cat-i:hover{ background:var(--sup-1); }
.cat-i .check{ pointer-events:none; margin:0; }
.cat-i span span{ display:block; font-size:12px; letter-spacing:0; color:var(--t3); }
.modal .busca-c{ margin-top:16px; }
.modal-pe{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:20px; }

/* revisão */
.rev{ margin-top:28px; border-top:1px solid var(--div); }
.rev > div{ display:grid; grid-template-columns:200px 1fr auto; gap:16px; align-items:baseline; padding:13px 0; border-bottom:1px solid var(--div); font-size:14px; }
.rev dt{ color:var(--t3); font-size:12px; letter-spacing:0; }
.rev dd{ margin:0; }
.mapa-r{ margin-top:12px; }
.mapa-r > div{ padding:14px 0; border-bottom:1px solid var(--div); font-size:14px; }
.mapa-r b{ font-weight:400; display:flex; align-items:center; gap:10px; }
.mapa-r p{ color:var(--t2); margin-top:4px; }
.estados{ margin-top:12px; }
.estados li{ display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; min-height:44px; border-bottom:1px solid var(--div); font-size:14px; }
.impacto{ margin-top:12px; }
.impacto > div{ display:grid; grid-template-columns:240px 1fr; gap:16px; padding:12px 0; border-bottom:1px solid var(--div); font-size:14px; }
.impacto dt{ color:var(--t3); font-size:12px; letter-spacing:0; }
.impacto dd{ margin:0; }

/* starter kit */
.kit{ margin-top:28px; display:grid; grid-template-columns:1fr 1fr; gap:40px; }
.kit h2{ font-family:var(--fb); font-size:14px; color:var(--t2); padding-bottom:10px; border-bottom:1px solid var(--div); }
.kit li{ display:grid; grid-template-columns:22px 1fr; gap:10px; align-items:center; min-height:40px; border-bottom:1px solid var(--div); font-size:14px; color:var(--t3); }
.kit li.ok{ color:var(--tinta); }
.kit li code{ font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:13px; }
.aviso{ display:flex; gap:12px; align-items:flex-start; margin-top:28px; padding:16px 20px; border-radius:12px; background:var(--sup-1); font-size:14px; color:var(--t2); }
.aviso svg{ flex:0 0 auto; margin-top:2px; color:var(--t3); }
.aviso b{ font-weight:400; color:var(--tinta); }

/* instalação e download: etapa em foco */
.mini-mapa{ display:grid; grid-template-columns:repeat(4,1fr); margin-top:28px; border-top:1px solid var(--div); }
.mini-mapa.tres{ grid-template-columns:repeat(3,1fr); }
.mini-mapa li{ padding:12px 12px 12px 0; font-size:14px; color:var(--t3); display:flex; flex-direction:column; gap:8px; align-items:flex-start; position:relative; }
.mini-mapa li::before{ content:""; position:absolute; left:0; right:12px; top:-1px; height:2px; background:transparent; }
.mini-mapa li.feito{ color:var(--t2); } .mini-mapa li.feito::before{ background:var(--verde); }
.mini-mapa li.agora{ color:var(--tinta); } .mini-mapa li.agora::before{ background:var(--tinta); }
.video{ margin-top:20px; aspect-ratio:16/7; border-radius:12px; background:var(--sup-2); display:grid; place-items:center; font-size:12px; letter-spacing:0; color:var(--t3); }
.problemas{ margin-top:16px; }
.problemas summary{ cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:6px; font-size:14px; color:var(--t2); }
.problemas summary::-webkit-details-marker{ display:none; }
.problemas summary svg{ transition:transform .15s ease-out; }
.problemas[open] summary svg{ transform:rotate(90deg); }
.problemas ul{ margin-top:8px; }
.problemas li{ padding:8px 0; border-bottom:1px solid var(--div); font-size:14px; color:var(--t2); }
.vps{ margin-top:24px; }
.confirmado{ margin-top:28px; display:flex; gap:12px; align-items:flex-start; padding:16px 20px; border-radius:12px; background:color-mix(in srgb, var(--verde) 7%, #fff); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--verde) 22%, transparent); font-size:14px; color:var(--t2); }
.confirmado b{ font-weight:400; color:var(--tinta); display:block; }
.si{ flex-shrink:0; }
.confirmado > .si, .seguro > .si{ width:16px; height:16px; margin-top:2.5px; }

/* fim */
.fim{ max-width:640px; padding-top:24px; }

@media (max-width: 900px){
  .ab-capa, .sum-topo, .agenda{ grid-template-columns:1fr; gap:36px; padding-top:12px; }
  .ab-capa .t40, .sum-topo .t40{ font-size:28px; }
  .antes-depois .cab, .antes-depois .ln{ grid-template-columns:1fr; gap:8px; }
  .antes-depois .cab span:last-child{ display:none; }
  .chat{ padding:20px 16px calc(var(--dock-h, 320px) + 24px); }
  .dock-in{ padding:16px; }
  .ops.muitas{ grid-template-columns:1fr; }
  .dock-pe{ bottom:-16px; margin-bottom:-16px; padding-bottom:16px; }
  .topo .barra-q{ width:90px; }
  .trilho{ grid-template-columns:1fr; gap:10px; }
  .apps{ grid-template-columns:1fr; }
  .ab, .ab.sem-previa{ grid-template-columns:1fr; gap:24px; padding:8px 20px calc(var(--base-h) + 48px); }
  .trilho-ab{ position:static; }
  .trilho-ab ol{ display:none; }
  .prev{ position:static; order:3; }
  .cm3{ grid-template-columns:1fr; }
  .cm3 .col + .col{ border-left:0; border-top:1px solid var(--div); }
  .cm3 .col{ padding:20px 4px; }
  .rsp{ grid-template-columns:22px 1fr; }
  .rsp .acoes-r{ grid-column:2; }
  .linha-com{ grid-template-columns:1fr; gap:8px; }
  .rev > div{ grid-template-columns:1fr auto; }
  .rev dd{ grid-column:1; }
  .impacto > div{ grid-template-columns:1fr; gap:4px; }
  .kit{ grid-template-columns:1fr; }
  .mini-mapa, .mini-mapa.tres{ grid-template-columns:1fr 1fr; }
  .pb{ flex-direction:column; align-items:flex-start; }
}
.secao .ganhos .p{ margin:0 0 6px; }

@media (max-width: 900px){
  .base .prog > span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; display:block; }
  .lado-acoes .s12{ display:none; }
}
/* fotos dos cases: pessoas em círculo */
.case .quem{ display:flex; align-items:center; gap:10px; margin-top:14px; line-height:1.4; }
.foto-p{ width:32px; height:32px; border-radius:999px; object-fit:cover; flex:0 0 auto; box-shadow:0 0 0 1px var(--div); }
/* bloco azul de volta à abertura; antes e depois em faixa própria abaixo */
.ab-capa .placa{ grid-column:auto; }
.ab-capa .placa p.d{ margin-top:10px; font-size:14px; color:rgba(255,255,255,.72); }
.ad-faixa{ margin-top:72px; max-width:880px; }
/* abertura sem fios divisórios (comentário de 13/10) */
.antes-depois, .antes-depois .cab, .antes-depois .ln{ border:0; }
.antes-depois .cab{ padding-top:0; }
.antes-depois .ln{ padding:12px 0; }
.faixa{ border-top:0; }
.faixa div + div{ border-left:0; }
.cases-cab{ border-bottom:0; padding-bottom:0; }
.case{ border-top:0; padding-top:0; }
/* abertura em uma tela: título, plano, antes e depois e cases (comentário de 13/10) */

.ov3-top{ display:grid; grid-template-columns:minmax(0,6fr) minmax(0,5fr); gap:56px; align-items:center; }
.ov3-top .t40{ max-width:16ch; }
.ov3-lead{ margin-top:16px; font-size:18px; line-height:1.5; letter-spacing:-.015em; color:var(--t2); max-width:44ch; }
.ov3-stats{ display:grid; grid-template-columns:repeat(4,auto); justify-content:start; gap:28px; margin-top:24px; }
.ov3-stats b{ display:block; font-family:var(--fd); font-weight:400; font-size:20px; letter-spacing:-.02em; line-height:1.2; }
.ov3-stats span{ display:block; margin-top:2px; font-size:12px; letter-spacing:0; color:var(--t3); }
.ov3-placa{ grid-column:auto; padding:24px 28px; }
.ov3-placa h2{ font-family:var(--fd); font-weight:400; font-size:20px; letter-spacing:-.02em; }
.ov3-placa p.d{ margin-top:6px; font-size:14px; color:rgba(255,255,255,.72); }
.ov3-placa .blocos{ margin-top:16px; }
.ov3-placa .blocos li{ padding:10px 0; }
.ov3-base{ display:grid; grid-template-columns:minmax(0,6fr) minmax(0,5fr); gap:56px; margin-top:28px; }
.ov3-cab{ display:flex; justify-content:space-between; gap:16px; font-size:12px; letter-spacing:0; color:var(--t3); padding-bottom:6px; }
.ov3-ad .ov3-cab{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
.ov3-ln{ display:grid; grid-template-columns:1fr 1fr; gap:24px; padding:9px 0; font-size:14px; align-items:start; }
.ov3-ln .hoje{ color:var(--t2); }
.ov3-ln .com{ display:grid; grid-template-columns:24px 1fr; gap:10px; }
.ov3-ln .com b{ display:block; font-weight:400; color:var(--tinta); }
.ov3-ln .com span span{ color:var(--t2); }
.ov3-case{ display:grid; grid-template-columns:36px 1fr; gap:12px; align-items:center; padding:9px 0; }
.ov3-case .foto-p{ width:36px; height:36px; }
.ov3-case p{ font-size:14px; color:var(--t2); }
.ov3-case p b{ font-family:var(--fd); font-weight:400; font-size:18px; letter-spacing:-.02em; color:var(--tinta); margin-right:4px; }
.ov3-case .quem{ margin-top:1px; font-size:12px; letter-spacing:0; color:var(--t3); }
@media (max-width:900px){
  .ov3-top, .ov3-base{ grid-template-columns:1fr; gap:32px; }

const V4_STEPS={admin:["Visão geral","Diagnóstico","Plano Agêntico","Onboarding da empresa"],membro:["Visão geral","Diagnóstico pessoal","Ponto de partida","Trilha"],individual:["Visão geral","Diagnóstico","Plano Agêntico","Onboarding coletivo"]};
function v4Q(p){
  const persona=p==="admin"?"admin":"pessoal";
  const ctx = p==="admin" ? [
      {id:"nome",t:"Como você se chama?",type:"text",ph:"Seu nome"},
      {id:"cargo",t:"Qual é o seu cargo?",type:"text",ph:"Ex.: Diretora de operações"},
      {id:"empresa",t:"Qual é o nome da sua empresa?",type:"text",ph:"Nome da empresa"},
      {id:"setor",t:"Em qual setor ela atua?",type:"text",ph:"Ex.: clínicas de estética",llm:"setor"},
      {id:"pessoas",t:"Quantas pessoas trabalham na empresa?",type:"single",opts:["Só eu","2–10","11–50","51–100","mais de 100"]}]
    : p==="membro" ? [
      {id:"nome",t:"Como você se chama?",type:"text",ph:"Seu nome"},
      {id:"cargo",t:"Qual é o seu cargo?",type:"text",ph:"Ex.: Analista comercial"},
      {id:"areaP",t:"Em qual área você atua?",type:"text",ph:"Ex.: Comercial"}]
    : [
      {id:"nome",t:"Como você se chama?",type:"text",ph:"Seu nome"},
      {id:"trabalho",t:"Com o que você trabalha?",type:"text",ph:"Ex.: consultoria de RH para pequenas empresas",llm:"atuacao"},
      {id:"empresa",t:"Em qual empresa ou negócio você atua?",type:"text",ph:"Nome da empresa ou negócio",alt:"Trabalho por conta própria"},
      {id:"setor",t:"Em qual setor você atua?",type:"text",ph:"Ex.: serviços",llm:"setor"}];
  const mat=V4_MAT[persona].map((m,i)=>({id:"mat"+i,dim:m[0],t:m[1],type:"single",opts:m[2]}));
  const inefT = p==="admin" ? "Quais áreas da empresa você sente que têm mais ineficiência e mais processos feitos de forma manual?" : p==="membro" ? "Na sua rotina, onde você sente mais ineficiência e trabalho manual?" : "Quais áreas do seu trabalho ou negócio você sente que têm mais ineficiência e mais processos feitos de forma manual?";
  const procT = p==="admin" ? "Nessas áreas, existe alguma atividade ou processo em que você acha que faria muito sentido aplicar um agente de IA?" : p==="membro" ? "Existe alguma atividade ou processo da sua rotina em que você acha que faria muito sentido aplicar um agente de IA?" : "Existe alguma atividade ou processo em que você acha que faria muito sentido aplicar um agente de IA?";
  return [...ctx,...mat,{id:"inef",t:inefT,sub:"Selecione até duas.",type:"multi",max:2,opts:V4_INEF[p]},{id:"proc",t:procT,type:"yesno"}];
}
function v4Organize(kind,txt){ const t=txt.trim(); if(kind==="setor"){ const m=SETORES.find(s=>t.toLowerCase().includes(s.toLowerCase().split(" ")[0].slice(0,5))); return m||t.charAt(0).toUpperCase()+t.slice(1); } return t.charAt(0).toUpperCase()+t.slice(1); }
function v4AreaFromText(t){ for(const [re,a] of V4_KW) if(re.test(t)) return a; return null; }
function v4NeedsClar(txt){ return !v4AreaFromText(txt) || txt.trim().split(/\s+/).length<4; }
function v4ClarOpts(kind){ const v=S.v; const chosen=((v.a.inef||[]).map(x=>V4_MAP[x]).filter(Boolean)); const list=[...V4_AREAS].sort((a,b)=>(chosen.includes(b[1])?1:0)-(chosen.includes(a[1])?1:0)); return [...list.map(x=>x[0]), kind==="area"?"Nenhuma delas":"Ainda não sei dizer"]; }
function v4Compute(){
  const v=S.v, persona=S.profile==="admin"?"admin":"pessoal", M=V4_MAT[persona];
  const sc=M.map((m,i)=>{ const k=m[2].indexOf(v.a["mat"+i]); return k<0?0:k/(m[2].length-1); });
  const avg=sc.reduce((x,y)=>x+y,0)/sc.length; const si_=Math.min(4,Math.floor(avg*5));
  const low=sc.indexOf(Math.min(...sc)); const gargalo=M[low][0];
  const inef=(v.a.inef||[]).filter(x=>x!=="Outra"&&x!=="Não sei identificar.");
  let areas=inef.map(x=>V4_MAP[x]).filter(Boolean); if(v.a.otherArea) areas.push(v.a.otherArea);
  const procTxt=(v.a.proc&&v.a.proc!=="no")?v.a.proc:"";
  const procArea=procTxt?(v.a.procArea||v4AreaFromText(procTxt)):null;
  if(!areas.length) areas=[procArea||"relatorios"]; areas=[...new Set(areas)];
  const mainArea=procArea||areas[0]; const cat=V4_CAT[mainArea];
  const prim=Object.assign({},cat.opps[0],{cat:mainArea,relato:procTxt||""});
  const pool=[...new Set([mainArea,...areas])]; const outras=[];
  for(let k=0;k<3&&outras.length<3;k++) pool.forEach(a=>{ const o=V4_CAT[a].opps[k]; if(o&&o.id!==prim.id&&outras.length<3) outras.push(Object.assign({},o,{cat:a})); });
  const destino = si_>=4 ? "Escalar a operação agêntica com governança" : `Chegar ao estágio ${V4_STAGES[si_+1]}`;
  return {stage:V4_STAGES[si_],si:si_,destino,gargalo,areas,mainArea,cat,prim,outras,procTxt,sc,low};
}
function v4Gains(c){ const v=S.v, p=c.prim; const H=V4_PORTE_H[v.a.pessoas]||[6,10]; const r=p.red||[.3,.5]; const lo=Math.round(H[0]*4.3*r[0]), hi=Math.max(lo+1,Math.round(H[1]*4.3*r[1])); const area=c.cat.area;
  const rev=(area==="vendas"||area==="marketing")?{v:"Oportunidades recuperadas",n:area==="vendas"?"Mais orçamentos voltando a andar":"Mais campanhas no ar no mesmo tempo",pr:area==="vendas"?"Se 1 em cada 10 orçamentos parados voltar a andar. O valor depende do seu ticket médio; o Consultor calcula com os seus números.":"Se o tempo liberado for para novas campanhas. O valor depende do seu histórico de conversão."}:{v:"Indireto",n:"O tempo liberado volta para o que gera receita",pr:"Não estimamos faturamento direto para esse tipo de processo sem uma referência validada."};
  return {H,r,lo,hi,flo:lo*60,fhi:hi*60,rev}; }
