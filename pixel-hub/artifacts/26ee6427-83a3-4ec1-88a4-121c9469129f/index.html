function snapshot(){ const v=S.v; const {hist,...rest}=v; v.hist.push(JSON.stringify(rest)); }
function desfazer(){ const v=S.v; if(!v.hist.length) return; const prev=JSON.parse(v.hist.pop()); Object.assign(v,prev,{hist:v.hist}); R(); }
function bot(t){ S.v.log.push({r:"bot",t}); }
function seguir(ack){ const v=S.v; v.typing=true; R(); setTimeout(()=>{ v.typing=false; if(ack) bot(ack); v.qi++; v.sel=[]; v.other=""; const n=v4Q(S.profile).length; if(v.qi>=n){ v.done=true; bot("Pronto. Com isso eu já consigo montar a primeira versão do seu Plano Agêntico."); R(); setTimeout(()=>ir("gen"),RM()?200:900); return; } R(); }, RM()?60:420); }
function responder(val,label){
  const v=S.v, Qs=v4Q(S.profile), q=Qs[v.qi]; if(!q||v.typing) return; snapshot();
  v.a[q.id]=val; v.log.push({r:"bot",t:q.t}); v.log.push({r:"me",t:(label||(Array.isArray(val)?val.join(", "):String(val)))+(q.id==="proc"&&v.attach&&val!=="no"?`, com o anexo ${v.attach}`:"")});
  let ack="";
  if(q.id==="nome") ack=`Prazer, ${String(val).trim().split(/\s+/)[0]}.`;
  else if(q.llm){ const org=v4Organize(q.llm,String(val)); v.a[q.id+"Org"]=org; ack=q.llm==="setor"?`Anotei o setor como ${org}.`:`Entendi: ${org}.`; }
  else if(q.id==="pessoas") ack="Obrigado. Agora seis perguntas rápidas para entender em que ponto da jornada vocês estão.";
  else if(q.id==="mat5") ack="Já tenho o retrato do estágio. Agora quero entender onde dói mais.";
  else if(q.id==="inef"){ const o=v.other.trim(); if(Array.isArray(val)&&val.includes("Outra")&&o){ const a=v4AreaFromText(o); v.a.otherArea=a; v.a.otherTxt=o; if(a) ack=`Entendi “${o}” como algo próximo de ${lc1(V4_CAT[a].areaN)}.`; else { v.clar={kind:"area",txt:o}; bot(`Só para eu localizar bem: “${o}” fica mais perto de qual destas áreas?`); v.sel=[]; v.other=""; R(); return; } } }
  if(q.id==="mat0"&&S.profile!=="admin") ack="Seis perguntas rápidas sobre o seu uso de IA.";
  if(q.id==="proc"){ if(v.attach){ v.a.procAttach=v.attach; v.attach=null; } if(val==="no") ack="Sem problema. Vou sugerir oportunidades com base nas áreas, no setor e no estágio."; else if(v4NeedsClar(String(val))){ v.procMode=null; v.clar={kind:"proc",txt:String(val)}; bot("Para eu entender melhor: em qual área esse processo acontece?"); R(); return; } else { const ar=v4AreaFromText(String(val)); ack=`Entendi. Isso tem tudo a ver com ${lc1(V4_CAT[ar].areaN)}: vou colocar como prioridade do seu plano.`; } v.procMode=null; }
  seguir(ack);
}
function esclarecer(opt){ const v=S.v, c=v.clar; if(!c) return; const hit=V4_AREAS.find(x=>x[0]===opt); v.log.push({r:"me",t:opt});
  let ack; if(c.kind==="area"){ v.a.otherArea=hit?hit[1]:null; ack=hit?`Combinado: vou tratar “${c.txt}” junto de ${lc1(hit[0])}.`:`Anotei “${c.txt}” como uma área própria.`; }
  else { v.a.procArea=hit?hit[1]:null; ack=hit?`Entendi. Vou colocar esse processo de ${lc1(hit[0])} como prioridade do seu plano.`:"Sem problema. Vou colocar esse processo como prioridade e a gente refina no Agent Builder."; }
  v.clar=null; seguir(ack); }

      ${agora<0?`<ul class="blocos-f"><li><span>Bloco 2, cérebro da empresa</span><span class="num">5 passos</span></li><li><span>Bloco 3, operação agêntica</span><span class="num">6 passos</span></li></ul>`:""}</div>

  const top=`<header class="topo">${LOGO_PX}<div class="meio"><span>Agent Builder</span></div><button class="sair-b" data-act="sairAB">Sair do builder</button></header>`;
  const fimTela=S.scr==="abfim";
  return `${top}<div class="ab ${semPrev||fimTela?"sem-previa":""}">${fimTela?`<nav class="trilho-ab"><p class="t">Concluído</p><ol>${AB_STEPS.map(t=>`<li class="feito"><span class="k">${IC.okv}</span><span>${t}</span></li>`).join("")}</ol></nav>`:trilhoAB()}<main class="ab-main">${b}</main>${semPrev||fimTela?"":previa()}</div>${catModal()}${foot}`; }

function catModal(){ const d=S.ab; if(!d||!d.modal) return ""; const ferr=d.modal==="tools"; const q=(d.catQ||"").toLowerCase();
  const have=ferr?abTools(d):abSkills(d).ready; const list=ferr?TOOL_CAT.filter(t=>!have.includes(t)):SKILL_CAT.filter(([k])=>!have.includes(k)).map(x=>x[0]);
  const fil=list.filter(x=>!q||x.toLowerCase().includes(q));
  return `<div class="veu aberto" role="dialog" aria-modal="true" aria-labelledby="cat-t" data-act="catFora"><div class="modal" style="width:min(560px,100%)"><div class="modal-cab"><div><h2 class="t28" id="cat-t" style="font-size:20px">${ferr?"Escolher outras ferramentas":"Escolher outras skills"}</h2><p class="frase" style="margin-top:6px;font-size:14px">${ferr?"Catálogo de integrações do Composio. A conexão acontece depois, no Telegram.":"Capacidades extras que o agente pode usar."}</p></div><button class="fechar" data-act="catFechar" aria-label="Fechar">${IC.x}</button></div>
    <div class="busca-c"><input class="inp" id="cat-q" data-bind="ab.catQ" data-live="1" value="${esc(d.catQ)}" placeholder="${ferr?"Buscar ferramenta":"Buscar skill"}"></div>
    <div class="cat-l">${fil.map(x=>`<button class="cat-i" role="checkbox" aria-checked="${!!d.mSel[x]}" data-act="catSel" data-arg="${esc(x)}"><input class="check" type="checkbox" tabindex="-1" aria-hidden="true" ${d.mSel[x]?"checked":""}>${ferr?lg(x):'<span></span>'}<span>${esc(x)}${ferr?"":`<span>${esc((SKILL_CAT.find(s=>s[0]===x)||[])[1]||"")}</span>`}</span></button>`).join("")||'<p class="frase" style="padding:14px 0;font-size:14px">Nada encontrado.</p>'}</div>
    <div class="modal-pe"><span class="s12 c3 num">${Object.values(d.mSel).filter(Boolean).length} selecionada${Object.values(d.mSel).filter(Boolean).length===1?"":"s"}</span><button class="btn btn-p btn-sm" data-act="catAdd">Adicionar ao agente</button></div></div></div>`; }

/* ============ render ============ */
function view(){ switch(S.scr){ case "ov":return telaAbertura(); case "chat":return telaChat(); case "gen":return telaGera(); case "sum":return telaResumo(); case "sched":return telaAgenda(); case "trilha":return telaTrilha(); case "caso":return telaCaso(); case "checkpoint":return telaCheckpoint(); case "marco":return telaMarco(); case "ab": case "abfim": return telaAB(); } return ""; }
let FOCO=false;
function R(){ const app=document.getElementById("app"); app.innerHTML=view(); syncChrome();
  if(S.scr==="chat"){ const dk=document.getElementById("dock"); if(dk) document.documentElement.style.setProperty("--dock-h",dk.offsetHeight+"px"); requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"instant"})); const t=document.querySelector("#t-in,#v4-proc"); if(t&&!REC) t.focus({preventScroll:true}); }
  if(FOCO){ FOCO=false; window.scrollTo({top:0,behavior:"instant"}); const h=document.getElementById("focus-h"); if(h) h.focus({preventScroll:true}); }
  if(S.scr==="ab"&&S.ab.s===6&&!S.ab.genDone&&!GEN_T) gerarKit(); }
function ir(scr){ S.scr=scr; FOCO=true; if(scr==="gen"){ S.genI=0; R(); rodarGera(); return; } R(); }
let GEN_T=null;
function rodarGera(){ const n=6; const tick=()=>{ if(S.scr!=="gen") return; S.genI++; if(S.genI>n){ S.scr="sum"; FOCO=true; R(); return; } R(); setTimeout(tick, RM()?80:(S.genI>=n?480:520)); }; setTimeout(tick,RM()?80:500); }
function gerarKit(){ const d=S.ab; GEN_T=setInterval(()=>{ if(S.scr!=="ab"||d.s!==6){ clearInterval(GEN_T); GEN_T=null; return; } d.gen++; if(d.gen>=14){ d.genDone=true; clearInterval(GEN_T); GEN_T=null; } R(); }, RM()?40:170); }

/* ============ ações ============ */
const A={
  comecar:()=>{ S.v=vNovo(); ir("chat"); },
  sairOb:()=>aviso("Suas respostas ficam salvas. No protótipo, sair não faz nada."),
  naoProva:()=>aviso("Essa área não faz parte deste protótipo."),
  enviarTxt:()=>{ const t=document.getElementById("t-in"); const val=(t&&t.value||"").trim(); if(!val){ t&&t.focus(); return; } responder(val); },
  alt:a=>responder(a),
  pick:o=>responder(o),
  tog:o=>{ const v=S.v; const i=v.sel.indexOf(o); if(i>=0) v.sel.splice(i,1); else if(v.sel.length<2) v.sel.push(o); else { aviso("Até duas. Desmarque uma para trocar."); return; } R(); },
  enviarMulti:()=>{ const v=S.v; if(!v.sel.length) return; if(v.sel.includes("Outra")&&!v.other.trim()){ const i=document.getElementById("outra-in"); i&&i.focus(); aviso("Conte qual é a outra área."); return; } responder([...v.sel]); },
  sim:()=>{ S.v.procMode="yes"; R(); },
  nao:()=>responder("no","Ainda não tenho um processo específico em mente."),
  exemplo:t=>{ const v=S.v; if(v.procMode!=="yes"){ v.procMode="yes"; R(); } const ta=document.getElementById("v4-proc"); if(ta){ ta.value=t; ta.focus(); } },
  enviarProc:()=>{ if(REC) parar(); const t=document.getElementById("v4-proc"); const val=(t&&t.value||"").trim(); if(!val){ t&&t.focus(); return; } responder(val); },
  anexar:()=>{ S.v.attach="orcamentos-parados.xlsx"; R(); },
  tiraAnexo:()=>{ S.v.attach=null; R(); },
  voz:id=>gravar(id),
  vozAB:id=>gravar(id),
  clar:o=>esclarecer(o),
  desfazer:()=>desfazer(),
  irAgenda:()=>ir("sched"),
  irTrilha:()=>ir("trilha"),
  slot:id=>{ S.sched.slot=id; R(); },
  convidar:()=>{ const e=(S.sched.invTxt||"").trim(); if(!/^\S+@\S+\.\S+$/.test(e)){ aviso("Escreva um e-mail válido."); document.getElementById("inv-in")?.focus(); return; } if(S.sched.inv.length>=12){ aviso("O Plano Empresa inclui até 12 Membros."); return; } S.sched.inv.push(e); S.sched.invTxt=""; R(); document.getElementById("inv-in")?.focus(); },
  desconvidar:i=>{ S.sched.inv.splice(+i,1); R(); },
  agendar:()=>{ S.sched.feito=!!S.sched.slot; ir("trilha"); },
  abrirAB:()=>{ S.ab=abNovo(); S.abFeito=false; ir("ab"); },
  sairAB:()=>ir("trilha"),
  abPath:k=>{ if(S.ab.path===k) return; const ae=document.activeElement&&document.activeElement.id; S.ab.path=k; R(); if(ae){ const n=document.getElementById(ae); n&&n.focus(); } },
  abTpl:k=>{ S.ab.path="tpl"; S.ab.tpl=k; R(); },
  abProposta:()=>{ const d=S.ab; const t=(document.getElementById("ab-desc")?.value||d.desc||"").trim(); if(!t){ aviso("Conte em uma ou duas frases o que o agente deve fazer."); return; } d.desc=t; d.path="cus"; const k=abMatch(t); const T=AB_TPL[k]; const who=/(para|pra) (o |a )?(meu |minha )?(time|equipe|empresa)/i.test(t)?"Atende o time":"Trabalha para você"; d.prop={k,name:T.name,role:T.role,mission:T.mission,scope:`${who}, dentro de ${T.n.toLowerCase()}`,resps:T.resps.map(r=>Object.assign({},r))}; R(); },
  abAvancar:()=>{ const d=S.ab;
    if(S.scr==="abfim"){ return; }
    if(d.s===0&&d.p0==="start"){ abAplicar(); d.p0="resps"; FOCO=true; return R(); }
    if(d.s===0&&d.p0==="resps"){ if(!abOn(d).length) return; d.p0="who"; FOCO=true; return R(); }
    if(d.s===0&&d.p0==="who"){ d.s=1; FOCO=true; return R(); }
    if(d.s===1){ if(d.vps||d.online){ d.s=2; FOCO=true; return R(); } d.inst[d.ii]=1; if(d.ii<3){ d.ii++; } else { d.online=true; } FOCO=true; return R(); }
    if(d.s===7){ if(d.instConf){ S.abFeito=true; S.scr="abfim"; FOCO=true; return R(); } d.dl[d.di]=1; if(d.di<2) d.di++; else d.instConf=true; FOCO=true; return R(); }
    d.s++; FOCO=true; R(); },
  abVoltar:()=>{ const d=S.ab; if(d.s===0){ d.p0=d.p0==="who"?"resps":"start"; } else if(d.s===1){ d.s=0; d.p0="who"; } else d.s--; FOCO=true; R(); },
  abDepois:()=>{ S.ab.s=2; FOCO=true; R(); },
  abInstPrev:()=>{ const d=S.ab; if(d.ii>0){ d.ii--; d.inst[d.ii]=0; } R(); },
  abVps:()=>{ S.ab.vps=!S.ab.vps; R(); },
  abTog:id=>{ const d=S.ab, r=d.resps.find(x=>x.id===id); r.on=!r.on; if(!r.on&&d.prio===id){ const f=abOn(d)[0]; d.prio=f?f.id:null; } if(r.on&&!d.prio) d.prio=id; R(); },
  abPrio:id=>{ S.ab.prio=id; R(); },
  abEdit:id=>{ S.ab.editR=id; R(); document.getElementById("ab-editr")?.focus(); },
  abEditCancel:()=>{ S.ab.editR=null; R(); },
  abEditSave:()=>{ const d=S.ab, r=d.resps.find(x=>x.id===d.editR); const t=(document.getElementById("ab-editr")?.value||"").trim(); if(r&&t){ const [a,...b]=t.split(":"); r.t=a.trim(); r.d=(b.join(":").trim()||r.d); } d.editR=null; R(); },
  abAdd:()=>{ const d=S.ab; const t=(d.addTxt||"").trim(); if(!t){ document.getElementById("ab-add")?.focus(); return; } const low=t.toLowerCase(); const r=/n[uú]mero|indicador/.test(low)?ABR("cu"+Date.now(),"Acompanhar indicadores semanalmente","Analisar os principais indicadores toda segunda-feira, comparar períodos e destacar mudanças relevantes.",1,["Ler indicadores","Comparar períodos"],["Google Sheets"],[]):/reuni/.test(low)?ABR("cu"+Date.now(),"Preparar reuniões","Reunir pauta, histórico e pontos de decisão antes de cada reunião.",1,["Acessar calendário","Buscar conhecimento"],["Google Calendar"],[]):ABR("cu"+Date.now(),(()=>{ const c=t.replace(/^quero que ele (também )?/i,"").replace(/\.$/,""); const x=c.charAt(0).toUpperCase()+c.slice(1); return x.length>60?x.slice(0,58)+"…":x; })(),t,1,["Ler as fontes da tarefa"],[],[]); d.resps.push(r); d.addTxt=""; R(); },
  abPub:k=>{ S.ab.pub=k; R(); },
  abIr:a=>{ const d=S.ab; if(a==="0w"){ d.s=0; d.p0="who"; } else if(a==="0r"){ d.s=0; d.p0="resps"; } else d.s=+a; FOCO=true; R(); },
  abNL:()=>{ const d=S.ab; const t=(document.getElementById("ab-nl")?.value||"").trim(); if(!t) return; const m=t.match(/chame(?:-o)? de ([A-ZÀ-Úa-zà-ú]+)/i); const done=[]; if(m){ d.name=m[1].charAt(0).toUpperCase()+m[1].slice(1); done.push(`nome ${d.name}`); } const f=t.match(/focad[ao] em ([^,.]+)/i); if(f){ d.mission=`${d.mission.replace(/\.$/,"")}, com foco em ${f[1].trim()}.`; done.push("missão ajustada"); } d.nlOk=done.length?`Aplicado: ${done.join(", ")}.`:"Não encontrei um ajuste claro. Tente “chame de Luna” ou “missão focada em briefings”."; R(); },
  abNLW:()=>{ const d=S.ab; const t=(document.getElementById("ab-nlw")?.value||"").toLowerCase(); if(!t) return; const done=[]; if(/direto/.test(t)){ d.com.tone="Direto"; done.push("tom direto"); } if(/proativ/.test(t)){ d.com.proat="Proativo"; done.push("proativo"); } if(/sozinho|resolver/.test(t)){ d.unc="propor"; done.push("propõe uma solução antes de perguntar"); } if(/sem minha aprova|aprova[cç][aã]o/.test(t)){ d.esc.ext=1; done.push("comunicação externa só com aprovação"); } d.nlOk=done.length?`Aplicado: ${done.join(", ")}.`:"Não encontrei um ajuste claro nesse texto."; R(); },
  abAuto:k=>{ S.ab.autonomy=k; R(); },
  abEsc:k=>{ S.ab.esc[k]=S.ab.esc[k]?0:1; R(); },
  abUnc:k=>{ S.ab.unc=k; R(); },
  abCom:a=>{ const [k,v]=a.split("|"); S.ab.com[k]=v; R(); },
  abTool:t=>{ const d=S.ab; if(d.toolsAdd.includes(t)&&!d.toolsOff[t]){ d.toolsAdd=d.toolsAdd.filter(x=>x!==t); } else d.toolsOff[t]=!d.toolsOff[t]; R(); },
  abSkill:k=>{ const d=S.ab; if(d.skillsAdd.includes(k)&&!d.skillsOff[k]){ d.skillsAdd=d.skillsAdd.filter(x=>x!==k); } else d.skillsOff[k]=!d.skillsOff[k]; R(); },
  abPB:()=>{ S.ab.pbOn=!S.ab.pbOn; R(); },
  abCat:k=>{ const d=S.ab; d.modal=k; d.mSel={}; d.catQ=""; R(); document.getElementById("cat-q")?.focus(); },
  catSel:x=>{ const d=S.ab; d.mSel[x]=!d.mSel[x]; R(); },
  catFechar:()=>{ S.ab.modal=null; R(); },
  catFora:(_,ev)=>{ if(ev.target.classList.contains("veu")) A.catFechar(); },
  catAdd:()=>{ const d=S.ab; const sel=Object.keys(d.mSel).filter(k=>d.mSel[k]); if(d.modal==="tools") sel.forEach(t=>{ if(!d.toolsAdd.includes(t)) d.toolsAdd.push(t); delete d.toolsOff[t]; }); else sel.forEach(k=>{ if(!d.skillsAdd.includes(k)) d.skillsAdd.push(k); delete d.skillsOff[k]; }); d.modal=null; R(); },
  abBaixar:()=>aviso("No produto, o download do Starter Kit começa aqui."),
  /* protótipo */
  abrirCaso:()=>ir("caso"),
  casoCrit:i=>{ S.caso.crit[+i]=S.caso.crit[+i]?0:1; R(); },
  registrarCaso:()=>{ const c=S.caso; if(!(c.crit.every(Boolean)&&c.mudou.trim().length>3)) return; c.feito=true; ir("checkpoint"); },
  passo6:()=>{ S.p6=true; aviso("No produto, isso abre a ficha do agente para ativar cada responsabilidade."); R(); },
  fecharBloco:()=>{ S.bloco1=true; ir("marco"); },
  recomecar:()=>{ painel(false); A.perfil(S.profile); },
  perfil:p=>{ painel(false); S.caso=casoNovo(); S.p6=false; S.bloco1=false; S.profile=p; S.v=vNovo(); S.ab=null; S.abFeito=false; S.sched={slot:null,inv:[],invTxt:"",feito:false}; ir("ov"); },
  saltar:t=>{ painel(false); if(["sum","sched","trilha","ab","checkpoint","marco"].includes(t)&&!S.v.done) amostra(); if(t==="sched"&&S.profile==="membro"){ aviso("O Membro não agenda: o onboarding termina na Trilha."); return; } if(t==="ab"){ S.ab=abNovo(); }
  if(t==="checkpoint"||t==="marco"){ S.ab=abNovo(); abAplicar(); S.ab.online=true; S.ab.instConf=true; S.abFeito=true; S.caso={txt:"Orçamento da Ferraz Arquitetura parado há 9 dias",crit:[1,1,1,1],mudou:"O orçamento teve retorno no mesmo dia e o cliente pediu a reunião para quinta",feito:true}; if(t==="marco"){ S.p6=true; S.bloco1=true; } } if(t==="chat"){ S.v=vNovo(); } ir(t); },
  px:k=>{ PX_EST=k; try{ localStorage.setItem("pixel-personagem",k); }catch(e){} R(); }
};
let AV_T;
function aviso(t){ const n=document.getElementById("nota"); if(!n) return; clearTimeout(AV_T); n.textContent=t; n.classList.add("on"); AV_T=setTimeout(()=>{ n.classList.remove("on"); },3200); }
function painel(abrir){ const pn=document.getElementById("tw-pan"), fb=document.getElementById("tw-fab"); const ab=abrir==null?pn.hidden:abrir; pn.hidden=!ab; fb.setAttribute("aria-expanded",String(ab)); }
function syncChrome(){ document.querySelectorAll("[data-pf]").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.pf===S.profile))); document.querySelectorAll("[data-px-k]").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.pxK===PX_EST))); const grp={ov:"ov",chat:"chat",gen:"sum",sum:"sum",sched:"sched",trilha:"trilha",ab:"ab",abfim:"ab",caso:"trilha",checkpoint:"checkpoint",marco:"marco"}[S.scr]; document.querySelectorAll("[data-salto]").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.salto===grp))); }

document.addEventListener("click",e=>{ if(e.target.closest("#tw-fab")){ painel(); return; } const pn=document.getElementById("tw-pan"); if(pn&&!pn.hidden&&!e.target.closest("#tw-pan")) painel(false); const el=e.target.closest("[data-act]"); if(!el) return; if(el.tagName==="INPUT"&&el.type==="checkbox") { /* checkbox nativo: deixa marcar e re-renderiza */ }
  const act=el.dataset.act; if(act==="catFora"&&e.target!==el) return; if(el.tagName==="A") e.preventDefault(); const f=A[act]; if(f) f(el.dataset.arg,e); });
document.addEventListener("keydown",e=>{ const el=e.target; if((e.key==="Enter"||e.key===" ")&&el.matches&&el.matches(".col[data-act]")){ e.preventDefault(); A.abPath(el.dataset.arg); }
  if(e.key==="Enter"&&!e.shiftKey&&el.id==="t-in"){ e.preventDefault(); A.enviarTxt(); }
  if(e.key==="Enter"&&el.id==="inv-in"){ e.preventDefault(); A.convidar(); }
  if(e.key==="Escape"){ const pn=document.getElementById("tw-pan"); if(pn&&!pn.hidden){ painel(false); document.getElementById("tw-fab").focus(); } }
  if(e.key==="Escape"&&S.ab&&S.ab.modal){ A.catFechar(); }
  if(S.scr==="chat"&&/^[1-9]$/.test(e.key)&&!["TEXTAREA","INPUT"].includes(el.tagName)){ const b=document.querySelectorAll(".dock .op")[+e.key-1]; if(b){ e.preventDefault(); b.click(); } } });
document.addEventListener("input",e=>{ const el=e.target; const p=el.dataset&&el.dataset.bind; if(!p) return; const [o,k]=p.split("."); const tgt=o==="v"?S.v:o==="ab"?S.ab:o==="caso"?S.caso:S.sched; tgt[k]=el.value; if(o==="caso"){ const b=document.querySelector('[data-act="registrarCaso"]'); if(b) b.disabled=!(S.caso.crit.every(Boolean)&&S.caso.mudou.trim().length>3); } if(el.dataset.live){ const pos=el.selectionStart; R(); const n=document.getElementById(el.id); if(n){ n.focus(); n.setSelectionRange(pos,pos); } } });
R();

</script>
