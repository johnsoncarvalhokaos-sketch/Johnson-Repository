@keyframes pxaant{0%,100%{opacity:1}50%{opacity:.45}}

:root{--surface:#f7f7f8;--raised:#ffffff;--sunken:#f0f0f2;--hover:#f2f2f5;--line:#e2e3e8;--line-soft:#ececf0;
 --ink:#0e1238;--muted:#545869;--subtle:#7b7f8f;
 --sh-xs:0 1px 2px 0 #0e123808;--sh-sm:0 1px 2px 0 #0e123808;--sh-md:0 4px 14px -8px #0e12381f;--sh-lg:0 16px 40px -16px #0e123833;--sh-btn:none;--glow:0 0 0 3px #ff5a1f33}
/* sem movimento decorativo */
.px-glyph,.px-glyph *{animation:none!important;transition:none!important}
svg.px-live *,svg.pxa *,.px-peek *,.ov6-btn,.ov3-msg{animation:none!important}
#hubob,.hub-ob,.px-egg,.eggs-count,.px-toastegg{display:none!important}
.pxa-studio{display:none!important}
.who-ai{display:none!important}
/* botões: laranja = ação principal; azul-escuro = secundária com peso; contorno neutro = demais */
.btn{box-shadow:none!important;font-weight:600}
.btn-primary{background:var(--brand)!important;border-color:var(--brand)!important;color:#fff!important}
.btn-primary:hover{background:#e84e14!important;border-color:#e84e14!important}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-secondary{background:var(--raised)!important;border:1px solid var(--line)!important;color:var(--ink)!important}
.btn-secondary:hover{border-color:#c9cad3!important;background:var(--surface)!important}
/* cards: borda fina, sem sombra, raio menor */
.card{border-radius:14px;box-shadow:none!important;border:1px solid var(--line-soft)}

.pk-arrow{background:var(--ink)!important;box-shadow:none!important}
.px-peek{box-shadow:0 8px 24px -12px #0e123840!important}
</style>
</head>

function v4Typed(val){ const v=S.v4, q=v4Q(v.profile)[v.qi]; if(!q||v.typing) return;
  if(v.clar){ const opts=v4ClarOpts(v.clar.kind); const n=(val.match(/\d+/)||[])[0]; const lc=val.toLowerCase(); const hit=(n&&opts[+n-1]) || opts.find(o=>o.toLowerCase().split(/[ ,]/)[0].length>3 && lc.includes(o.toLowerCase().split(/[ ,]/)[0])); if(hit) return A.v4Clar(hit); pxReact("no"); toast("Escolha uma das áreas acima ou escreva o número."); return; }
  if(q.type==="text") return v4Do(()=>v4Answer(val));
  if(q.type==="yesno"){ if(v.procMode==="yes" || val.length>24) return v4Do(()=>v4Answer(val)); if(/^\s*(1|sim|s\b|quero)/i.test(val)) return A.v4Yes(); if(/^\s*(2|n[aã]o|ainda)/i.test(val)) return A.v4No(); return v4Do(()=>v4Answer(val)); }
  const norm=x=>x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  const strip=x=>norm(x).replace(/\b(a|ate|e|de|entre|ou|do|da)\b/g," ").replace(/\s+/g," ").trim(); const b=strip(val); const nums=(val.match(/\d+/g)||[]).map(Number).filter(n=>n>=1&&n<=q.opts.length);
  const byText=q.opts.filter(o=>{ const a=strip(o); const head=a.split(" ").slice(0,2).join(" "); return b.length>=2 && (a.includes(b) || b.includes(head) || (a.replace(/ /g,"")===b.replace(/ /g,""))); });
  if(q.type==="single"){ const exact=q.opts.find(o=>strip(o).replace(/ /g,"")===b.replace(/ /g,"")); const o = exact || byText[0] || (nums.length?q.opts[nums[0]-1]:null); if(o) return A.v4Pick(o); }
  if(q.type==="multi"){ const parts=val.split(/,|;|\be\b/i).map(x=>strip(x)).filter(x=>x.length>=3); const byPart=q.opts.filter(o=>parts.some(pt=>{ const a=strip(o); return a.includes(pt)||pt.includes(a.split(" ")[0]); })); const sel=[...new Set([...byPart,...byText,...nums.map(n=>q.opts[n-1])])].filter(x=>x!=="Outra").slice(0,2); if(sel.length){ v.sel=sel; return A.v4Multi(); } }
  pxReact("no"); toast("Não encontrei essa opção. Escolha acima ou escreva o número.");
}

function pillGroup(id,label,opts,cur,act,err,errMsg){
  return `<div class="field ${err?"invalid":""}"><span style="font-size:14px;font-weight:600" id="${id}">${label} <span class="req" aria-hidden="true">*</span></span><div role="radiogroup" aria-labelledby="${id}" aria-required="true" ${err?`aria-describedby="err-${id}"`:""} class="pill-row ${err?"pill-err":""}">${opts.map((o,i)=>`<button class="pill" role="radio" aria-checked="${cur===o}" tabindex="${(cur===o||(!opts.includes(cur)&&i===0))?0:-1}" data-act="${act}" data-arg="${esc(o)}">${esc(o)}</button>`).join("")}</div>${err?`<p class="err" id="err-${id}">${ic("alert",15,2)}<span>${esc(errMsg)}</span></p>`:""}</div>`;
}

function obDiag(){
  const i=S.diag.i, q=Q[i], a=S.diag.a[q.id];
  const answered = Q.slice(0,i).map((qq,k)=>`<div class="answered"><span class="mark done" style="width:20px;height:20px">${ic("check",11,3)}</span><span style="display:flex;flex-direction:column;flex:1;min-width:0"><span class="xs subtle">${esc(qq.t)}</span><span class="h-sm" style="font-size:14px">${esc(Array.isArray(S.diag.a[qq.id])?S.diag.a[qq.id].join(", "):S.diag.a[qq.id])}</span></span><button class="btn btn-ghost btn-sm" data-act="diagEdit" data-arg="${k}">Editar</button></div>`).join("");
  const sel = v => q.multi ? (a||[]).includes(v) : a===v;
  const firstOn = q.multi?null:(q.opts.findIndex(o=>sel(o.v))<0?0:q.opts.findIndex(o=>sel(o.v)));
  const opts = q.opts.map((o,oi)=>`<button class="choice" ${q.multi?`aria-pressed="${sel(o.v)}"`:`role="radio" aria-checked="${sel(o.v)}" tabindex="${oi===firstOn?0:-1}"`} data-act="diagPick" data-arg="${esc(o.v)}"><span class="check ${q.multi?"":"radio"}">${sel(o.v)?ic("check",12,3):""}</span><span style="display:flex;flex-direction:column;gap:3px"><span class="h-sm">${esc(o.v)}</span>${o.s?`<span class="sm muted">${esc(o.s)}</span>`:""}</span></button>`).join("");
  const count = q.multi ? `${(a||[]).length} de ${q.max} escolhidas` : "";
  const guideTxt = i===0 ? "Começo pelo destino: o que precisa estar diferente daqui a três meses." :
    i===1 ? "Agora quero saber de onde a gente parte. Não existe resposta errada aqui." :
    i===2 ? "Esta é a pergunta mais importante. Quero achar o trabalho repetitivo que custa mais caro." :
    "Última. Saber o que trava me ajuda a colocar o apoio certo na hora certa.";
  return `${guide(guideTxt,"Suas respostas sobre a empresa ficam no plano. Quem você convidar depois responde só sobre a própria função.")}
  <div class="ob-main">
    <div style="display:flex;flex-direction:column;gap:8px"><span class="sm subtle num" style="font-weight:600">Pergunta ${i+1} de ${Q.length}</span><h1 class="display d-ob" tabindex="-1" id="focus-h">${esc(q.t)}</h1><p class="lead">${esc(q.sub)}</p></div>
    <div class="ob-grid-2" role="${q.multi?"group":"radiogroup"}" aria-label="${esc(q.t)}" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">${opts}</div>
    ${errHtml("diag")}
    <div class="ob-actions"><button class="btn btn-ghost" data-act="obBack">Voltar</button><span class="sp"></span>${count?`<span class="sm subtle num">${count}</span>`:""}<button class="btn btn-primary btn-lg" data-act="diagNext">Continuar</button></div>
  </div>`;
}

function trilha(){
  if(!S.showDone||typeof S.showDone!=="object") S.showDone={};
  if(S.viewBlock==null||!BLOCKS[S.viewBlock]) S.viewBlock=(ALL_STEPS[S.cur]&&ALL_STEPS[S.cur].b)||0;
  if(isR()) return trilhaR();
  const vb=S.viewBlock;
  const tabs = BLOCKS.map((b,bi)=>{
    const open=blockOpen(bi); const n=b.steps.length; const d=ALL_STEPS.filter((s,i)=>s.b===bi&&S.stepDone[i]).length; const cps=b.steps.filter(s=>s.cp).length;
    return `<button class="block ${open?"":"locked"}" aria-pressed="${vb===bi}" data-act="viewBlock" data-arg="${bi}"><span style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="sm" style="font-weight:600;color:${vb===bi?"var(--brand-ink)":"var(--subtle)"}">Bloco ${b.n}</span>${open?"":ic("lock",14)}</span><span class="h-sm">${b.t}</span><span class="sm subtle num">${d} de ${n} passos, ${cps} ${cps>1?"checkpoints":"checkpoint"}</span></button>`;
  }).join("");
  const b=BLOCKS[vb]; const open=blockOpen(vb);
  let rows = ALL_STEPS.map((s,i)=>({s,i})).filter(x=>x.s.b===vb).map(({s,i})=>{
    const done=S.stepDone[i], cur=i===S.cur, num=s.i+1;
    const m = done?`<span class="mark done">${ic("check",15,2.25)}</span>`:(cur?`<span class="mark cur num">${num}</span>`:`<span class="mark num">${num}</span>`);
    const tags = (!done?`<span class="step-where">${esc(stepWhere(s))}</span>`:"")+(s.cp?`<span class="cp">${ic("flag",13,2)}Checkpoint</span>`:"")+(cur?badge("Agora","b-info"):"");
    const clickable = cur;
    return `<li><${clickable?'button data-act="focusNext"':"div"} class="step ${cur?"cur":""}">${m}<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-weight:${cur?600:500};color:${done?"var(--muted)":(cur?"var(--ink)":"var(--muted)")}">${esc(s.t)}</span>${(!open&&!done)?`<span class="xs subtle">Abre quando o Bloco ${vb} terminar</span>`:""}</span><span style="display:flex;gap:10px;align-items:center">${tags}</span></${clickable?"button":"div"}></li>`;
  }).join("");
  if(vb===0){
    rows += `<li><div class="step"><span class="mark opt">${ic("brain",14)}</span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-weight:500;color:var(--muted)">Montar seu Personal Brain</span><span class="xs subtle">Ativo opcional. Não bloqueia o avanço.</span></span>${S.personal?badge("Feito","b-ok"):`<button class="btn btn-ghost btn-sm" data-act="personal">Fazer agora</button>`}</div></li>`;
  }
  return `<section style="display:flex;flex-direction:column;gap:16px" aria-labelledby="t-trilha">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap"><div style="display:flex;flex-direction:column;gap:4px"><h2 class="h-lg" id="t-trilha">Sua Trilha</h2><p class="sm muted" style="font-size:14px">O caminho: o que fazer agora, passo a passo. ${doneCount()} de ${TOTAL_STEPS} passos, ${cpDone()} de ${TOTAL_CP} checkpoints.</p></div></div>
    ${prog(doneCount()/TOTAL_STEPS*100)}
    <div class="blocks" role="group" aria-label="Blocos da Trilha">${tabs}</div>
    <ol class="steps" aria-label="Passos do Bloco ${b.n}">${rows}</ol>
  </section>`;
}

function planLines(compact){
  const a=mainAgent(); const L=[];
  const line=(lab,txt,st,act)=>{
    const map=(lab==="Fonte"?{conf:["b-ok","Conectada"],decl:["b-info","Pendente de teste"],block:["b-warn","Bloqueio"],prev:["b-ai","Prevista"],out:["b-out","Fora do escopo"]}:{conf:["b-ok","Confirmado"],decl:["b-info","Declarado"],block:["b-warn","Bloqueio"],gap:["b-brand","Lacuna"],prev:["b-ai","Recomendado"]})[st];
    const kind={"Agente":"bot","Responsabilidade":"check","Fonte":"plug","Skill":"book"}[lab]||"plug";
    const key=lab+"|"+txt; const fl=isR()&&PREV_PL[key]&&PREV_PL[key]!==st; NEXT_PL[key]=st;
    return `<li class="pl ${fl?"flash":""}"><span class="pl-kind" aria-hidden="true">${ic(kind,16)}</span><span class="pl-txt"><span class="xs subtle">${lab}</span><span style="font-size:14px;line-height:20px;font-weight:500">${esc(txt)}</span></span><span class="pl-end">${act||""}<span class="badge ${map[0]}">${map[1]}</span></span></li>`;
  };
  if(a){ L.push(line("Agente",`${agName(a)} no Hermes`,a.online?"conf":"decl"));
         L.push(line("Responsabilidade",a.resp,S.respConf?"conf":"decl")); }

    const st = f.st==="conf"?"conf":f.st==="block"?"block":f.st==="decl"?"decl":f.st==="out"?"out":"prev";

function empresaBody(){
  const people=[{ini:initials(),n:fullName(),f:roleLabel(),a:(mainAgent()||{}).area,where:S.cur<TOTAL_STEPS?`Bloco ${ALL_STEPS[S.cur].b+1}, passo ${S.cur+1}`:"Trilha concluída",tone:"b-ok",st:"No ritmo"}]
    .concat(S.invites.map(p=>({ini:p.email.slice(0,2).toUpperCase(),n:p.email,f:p.fn||"Função a definir",a:null,where:"Onboarding",tone:"",st:p.st||"Convite enviado"})));
  const rows=people.map(p=>`<tr><td><span style="display:flex;align-items:center;gap:10px"><span class="avatar">${esc(p.ini)}</span><span style="display:flex;flex-direction:column;min-width:0"><span class="h-sm" style="font-size:14px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(p.n)}">${esc(p.n)}</span><span class="xs subtle">${esc(p.f)}</span></span></span></td><td>${p.a?`<span style="display:inline-flex;gap:8px;align-items:center">${chip(p.a,26)}Pixel ${AREAS[p.a].n}</span>`:`<span class="subtle">Sem agente ainda</span>`}</td><td class="muted num">${p.where}</td><td>${badge(p.st,p.tone)}</td></tr>`).join("");
  const used=people.length; const blocks=allFontes().filter(f=>f.st==="block");
  const prios=S.prios.map(x=>{ const has=S.agents.some(g=>g.area===x); const pct=has?Math.min(100,Math.round(doneCount()/7*100)):0;
    const g=S.agents.find(a=>a.area===x);
    return `<li class="team-r ${has?"on":""}" style="--tint:var(--px-${x})"><span class="team-av ${has?"":"asleep"}" title="${has?"Acordado: tem agente":"Dormindo: ainda sem agente"}">${pixel(x,34,{lids:true,label:""})}${has?"":`<span class="team-z" aria-hidden="true">z</span>`}</span><span class="team-info"><span class="team-n">Pixel ${AREAS[x].n}</span><span class="team-s">${has?`${esc(agState(g))} · ${esc((g&&g.resp)||"1 agente")}`:"Sem agente ainda"}</span></span><span class="team-meter">${prog(pct,"","tm-"+x)}<span class="xs subtle num">${pct}%</span></span>${has?`<button class="btn btn-secondary btn-sm team-act" data-act="fichaOpen" data-arg="${S.agents.indexOf(g)}">Ver ficha</button>`:`<button class="btn btn-secondary btn-sm team-act" data-act="builderOpen">Criar agente</button>`}</li>`; }).join("");
  const withAg=S.prios.filter(x=>S.agents.some(g=>g.area===x)).length;
  return `<section class="card card-strong emp-hero">
      <div style="display:flex;flex-direction:column;gap:14px"><span style="display:flex;align-items:center;gap:12px">${logoTile(40)}<span style="display:flex;flex-direction:column"><span class="label-brand">Plano da empresa</span><span class="h-sm" style="font-size:14px">${esc(S.ws.name||"Sua empresa")}</span></span></span><h2 class="display" style="font-size:26px;line-height:1.15">${esc(destino())}</h2><p class="muted">Estágio atual: ${STAGES[stage()].toLowerCase()}. ${stage()<2?"A empresa ainda não está legível para os agentes: o Company Brain entra no Bloco 2.":""}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" data-act="go" data-arg="plano">Abrir plano da empresa</button><button class="btn btn-secondary" data-act="inviteOpen">${ic("plus",16)}Convidar participante</button></div></div>
      <div class="team"><div class="team-head"><span class="sm" style="font-weight:700">Time de Pixels</span><span class="xs subtle num">${S.prios.length} prioridade${S.prios.length===1?"":"s"} · ${withAg} com agente</span></div>${prios?`<ul class="team-list">${prios}</ul>`:`<p class="sm muted">Nenhuma prioridade definida.</p>`}</div>
    </section>
    <div class="grid-main">
      <section class="card"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px"><div style="display:flex;flex-direction:column;gap:4px"><h2 class="h-lg">Participantes</h2><p class="sm muted num" style="font-size:14px">${used} de 12 lugares ocupados</p></div><button class="btn btn-ghost btn-sm" data-act="inviteOpen">${ic("plus",14)}Convidar</button></div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th scope="col">Pessoa</th><th scope="col">Agente</th><th scope="col">Onde está</th><th scope="col">Situação</th></tr></thead><tbody>${rows}</tbody></table></div>
        <p class="inset sm muted" style="display:flex;gap:10px;line-height:19px">${ic("shield",16)}<span>Você vê o progresso na Trilha e as entregas operacionais autorizadas. As respostas pessoais do diagnóstico de cada participante ficam privadas.</span></p>
      </section>
      <div class="col">
        <section class="card"><h2 class="h-md">Limites do plano</h2>
          <div style="display:flex;flex-direction:column;gap:10px"><span class="h-sm" style="font-size:14px;display:flex;gap:10px;align-items:center">${ic("bot")}Créditos de IA</span><span style="display:flex;align-items:baseline;gap:6px"><span class="num" style="font-size:24px;font-weight:600;letter-spacing:-.02em">${brl(S.credits)}</span><span class="sm subtle">de R$ 500,00 este mês</span></span>${prog(S.credits/500*100)}<span class="xs subtle">Usados pelo Hubzinho. Renovam todo mês e não acumulam.</span></div>
          <div style="display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line-soft)"><span class="h-sm" style="font-size:14px;display:flex;gap:10px;align-items:center">${ic("users")}Mentorias técnicas</span><span style="display:flex;align-items:baseline;gap:6px"><span class="num" style="font-size:24px;font-weight:600">${S.mentoria}h</span><span class="sm subtle">de 12h compartilhadas</span></span>${prog(S.mentoria/12*100)}<span class="xs subtle">Horas, não créditos. Valem para toda a equipe.</span></div>
          <div style="display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--line-soft)">${ic("live")}<span class="h-sm" style="font-size:14px;flex:1">Hands-on</span>${badge("Ilimitado","b-ok")}</div>
        </section>
        <section class="card"><h2 class="h-md" style="display:flex;gap:10px;align-items:center">${ic("alert")}Onde o grupo travou</h2>${blocks.length?blocks.map(f=>`<div class="inset" style="background:var(--warn-soft);display:flex;flex-direction:column;gap:4px"><span class="h-sm" style="font-size:14px">${esc(f.f)}</span><span class="sm muted">O teste de conexão falhou. Um plantão de mentoria resolve isso.</span></div>`).join("")+`<button class="btn btn-secondary btn-sm" data-act="go" data-arg="aovivo">${ic("cal",16)}Sugerir mentoria ao grupo</button>`:`<p class="sm muted">Ninguém travado agora. Quando um teste falhar, aparece aqui.</p>`}</section>
      </div>
    </div>`;
}

function thumb(t,i,opts={}){
  const a=THUMB_AREAS[i%THUMB_AREAS.length]; const dur=(String(opts.m||"").match(/(\d+) min/)||[])[1];
  const src=REAL_THUMBS[i%REAL_THUMBS.length];
  return `<span class="thumb thumb-real" style="--tint:var(--px-${a})"><img class="th-img" src="${src}" alt="" loading="lazy"><span class="th-shade" aria-hidden="true"></span>${opts.kicker?`<span class="th-label">${esc(opts.kicker)}</span>`:""}<span class="th-play" aria-hidden="true">${ic("play",opts.big?22:16,2)}</span>${dur?`<span class="th-dur num">${dur}:00</span>`:""}${S.aulaSeen&&S.aulaSeen[t]?`<span class="th-prog"><span style="width:100%"></span></span>`:""}</span>`;
}
function vcard(t,m,i,rec){
  return `<button class="vcard" data-act="aula" data-arg="${esc(t)}">${thumb(t,i,{m,kicker:(m||"").split(",")[0]})}<span class="vc-txt"><span class="vc-t">${esc(t)}</span><span class="xs subtle">${esc(m)}${S.aulaSeen&&S.aulaSeen[t]?", assistida":""}</span>${rec?badge("Para o seu passo","b-brand"):""}</span></button>`;
}
function viewAprender(){
  const rec=(ALL_STEPS[S.cur]||{}).aula; const ri=AULAS.findIndex(x=>x[0]===rec);
  const recs=liveSessions().filter(x=>S.watched[x.id]);
  const feat = ri>=0 ? `<section class="feat"><button class="feat-thumb" data-act="aula" data-arg="${esc(rec)}">${thumb(rec,ri,{m:AULAS[ri][1],big:true,kicker:"Para o seu passo"})}</button><div class="feat-txt"><span class="label-brand">Continue daqui</span><h2 class="display" style="font-size:28px;line-height:1.12">${esc(rec)}</h2><p class="muted">A aula do passo em que você está na Trilha. ${esc(AULAS[ri][1])}.</p><div><button class="btn btn-primary" data-act="aula" data-arg="${esc(rec)}">${ic("play",16,2)}Assistir agora</button></div></div></section>` : "";
  const rows=[["Bloco 1: Seu primeiro agente de trabalho","Bloco 1"],["Bloco 2: Cérebro e agentes da empresa","Bloco 2"],["Bloco 3: Operação agêntica","Bloco 3"]].map(([title,key])=>{
    const list=AULAS.map((x,i)=>({x,i})).filter(o=>o.x[1].startsWith(key)); if(!list.length) return "";
    return `<section class="shelf"><div class="shelf-head"><h2 class="h-md">${title}</h2><span class="xs subtle num">${list.length} aula${list.length>1?"s":""}</span></div><div class="shelf-row">${list.map(o=>vcard(o.x[0],o.x[1],o.i,o.x[0]===rec)).join("")}</div></section>`;
  }).join("");
  const recRow = recs.length ? `<section class="shelf"><div class="shelf-head"><h2 class="h-md">Gravações das suas sessões</h2></div><div class="shelf-row">${recs.map((x,k)=>vcard("Gravação: "+x.t,x.s,k+3,false)).join("")}</div></section>` : "";
  return pageHead("Aprender","Aulas para aprofundar o seu passo. A Trilha diz o que fazer; aqui você aprende como.",humTag("Aulas gravadas por pessoas"))+feat+recRow+rows;
}
function nextSession(){

}
function sessionRow(x){

  const stat = w ? badge("Assistida","b-ok") : (on ? badge("Inscrita","b-ok") : `<button class="btn btn-primary btn-sm" data-act="enroll" data-arg="${x.id}">Inscrever-me</button>`);

  return `<li class="sess on">${head}<div class="sess-next" data-key="next-${x.id}">

function liveTick(){
  const d=S.dlg; if(!d||d.k!=="live"){ clearInterval(LIVE_T); LIVE_T=null; return; }
  const sec=Math.floor((Date.now()-d.t0)/1000);
  const el=document.getElementById("live-clock"); if(el) el.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
  const x=liveSessions().find(s=>s.id===d.id); const sc=LIVE_SCRIPT[x.k];
  let changed=false;
  if(sec>0 && sec%9===0 && d.beat<sc.beats.length && d.lastBeat!==sec){ d.lastBeat=sec; d.chat.push(sc.beats[d.beat]); d.beat++; if(d.ch<sc.chapters.length-1) d.ch++; changed=true; }
  if(x.k==="mentoria" && d.q>0 && sec>0 && sec%7===0 && d.lastQ!==sec){ d.lastQ=sec; d.q--; changed=true; if(d.q===0) toast("É a sua vez no plantão."); }

}

function pxaMix(h,t){ const n=parseInt(h.slice(1),16); const r=n>>16,g=n>>8&255,b=n&255; const m=c=>Math.round(c+(255-c)*t); return "#"+[m(r),m(g),m(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }

function handleLogo(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast("Esse arquivo não é uma imagem. Use PNG, JPG ou SVG."); return; }
  if(file.size>5*1024*1024){ toast("A imagem passa de 5 MB. Use uma versão menor."); return; }
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image(); img.onload=()=>{
      const N=160, c=document.createElement("canvas"); c.width=c.height=N; const g=c.getContext("2d");
      const r=Math.min(N/img.width, N/img.height); const w=img.width*r, h=img.height*r; g.drawImage(img,(N-w)/2,(N-h)/2,w,h);
      try{ S.ws.logo=c.toDataURL("image/png"); }catch(e){ S.ws.logo=rd.result; }
      render(); toast("Logo da empresa atualizado.");
    }; img.onerror=()=>toast("Não consegui abrir essa imagem. Tente outro arquivo."); img.src=rd.result; };
  rd.readAsDataURL(file);
}

  const rm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dt = rm?150:750;
  S.gen={i:0}; render("#focus-h");
  const tick=()=>{ if(!S.gen) return; S.gen.i++; render();
    if(S.gen.i>=GEN_STEPS.length){ setTimeout(()=>{ S.gen=null; S.ob=5; render("#focus-h"); }, rm?80:380); }
    else setTimeout(tick,dt); };
  setTimeout(tick,dt);
}

function morph(root, html){
  const tpl=document.createElement("template"); tpl.innerHTML=html; patchChildren(root, tpl.content);

function patchChildren(a,b){
  const ac=[...a.childNodes], bc=[...b.childNodes];
  for(let i=0;i<Math.max(ac.length,bc.length);i++){
    const x=ac[i], y=bc[i];
    if(!x){ a.appendChild(y); continue; }
    if(!y){ a.removeChild(x); continue; }
    patchNode(x,y);
  }
}
function patchNode(x,y){
  if(x.nodeType!==y.nodeType || x.nodeName!==y.nodeName){ x.replaceWith(y); return; }
  if(x.nodeType===3 || x.nodeType===8){ if(x.nodeValue!==y.nodeValue) x.nodeValue=y.nodeValue; return; }
  if(x.nodeType!==1) return;
  if((x.getAttribute("data-key")||"")!==(y.getAttribute("data-key")||"")){ x.replaceWith(y); return; }
  for(const at of [...x.attributes]) if(!y.hasAttribute(at.name)) x.removeAttribute(at.name);
  for(const at of [...y.attributes]) if(x.getAttribute(at.name)!==at.value) x.setAttribute(at.name,at.value);
  const focused = x===document.activeElement;
  if(x.nodeName==="INPUT"){ if(!focused && x.value!==(y.getAttribute("value")||"")) x.value=y.getAttribute("value")||""; return; }
  if(x.nodeName==="TEXTAREA"){ if(!focused && x.value!==y.textContent) x.value=y.textContent; return; }
  patchChildren(x,y);
}
function renderRoot(id, html){
  const root=document.getElementById(id);
  if(!html){
    if(root.childElementCount && !root.dataset.closing){
      const kids=[...root.children];
      if(RM() || !kids[0].animate){ root.innerHTML=""; return; }
      root.dataset.closing="1";
      Promise.all(kids.map(k=>{
        const asDrawer = k.classList.contains("dialog") && !k.classList.contains("live") && document.documentElement.dataset.ovl==="drawer";
        const t = (k.classList.contains("drawer")||asDrawer) ? (window.innerWidth<=860&&asDrawer?"translateY(24px)":"translateX(24px)") : (k.classList.contains("dialog") ? "scale(.97)" : "none");
        return k.animate([{opacity:1,transform:"none"},{opacity:0,transform:t}],{duration:150,easing:"cubic-bezier(.4,0,1,1)",fill:"forwards"}).finished;
      })).then(()=>{ if(root.dataset.closing){ root.innerHTML=""; delete root.dataset.closing; } }).catch(()=>{ root.innerHTML=""; delete root.dataset.closing; });
    }
    return;
  }
  if(root.dataset.closing){ delete root.dataset.closing; root.innerHTML=""; }
  const d0 = id==="dlgroot" ? document.getElementById("dlg") : null;
  const h0 = d0 ? d0.getBoundingClientRect().height : 0;
  morph(root, html);
  const d1 = id==="dlgroot" ? document.getElementById("dlg") : null;
  if(d0 && d1===d0 && !RM() && d1.animate && !(document.documentElement.dataset.ovl==="drawer" && !d1.classList.contains("live"))){
    const h1=d1.getBoundingClientRect().height;

      d1.animate([{height:h0+"px"},{height:h1+"px"}],{duration:260,easing:"cubic-bezier(.23,1,.32,1)"}).finished.then(()=>{ d1.style.overflow=prev; }).catch(()=>{});
    }

}

    if(!S.hub.msgs.some(m=>m.r==="sys"&&S.hub.msgs.indexOf(m)>S.hub.msgs.indexOf(bot)-1)) cardsFor(bot.t,text).forEach(c=>S.hub.msgs.push({r:"card",c}));
    S.credits=Math.round((S.credits+0.35)*100)/100;
  }catch(e){
    S.hub.typing=false;
    const code=e&&e.code;
    if(code==="cancelled"){ if(started){ bot.t=(bot.t||"")+" (interrompido)"; } }
    else{
      if(e&&e.text&&started) bot.t=e.text+" (interrompido)";
      if(["not_granted","sampling_disabled","capability_disabled","capability_removed","not_declared"].includes(code)){ S.aiOff=true; }
      const fb=hubReply(text);
      if(!started) S.hub.msgs.push({r:"bot",t:fb.r});
      if(fb.sys) S.hub.msgs.push({r:"sys",t:fb.sys});
      toast(AI_ERR[code]||"Não consegui falar com a IA agora. Usei a resposta de demonstração.");
    }
  }finally{ HUB_CTL=null; render("#hub-in"); }
}

function hubSend(text){ if(!pxThanks(text)&&!pxChatEggs(text)) pxReact("recv"); setTimeout(()=>{ try{ convTitleFromFirst(); }catch(e){} },0);
  text=(text||"").trim(); if(!text) return;

document.addEventListener("keydown",e=>{ const t=e.target; if((e.key==="Enter"||e.key===" ") && t.matches && t.matches('article[role="button"][data-act]')){ e.preventDefault(); t.click(); } });
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return; const t=e.target;
  if(t.id==="ws-name"||t.id==="ws-setor"){ e.preventDefault(); A.obNext(); }
});

try{ render(); }catch(err){ console.error(err); try{localStorage.removeItem(KEY);}catch(e){} S=fresh(); render(); toast("O progresso salvo era de uma versão antiga do protótipo. Recomeçamos do início."); }
hubSleepLater();
})();

/* a conversa reserva a altura real da caixa de respostas fixa, medida ao vivo */
(function(){ let RO=null, cur=null, lastH=0;
  function watch(){ const d=document.querySelector(".v4-dock"); if(d===cur) return; if(RO&&cur) RO.unobserve(cur); cur=d; if(!d){ document.documentElement.style.removeProperty("--v4dock"); return; }
    if(!RO&&"ResizeObserver" in window) RO=new ResizeObserver(()=>{ const h=Math.ceil(cur.getBoundingClientRect().height); if(h===lastH) return; const atEnd=(innerHeight+scrollY)>=(document.documentElement.scrollHeight-lastH-40); lastH=h; document.documentElement.style.setProperty("--v4dock",h+"px"); if(atEnd) window.scrollTo(0,document.documentElement.scrollHeight); });
    if(RO) RO.observe(d); lastH=Math.ceil(d.getBoundingClientRect().height); document.documentElement.style.setProperty("--v4dock",lastH+"px"); }
  const MO=new MutationObserver(watch); document.addEventListener("DOMContentLoaded",()=>{ const app=document.getElementById("app")||document.body; MO.observe(app,{childList:true,subtree:true}); watch(); }); if(document.readyState!=="loading"){ const app=document.getElementById("app")||document.body; MO.observe(app,{childList:true,subtree:true}); setTimeout(watch,0); }
})();

/* inclinação do avatar seguindo o mouse (até 8°) */
document.addEventListener("pointermove",e=>{ const t=e.target.closest&&e.target.closest(".pxa-tilt"); document.querySelectorAll(".pxa-tilt>svg").forEach(sv=>{ if(!t||!t.contains(sv)||matchMedia("(prefers-reduced-motion: reduce)").matches){ sv.style.transform=""; return; } const r=t.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5; sv.style.transform=`rotateY(${(x*16).toFixed(1)}deg) rotateX(${(-y*16).toFixed(1)}deg)`; }); },{passive:true});
</script>
