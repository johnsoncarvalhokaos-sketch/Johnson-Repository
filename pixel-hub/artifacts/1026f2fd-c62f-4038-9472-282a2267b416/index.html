<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Hub 2.0 · protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;600;700&family=Funnel+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#f1f2f8;--raised:#ffffff;--sunken:#e8eaf4;--hover:#e2e4ef;
  --line:#d7dae9;--line-soft:#e8eaf4;
  --ink:#0e1238;--muted:#464c70;--subtle:#636a92;--inverse:#ffffff;
  --action:#0e1238;--action-hover:#1d2356;--action-ink:#ffffff;--action-soft:#e2e4ef;
  --brand:#ff5a1f;--brand-soft:#ffeee6;--brand-ink:#9a3008;--focus:#ff5a1f;
  --ok:#0d7a55;--ok-soft:#e3f6ee;--warn:#9a5b00;--warn-soft:#fdf0dc;--danger:#c0271f;--danger-soft:#fdeae8;--info:#2446b8;--info-soft:#e8edfc;
  --agent-financeiro:#d99a00;--agent-vendas:#c25d00;--agent-compras:#107a52;--agent-marketing:#c2156a;--agent-rh:#6b3fd4;--agent-operacao:#1f4fd4;--agent-gestao:#0e7f8c;--agent-extensao:#5a6188;
  --pixel-screen:#131138;--pixel-off:#b9bed5;--overlay:#0e123899;
  --sh-xs:0 1px 2px 0 #0e123814;
  --sh-sm:0 1px 2px 0 #0e12380f,0 2px 6px -2px #0e123814;
  --sh-md:0 2px 4px -1px #0e123814,0 8px 16px -4px #0e12381f;
  --sh-lg:0 8px 16px -6px #0e12381f,0 24px 48px -12px #0e123833;
  --sh-btn:inset 0 1px 0 0 #ffffff26,0 1px 2px 0 #0e123829;
  --glow:0 0 0 4px #ff5a1f29;
  --f-display:"Funnel Display","Satoshi",system-ui,sans-serif;
  --f-sans:"Satoshi","Funnel Sans",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:#0b0e24;--raised:#141833;--sunken:#070a1c;--hover:#1d2242;--line:#2a3054;--line-soft:#1d2242;
    --ink:#f3f4fa;--muted:#b4b9dd;--subtle:#9aa0c8;--inverse:#0b0e24;
    --action:#f3f4fa;--action-hover:#dcdfee;--action-ink:#0b0e24;--action-soft:#272c4d;
    --brand:#ff6b33;--brand-soft:#2e1a12;--brand-ink:#ffb694;--focus:#ff8a5c;
    --ok:#3ddc97;--ok-soft:#0d2a20;--warn:#ffb020;--warn-soft:#2e2008;--danger:#ff7a70;--danger-soft:#2f1211;--info:#8fb0ff;--info-soft:#121a3a;
    --agent-financeiro:#f5c035;--agent-vendas:#ff9a2e;--agent-compras:#2fd394;--agent-marketing:#ff53a0;--agent-rh:#a98cff;--agent-operacao:#6e95ff;--agent-gestao:#35c9d6;--agent-extensao:#8e95bd;
    --pixel-off:#343a60;--overlay:#000000b3;
    --sh-xs:0 1px 2px 0 #00000066;--sh-sm:0 1px 2px 0 #00000059,0 2px 6px -2px #00000066;--sh-md:0 2px 4px -1px #0000005c,0 8px 16px -4px #00000080;--sh-lg:0 8px 16px -6px #00000073,0 24px 48px -12px #00000099;
    --sh-btn:inset 0 1px 0 0 #ffffff1a,0 1px 2px 0 #00000080;--glow:0 0 0 4px #ff6b3340;
  }
}
:root[data-theme="dark"]{
  --surface:#0b0e24;--raised:#141833;--sunken:#070a1c;--hover:#1d2242;--line:#2a3054;--line-soft:#1d2242;
  --ink:#f3f4fa;--muted:#b4b9dd;--subtle:#9aa0c8;--inverse:#0b0e24;
  --action:#f3f4fa;--action-hover:#dcdfee;--action-ink:#0b0e24;--action-soft:#272c4d;
  --brand:#ff6b33;--brand-soft:#2e1a12;--brand-ink:#ffb694;--focus:#ff8a5c;
  --ok:#3ddc97;--ok-soft:#0d2a20;--warn:#ffb020;--warn-soft:#2e2008;--danger:#ff7a70;--danger-soft:#2f1211;--info:#8fb0ff;--info-soft:#121a3a;
  --agent-financeiro:#f5c035;--agent-vendas:#ff9a2e;--agent-compras:#2fd394;--agent-marketing:#ff53a0;--agent-rh:#a98cff;--agent-operacao:#6e95ff;--agent-gestao:#35c9d6;--agent-extensao:#8e95bd;
  --pixel-off:#343a60;--overlay:#000000b3;
  --sh-xs:0 1px 2px 0 #00000066;--sh-sm:0 1px 2px 0 #00000059,0 2px 6px -2px #00000066;--sh-md:0 2px 4px -1px #0000005c,0 8px 16px -4px #00000080;--sh-lg:0 8px 16px -6px #00000073,0 24px 48px -12px #00000099;
  --sh-btn:inset 0 1px 0 0 #ffffff1a,0 1px 2px 0 #00000080;--glow:0 0 0 4px #ff6b3340;
}
:root{--cta:var(--action);--cta-hover:var(--action-hover);--cta-ink:var(--action-ink);--ring:#ff5a1f33}
:root[data-theme="dark"]{--ring:#ff6b3355}
:root[data-version="v2"]{--cta:#ff5a1f;--cta-hover:#f04e14;--cta-ink:#ffffff}
:root[data-version="v3"]{--cta:#c43c0a;--cta-hover:#ad3409;--cta-ink:#ffffff}
:root[data-theme="dark"][data-version="v2"],:root[data-theme="dark"][data-version="v3"]{--cta:#ff6b33;--cta-hover:#ff8a5c;--cta-ink:#0b0e24}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* tipografia */
.display{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
.d-md{font-size:32px;line-height:1.15}
.d-ob{font-size:36px;line-height:1.1;letter-spacing:-.025em}
.h-lg{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.015em}
.h-md{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.h-sm{font-size:15px;line-height:20px;font-weight:600;letter-spacing:-.005em}
.muted{color:var(--muted)}.subtle{color:var(--subtle)}
.sm{font-size:13px;line-height:18px}.xs{font-size:12px;line-height:16px}
.lead{font-size:16px;line-height:24px;color:var(--muted);max-width:58ch;text-wrap:pretty}
.label-brand{font-size:13px;line-height:18px;font-weight:600;color:var(--brand-ink)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:8px;border:1px solid transparent;font-size:15px;line-height:20px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;transition-property:background-color,border-color,color,box-shadow,scale;transition-duration:160ms;transition-timing-function:var(--ease)}
.btn:active:not(:disabled){scale:.96}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--cta);color:var(--cta-ink);border-color:var(--cta);box-shadow:var(--sh-btn)}
.btn-primary:hover:not(:disabled){background:var(--cta-hover);border-color:var(--cta-hover)}
.btn-secondary{background:var(--raised);color:var(--ink);border-color:var(--line);box-shadow:var(--sh-xs)}
.btn-secondary:hover:not(:disabled){background:var(--hover)}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover:not(:disabled){background:var(--action-soft);color:var(--ink)}
.btn-danger-ghost{color:var(--danger)}
.btn-sm{height:34px;padding:0 14px;font-size:13px}
.btn-lg{height:52px;padding:0 26px;font-size:16px}
.btn-full{width:100%}
.icon-btn{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--raised);box-shadow:var(--sh-xs);display:grid;place-items:center;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--hover)}
.link{font-size:14px;line-height:20px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* superfícies */
.card{background:var(--raised);border:1px solid var(--line-soft);border-radius:16px;box-shadow:var(--sh-sm);padding:24px;display:flex;flex-direction:column;gap:16px}
.card-strong{box-shadow:var(--sh-md)}
.inset{background:var(--surface);border-radius:12px;padding:14px 16px}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.badge::before{content:"";width:6px;height:6px;border-radius:999px;background:currentColor}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-info{background:var(--info-soft);color:var(--info)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-dang{background:var(--danger-soft);color:var(--danger)}.b-brand{background:var(--brand-soft);color:var(--brand-ink)}
.progress{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden}
.progress>span{display:block;height:100%;border-radius:999px;background:var(--action);transition:width 200ms var(--ease)}
.progress.ok>span{background:var(--ok)}

/* campos */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;line-height:20px;font-weight:500}
.field .opt{font-size:12px;font-weight:400;color:var(--subtle);margin-left:6px}
.input,.textarea{width:100%;min-height:46px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background-color:var(--raised);box-shadow:var(--sh-xs);font-size:15px;transition-property:border-color,box-shadow;transition-duration:160ms;-webkit-appearance:none;appearance:none}
.input:hover,.textarea:hover{border-color:var(--subtle)}
.input:-webkit-autofill,.input:-webkit-autofill:hover,.input:-webkit-autofill:focus{-webkit-text-fill-color:var(--ink);box-shadow:0 0 0 1000px var(--raised) inset;transition:background-color 9999s}
.textarea{padding:12px 16px;min-height:96px;resize:vertical;line-height:22px}
.input::placeholder,.textarea::placeholder{color:var(--subtle)}
.input:focus,.textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
.input:focus-visible,.textarea:focus-visible{outline:none;border-radius:8px}
.field.invalid .input,.field.invalid .textarea{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.field.invalid .input:focus,.field.invalid .textarea:focus{box-shadow:0 0 0 1px var(--danger),0 0 0 4px var(--danger-soft)}
.help{font-size:13px;line-height:18px;color:var(--muted)}
.err{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:18px;font-weight:500;color:var(--danger)}
.err svg{flex-shrink:0;margin-top:1px}

/* escolhas */
.pill{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--raised);box-shadow:var(--sh-xs);font-size:14px;font-weight:600;transition-property:background-color,border-color,color;transition-duration:160ms}
.pill[aria-pressed="true"]{background:var(--action);border-color:var(--action);color:var(--action-ink);box-shadow:var(--sh-btn)}
.choice{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-radius:12px;text-align:left;border:1px solid var(--line);background:var(--raised);box-shadow:var(--sh-xs);transition-property:border-color,box-shadow;transition-duration:160ms;width:100%}
.choice:hover{border-color:var(--subtle)}
.choice[aria-pressed="true"]{border:1.5px solid var(--ink);box-shadow:var(--sh-md);padding:15.5px 17.5px}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;display:grid;place-items:center;background:var(--raised)}
.choice[aria-pressed="true"] .check,.check.on{background:var(--ink);border-color:var(--ink);color:var(--raised)}
.radio{border-radius:999px}

/* layout do app */
.app{display:flex;min-height:100vh}
.side{width:248px;flex-shrink:0;padding:24px 16px;display:flex;flex-direction:column;gap:24px;border-right:1px solid var(--line-soft);position:sticky;top:0;height:100vh;overflow-y:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:500;color:var(--muted);transition:background-color 160ms}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--sh-sm);font-weight:600}
.nav .lock{margin-left:auto;color:var(--subtle)}
.main{flex:1;min-width:0;padding:40px 48px 96px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.pagehead .t{display:flex;flex-direction:column;gap:6px}
.tabs{display:inline-flex;padding:4px;border-radius:10px;background:var(--sunken);gap:4px}
.tabs button{height:36px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--sh-sm)}
.tabbar{display:none}


/* sidebar: expandida e recolhida */
.side{transition-property:width,padding;transition-duration:200ms;transition-timing-function:var(--ease)}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 0 8px;min-height:44px}
.side-logo{display:inline-flex;align-items:center;gap:10px;min-width:0}
.wordmark{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.03em}
.side-toggle{width:36px;height:36px;box-shadow:none;border-color:transparent;background:transparent}
.side-toggle:hover{background:var(--hover)}
.ws{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line-soft);background:var(--raised);box-shadow:var(--sh-xs);min-width:0}
.ws-ini{width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--inverse);display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.ws-meta{display:flex;flex-direction:column;min-width:0}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.hubcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--raised);box-shadow:var(--sh-sm);text-align:left;width:100%}
.hubcard:hover{box-shadow:var(--sh-md)}
.hub-meta,.prof-meta{display:flex;flex-direction:column;min-width:0;flex:1}
.prof{display:flex;align-items:center;gap:8px;padding:8px 6px 0}
.icon-btn.mini{width:36px;height:36px;box-shadow:none;border-color:transparent;background:transparent;flex-shrink:0}
.icon-btn.mini:hover{background:var(--hover)}
.nav a .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.side.collapsed{width:76px;padding:24px 14px;overflow:visible}
.side.collapsed .wordmark,.side.collapsed .lbl,.side.collapsed .ws-meta,.side.collapsed .hub-meta,.side.collapsed .prof-meta{display:none}
.side.collapsed .side-head{flex-direction:column;padding:0;gap:14px}
.side.collapsed .ws{padding:0;border:0;background:transparent;box-shadow:none;justify-content:center;width:44px;height:44px;margin:0 auto;border-radius:8px}
.side.collapsed .nav a{width:48px;height:44px;padding:0;justify-content:center;margin:0 auto}
.side.collapsed .hubcard{width:48px;height:48px;padding:0;justify-content:center;margin:0 auto}
.side.collapsed .prof{flex-direction:column;padding:8px 0 0;gap:4px}

/* tooltips só no modo recolhido */
.side.collapsed [data-tip]{position:relative}
.side.collapsed [data-tip]:hover::after,.side.collapsed [data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;translate:0 -50%;background:var(--ink);color:var(--inverse);padding:6px 10px;border-radius:6px;font-family:var(--f-sans);font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;box-shadow:var(--sh-md);z-index:60;pointer-events:none;animation:tip 120ms var(--ease)}
@keyframes tip{from{opacity:0;translate:-4px -50%}}


/* ===== versão Refinada (data-craft="refined") ===== */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1)}
.toast{transition-property:opacity,translate;transition-duration:150ms;transition-timing-function:ease-out}
.toast.out{opacity:0;translate:0 4px}
.choice[aria-checked="true"]{border:1.5px solid var(--ink);box-shadow:var(--sh-md);padding:15.5px 17.5px}
.choice[aria-checked="true"] .check{background:var(--ink);border-color:var(--ink);color:var(--raised)}
[data-craft="refined"] .card{border-color:transparent;box-shadow:0 0 0 1px #0e12380d,var(--sh-sm)}
[data-craft="refined"] .card-strong{box-shadow:0 0 0 1px #0e12380d,var(--sh-md)}
[data-theme="dark"][data-craft="refined"] .card{box-shadow:0 0 0 1px #ffffff12,var(--sh-sm)}
[data-theme="dark"][data-craft="refined"] .card-strong{box-shadow:0 0 0 1px #ffffff12,var(--sh-md)}
[data-craft="refined"] .choice[aria-pressed="true"],[data-craft="refined"] .choice[aria-checked="true"],[data-craft="refined"] .pixcard[aria-pressed="true"],[data-craft="refined"] .block[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring),var(--sh-sm)}
[data-craft="refined"] .choice[aria-pressed="true"] .check,[data-craft="refined"] .choice[aria-checked="true"] .check,[data-craft="refined"] .pixcard[aria-pressed="true"] .ck{background:var(--brand);border-color:var(--brand);color:#fff}
[data-craft="refined"] .subtasks{border-radius:16px;padding:8px}
[data-craft="refined"] .subtask{border-radius:8px}
[data-craft="refined"] .tabs{border-radius:12px}
[data-craft="refined"] .vopt{border-radius:8px}
[data-craft="refined"] .side{transition:none}
[data-craft="refined"] .icon-btn.mini{width:40px;height:40px}
[data-craft="refined"] .drawer{animation:slide 240ms var(--ease-drawer)}
@media (hover:hover) and (pointer:fine){[data-craft="refined"] .block:not([aria-pressed="true"]):hover{border-color:var(--line)}}
.pagehead.quiet{align-items:center}
.greet{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:15px;line-height:22px;font-weight:600}
.ns-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ns-agent{display:flex;align-items:center;gap:10px}
.ns-title{font-family:var(--f-display);font-size:30px;line-height:1.12;font-weight:600;letter-spacing:-.022em;text-wrap:balance}
.ns-subhead{display:flex;justify-content:space-between;align-items:baseline;padding:2px 10px 6px}
.block .progress{height:4px;margin-top:6px}
.donesum{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:12px;color:var(--muted);font-size:14px;font-weight:500;width:100%;text-align:left}
.donesum:hover{background:var(--hover)}
.donesum .more{margin-left:auto;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.rail{position:sticky;top:24px;gap:0;padding:0}
.rail .sec{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.rail .sec+.sec{border-top:1px solid var(--line-soft)}
.pl.flash{animation:flash 1.6s var(--ease-out);border-radius:8px;margin:0 -8px;padding-left:8px;padding-right:8px}
@keyframes flash{0%,30%{background:var(--brand-soft)}100%{background:transparent}}
.check.pop{animation:popin 180ms var(--ease-out)}
@keyframes popin{from{scale:.6;opacity:.4}}
[data-craft="refined"] .hubpix .eye{transform-box:fill-box;transform-origin:center;animation:blink 7s infinite}
@keyframes blink{0%,95.5%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.12)}}
.bot-row{display:flex;gap:8px;align-items:flex-start;align-self:flex-start;max-width:92%}
.bot-row .msg{max-width:none}
.gen-list{display:flex;flex-direction:column;gap:6px}
.gen-list li{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;font-size:15px;font-weight:500;color:var(--subtle)}
.gen-list li.cur{background:var(--raised);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px #0e12380d,var(--sh-sm)}
.gen-list li.done{color:var(--muted)}
.vtabs{display:flex;gap:4px;padding:4px;margin:4px 4px 6px;border-radius:12px;background:var(--sunken)}
.vtabs button{flex:1;height:32px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}

/* estúdio do Agent Builder */
.studio{position:fixed;inset:0;z-index:400;background:var(--surface);animation:studioin 280ms cubic-bezier(.23,1,.32,1)}
@keyframes studioin{from{opacity:0;translate:0 12px}}
.st-wrap{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%}
.st-rail{background:linear-gradient(170deg,#101c7e 0%,#0e1238 70%);color:#fff;padding:32px 24px;display:flex;flex-direction:column;gap:28px;overflow-y:auto}
.st-kicker{font-size:12px;line-height:16px;font-weight:700;color:#ffb694}
.st-title{font-family:var(--f-display);font-size:36px;line-height:1.02;font-weight:600;letter-spacing:-.03em;color:#fff;margin-top:6px}
.st-sub{color:#ffffffb3;font-size:14px;line-height:20px;margin-top:10px;text-wrap:pretty}
.st-prev{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px;border-radius:16px;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--tint) 38%,transparent),transparent 68%),#ffffff0d;box-shadow:inset 0 0 0 1px #ffffff14;text-align:center}
.st-prev .h-sm{color:#fff}.st-prev .xs{color:#ffffffa6}
.st-steps{display:flex;flex-direction:column;gap:4px}
.st-steps li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;color:#ffffff99;transition:background-color 200ms}
.st-steps li.cur{background:#ffffff17;color:#fff}
.st-steps .m{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;background:#ffffff1f;color:#fff;flex-shrink:0;transition-property:background-color,box-shadow;transition-duration:200ms}
.st-steps li.done .m{background:#3ddc97;color:#0b0e24}
.st-steps li.cur .m{background:var(--brand);box-shadow:0 0 0 4px #ff5a1f40}
.st-st{display:flex;flex-direction:column;gap:1px;min-width:0}
.st-t{font-size:14px;line-height:20px;font-weight:600}
.st-v{font-size:12px;line-height:16px;color:#ffffff8c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-main{display:flex;flex-direction:column;min-width:0;overflow-y:auto}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 40px}
.st-body{flex:1;width:100%;max-width:780px;margin:0 auto;padding:12px 40px 0}
.st-body .dstep{gap:24px}
.st-body .dstep>div:first-child h2.h-lg{font-family:var(--f-display);font-size:34px;line-height:1.08;letter-spacing:-.025em;text-wrap:balance}
.studio .dialog-foot{position:sticky;bottom:0;background:var(--surface);padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));margin-top:8px;border-top:1px solid var(--line-soft);z-index:2}
.ch-ic{width:36px;height:36px;border-radius:10px;background:var(--sunken);color:var(--ink);display:grid;place-items:center;flex-shrink:0;transition-property:background-color,color;transition-duration:180ms}
.choice[aria-checked="true"] .ch-ic{background:var(--brand-soft);color:var(--brand-ink)}
@media (max-width:860px){
  .st-wrap{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .st-rail{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;gap:10px}
  .st-sub,.st-prev{display:none}
  .st-title{font-size:22px;margin-top:2px}
  .st-steps{flex-direction:row;gap:6px}
  .st-steps li{padding:0;background:none!important}
  .st-steps .st-st{display:none}
  .st-steps li.cur .st-st{display:flex}
  .st-top{padding:12px 16px}
  .st-body{padding:0 16px}
  .st-body .dstep>div:first-child h2.h-lg{font-size:26px}
}
/* onboarding: etapas verticais sob o Hubzinho */
.ob-step-sm{display:none}
.vsteps ol{display:flex;flex-direction:column;margin-top:4px}
.vsteps li{position:relative;display:flex;gap:12px;padding-bottom:16px}
.vsteps li:not(:last-child)::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;border-radius:2px;background:var(--line-soft)}
.vsteps li.done:not(:last-child)::before{background:var(--ok)}
.vs-m{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--sunken);color:var(--subtle);flex-shrink:0;position:relative;z-index:1}
.vsteps li.done .vs-m{background:var(--ok-soft);color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.vsteps li.cur .vs-m{background:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--ring)}
.vs-body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;padding-top:2px}
.vs-t{font-size:14px;line-height:20px;font-weight:600;color:var(--subtle)}
.vsteps li.done .vs-t{color:var(--muted)}.vsteps li.cur .vs-t{color:var(--ink)}
.vs-v{font-size:13px;line-height:18px;color:var(--ink);font-weight:500}
.vs-ans{display:flex;flex-direction:column;gap:8px}
.vs-ans li{display:grid;grid-template-columns:1fr auto;column-gap:8px;padding:0}
.vs-ans li::before{display:none}
.vs-k{grid-column:1;font-size:11px;line-height:14px;font-weight:600;color:var(--subtle)}
.vs-ans .vs-v{grid-column:1}
.vs-edit{grid-column:2;grid-row:1 / span 2;align-self:center;font-size:12px;font-weight:600;color:var(--muted);padding:4px 6px;border-radius:6px}
.vs-edit:hover{background:var(--hover);color:var(--ink)}
.vs-chips{display:flex;flex-wrap:wrap;gap:6px}
.vs-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--raised);box-shadow:0 0 0 1px var(--line-soft)}
@media (max-width:860px){.vsteps{display:none}.ob-step-sm{display:inline}}
/* Aprender: playlist */
.feat{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center;padding:20px;border-radius:20px;background:var(--raised);box-shadow:0 0 0 1px #0e12380d,var(--sh-md)}
.feat-thumb{display:block;border-radius:14px;overflow:hidden}
.feat-txt{display:flex;flex-direction:column;gap:12px}
.thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 70% 40%,color-mix(in srgb,var(--tint) 75%,#fff 0%),transparent 60%),linear-gradient(135deg,color-mix(in srgb,var(--tint) 55%,#0e1238) 0%,#0e1238 100%)}

.th-px{position:absolute;right:10%;top:50%;translate:0 -50%;filter:drop-shadow(0 10px 18px #00000059);transition:scale 260ms cubic-bezier(.23,1,.32,1)}

.th-play{position:absolute;left:14px;bottom:12px;width:36px;height:36px;border-radius:999px;background:#fff;color:#0e1238;display:grid;place-items:center;box-shadow:0 6px 14px -4px #00000080;transition:scale 200ms cubic-bezier(.23,1,.32,1)}

.th-prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:#ffffff40}.th-prog span{display:block;height:100%;background:var(--brand)}
.vcard{display:flex;flex-direction:column;gap:10px;text-align:left;width:260px;flex-shrink:0;scroll-snap-align:start}

.vc-txt{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.vc-t{font-size:14px;line-height:20px;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shelf{display:flex;flex-direction:column;gap:12px}
.shelf-head{display:flex;justify-content:space-between;align-items:baseline}
.shelf-row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px}
@media (max-width:860px){.feat{grid-template-columns:1fr;padding:14px}.vcard{width:220px}}
/* Hubzinho: cartões no chat */
.hcard{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:12px;background:var(--raised);box-shadow:0 0 0 1px var(--line-soft),var(--sh-xs);margin-left:30px;animation:rise 220ms cubic-bezier(.23,1,.32,1)}

.agc-top{display:flex;align-items:center;gap:16px}
.agc-id{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.agc-top .badge{box-shadow:inset 0 0 0 1px currentColor;flex-shrink:0}
.agc-resp{padding-left:76px;margin-top:-4px}
.agc-stats{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:13px;line-height:18px;color:var(--muted)}
.agc-stats b{color:var(--ink);font-weight:700}
.agc-more{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink)}
@media (max-width:520px){.agc-resp{padding-left:0}.agc-more{margin-left:0}}
.persona-stage{display:grid;place-items:center;width:100%;padding:22px 0 10px;border-radius:14px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--tint) 30%,transparent),transparent 70%)}
.persona-stage svg{filter:drop-shadow(0 14px 18px color-mix(in srgb,var(--tint) 45%,#0e123866))}
.tone-acc{display:grid;place-items:center;width:44px;height:44px}
.tone-soon{opacity:.6;border-style:dashed!important;cursor:not-allowed;justify-content:center;color:var(--muted)}
.persona{align-items:flex-start}
.persona-prev{position:sticky;top:0}
.req{color:var(--brand);font-weight:700}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill-row.pill-err{padding:10px;border-radius:14px;background:var(--danger-soft);box-shadow:inset 0 0 0 1px var(--danger)}
.pill[role="radio"][aria-checked="true"]{background:var(--ink);color:var(--inverse);border-color:var(--ink)}
[data-craft="refined"] .pill[role="radio"][aria-checked="true"]{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.select-wrap{position:relative}
.select-wrap svg{position:absolute;right:14px;top:50%;translate:0 -50%;pointer-events:none;color:var(--muted)}
.select-wrap .input{padding-right:40px}
.welcome-vid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:center;padding:12px;border-radius:16px;background:var(--raised);box-shadow:0 0 0 1px var(--line-soft),var(--sh-xs);text-align:left}
.welcome-vid .thumb{border-radius:10px}
.wv-txt{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
@media (max-width:640px){.welcome-vid{grid-template-columns:1fr}}
/* versão Essencial */
.se-wrap.se-wide{max-width:820px}
.e-custbox{width:100%;border-radius:14px;background:var(--raised);box-shadow:0 0 0 1px var(--line-soft);overflow:hidden}
.e-custbtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;text-align:left}
.e-custbtn svg:last-child{transition:rotate 200ms cubic-bezier(.23,1,.32,1);color:var(--muted)}
.e-custbtn[aria-expanded="true"] svg:last-child{rotate:180deg}
.e-cust{display:flex;flex-direction:column;gap:14px;padding:4px 16px 16px;animation:rise 220ms cubic-bezier(.23,1,.32,1)}
.e-crow{display:flex;flex-direction:column;gap:8px}
.e-tones{gap:6px}
.e-tones .tone{min-width:0;flex:1 1 72px;padding:8px 6px;gap:4px}
.e-main .req{display:none}
.e-top{justify-content:space-between}
.e-prog{display:flex;gap:6px}
.e-prog span{width:40px;height:4px;border-radius:999px;background:var(--line);transition:background-color 240ms}
.e-prog span.on{background:var(--brand)}
.e-body{display:block!important}
.e-main{width:100%;max-width:560px;margin:0 auto;padding:48px 20px 96px;display:flex;flex-direction:column;gap:24px;animation:rise 260ms cubic-bezier(.23,1,.32,1)}
.e-hub{display:flex;align-items:center;gap:12px}
.e-hub p{font-size:15px;line-height:22px;color:var(--muted)}
.e-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.e-list{display:flex;flex-direction:column;gap:8px;border-radius:14px}
.e-list.pill-err{padding:10px}
.e-choice{padding:14px 16px;align-items:center}
.e-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:4px}
.e-studio{overflow-y:auto}
.se-wrap{max-width:520px;margin:0 auto;padding:20px 20px 48px;display:flex;flex-direction:column;gap:8px;min-height:100%}
.se-top{display:flex;justify-content:space-between;align-items:center}
.se-body{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:8px}
.se-art{width:220px;height:190px;display:grid;place-items:center;border-radius:999px;background:radial-gradient(circle,color-mix(in srgb,var(--tint) 30%,transparent),transparent 68%)}
.e-switch{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:14px;background:var(--raised);box-shadow:0 0 0 1px var(--line-soft)}
.sw-track{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line);flex-shrink:0;transition:background-color 200ms}
.sw-thumb{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff;box-shadow:0 1px 3px #0e123840;transition:translate 220ms cubic-bezier(.23,1,.32,1)}
.e-switch[aria-checked="true"] .sw-track{background:var(--brand)}
.e-switch[aria-checked="true"] .sw-thumb{translate:18px 0}
.tag-flow{background:var(--brand)!important;color:#fff!important}
@media (max-width:640px){.e-row{grid-template-columns:1fr}.e-main{padding:28px 16px 96px}.e-prog span{width:28px}}
/* trilha */
.blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.block{text-align:left;padding:16px 18px;border-radius:12px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line-soft);background:var(--raised);box-shadow:var(--sh-xs)}
.block[aria-pressed="true"]{border:1.5px solid var(--ink);box-shadow:var(--sh-md);padding:15.5px 17.5px}
.block.locked{background:transparent;border-style:dashed;border-color:var(--line);box-shadow:none}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;border:1px solid transparent;width:100%;text-align:left}
.step.cur{background:var(--raised);border-color:var(--line-soft);box-shadow:var(--sh-sm)}
button.step:hover:not(:disabled){background:var(--hover)}
button.step:disabled{cursor:default}
.mark{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;flex-shrink:0;font-size:12px;font-weight:700;background:var(--sunken);color:var(--subtle)}
.mark.done{background:var(--ok-soft);color:var(--ok)}
.mark.cur{background:var(--action);color:var(--action-ink);box-shadow:var(--sh-btn)}
.mark.opt{background:transparent;border:1.5px dashed var(--line)}
.cp{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:16px;font-weight:600;color:var(--ink);white-space:nowrap}
.subtasks{display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--surface);border-radius:12px}
.subtask{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;width:100%;text-align:left;font-size:15px;line-height:22px}
.subtask:hover{background:var(--hover)}
.subtask.done span.t{color:var(--subtle);text-decoration:line-through}

/* plano */
.pl{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft)}
.pl:first-child{border-top:0}
.pl .dot{width:18px;height:18px;border-radius:999px;flex-shrink:0;margin-top:2px;display:grid;place-items:center}
.dot.conf{background:var(--ok);color:var(--raised)}
.dot.decl{border:1.5px dashed var(--subtle)}
.dot.block{background:var(--warn-soft);color:var(--warn)}
.dot.gap{background:var(--sunken)}
.dot.prev{border:1.5px solid var(--line)}
.pl .tag{font-size:12px;line-height:16px;font-weight:600;white-space:nowrap}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stage{display:flex;flex-direction:column;gap:8px}
.stage .bar{display:flex;align-items:center;gap:8px}
.stage .dt{width:14px;height:14px;border-radius:999px;background:var(--sunken);border:1.5px solid var(--line);flex-shrink:0}
.stage.done .dt{background:var(--ok);border-color:var(--ok)}
.stage.on .dt{background:var(--brand);border-color:var(--brand);box-shadow:var(--glow)}
.stage .ln{flex:1;height:2px;border-radius:2px;background:var(--sunken)}
.stage.done .ln{background:var(--ok)}

/* tabela */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:10px 12px;font-size:12px;line-height:16px;font-weight:600;color:var(--subtle)}
.tbl td{padding:12px;border-top:1px solid var(--line-soft);font-size:14px;line-height:20px;vertical-align:middle}
.avatar{width:32px;height:32px;border-radius:999px;background:var(--hover);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.tbl-wrap{overflow-x:auto;margin:0 -24px;padding:0 12px}

/* onboarding */
.ob-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 40px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.ob-steps{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ob-steps li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--subtle)}
.ob-steps li.cur{color:var(--ink);font-weight:600}
.ob-steps li.done{color:var(--muted)}
.ob-steps .m{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--sunken)}
.ob-steps li.cur .m{background:var(--action);color:var(--action-ink);box-shadow:var(--sh-btn)}
.ob-steps li.done .m{background:var(--ok-soft);color:var(--ok)}
.ob-steps .sep{width:24px;height:1px;background:var(--line)}
.ob-body{max-width:1120px;margin:0 auto;padding:48px 40px 96px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;align-items:start}
.guide{display:flex;flex-direction:column;gap:16px;position:sticky;top:24px}
.bubble{padding:18px 20px;border-radius:4px 16px 16px 16px;background:var(--raised);border:1px solid var(--line-soft);box-shadow:var(--sh-sm);font-size:16px;line-height:24px;text-wrap:pretty}
.ob-main{display:flex;flex-direction:column;gap:28px;min-width:0;max-width:760px}
.ob-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}
.ob-actions .sp{flex:1}
.answered{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--raised);border:1px solid var(--line-soft)}
.pixgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pixcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:20px;border-radius:16px;background:var(--raised);border:1px solid var(--line-soft);box-shadow:var(--sh-xs);text-align:left;min-height:188px;transition-property:border-color,box-shadow;transition-duration:160ms}
.pixcard:hover{border-color:var(--line)}
.pixcard[aria-pressed="true"]{border:1.5px solid var(--ink);box-shadow:var(--sh-md);padding:19.5px}
.pixcard .ck{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:999px;border:1.5px solid var(--line);display:grid;place-items:center}
.pixcard[aria-pressed="true"] .ck{background:var(--ink);border-color:var(--ink);color:var(--raised)}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:300;animation:fade 160ms var(--ease)}
.dialog{position:fixed;z-index:400;left:50%;top:50%;translate:-50% -50%;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--raised);border-radius:16px;box-shadow:var(--sh-lg);padding:28px;display:flex;flex-direction:column;gap:20px;animation:pop 180ms var(--ease)}
.dialog.wide{width:min(720px,calc(100vw - 32px))}
.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.dialog-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding-top:4px}
.drawer{position:fixed;z-index:400;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--raised);box-shadow:var(--sh-lg);display:flex;flex-direction:column;animation:slide 200ms var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hub-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line-soft)}
.hub-msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:12px 14px;border-radius:14px;font-size:14px;line-height:21px;text-wrap:pretty}
.msg.bot{background:var(--surface);border-top-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--action);color:var(--action-ink);border-top-right-radius:4px;align-self:flex-end}
.msg.sys{align-self:stretch;max-width:none;background:var(--ok-soft);color:var(--ink);font-size:13px;line-height:19px;display:flex;gap:10px;align-items:flex-start}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:999px;background:var(--subtle);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.sugg{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}
.sugg button{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font-size:13px;font-weight:600;color:var(--ink)}
.sugg button:hover{background:var(--hover)}
.hub-input{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line-soft)}
.toasts{position:fixed;z-index:500;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:12px;background:var(--ink);color:var(--inverse);box-shadow:var(--sh-lg);font-size:14px;line-height:20px;max-width:420px;animation:rise 180ms var(--ease)}
.toast button{font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--inverse)}
.hub-fab{display:none}
.vswitch{position:fixed;z-index:450;left:50%;bottom:20px;translate:-50% 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.vbtn{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 8px 0 14px;border-radius:999px;background:var(--ink);color:var(--inverse);box-shadow:var(--sh-lg);font-size:13px;font-weight:600}
.vbtn .tag{height:26px;padding:0 10px;border-radius:999px;background:color-mix(in srgb,var(--inverse) 16%,transparent);display:inline-flex;align-items:center;gap:6px}
.vbtn .sw{width:10px;height:10px;border-radius:3px}
.vpanel{width:min(380px,calc(100vw - 32px));background:var(--raised);border:1px solid var(--line-soft);border-radius:16px;box-shadow:var(--sh-lg);padding:8px;display:flex;flex-direction:column;gap:2px;animation:rise 160ms var(--ease)}
.vpanel .vh{padding:10px 12px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.vopt{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:10px;text-align:left;width:100%}
.vopt:hover{background:var(--hover)}
.vopt[aria-checked="true"]{background:var(--surface)}
.vopt .swatch{width:36px;height:24px;border-radius:6px;flex-shrink:0;box-shadow:var(--sh-btn);display:grid;place-items:center;font-size:11px;font-weight:700}
.vopt .rd{width:18px;height:18px;border-radius:999px;border:1.5px solid var(--line);flex-shrink:0;margin-top:3px;display:grid;place-items:center}
.vopt[aria-checked="true"] .rd{border-color:var(--ink)}
.vopt[aria-checked="true"] .rd::after{content:"";width:8px;height:8px;border-radius:999px;background:var(--ink)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;scale:.97}}
@keyframes slide{from{translate:16px 0;opacity:0}}
@keyframes rise{from{translate:0 8px;opacity:0}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* responsivo */
@media (max-width: 1100px){
  .grid-main{grid-template-columns:minmax(0,1fr)}
  .pixgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 860px){
  .side{display:none}
  .main{padding:20px 16px 160px}
  .wrap{gap:24px}
  .d-md{font-size:26px}
  .d-ob{font-size:28px}
  .blocks{grid-template-columns:1fr}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--raised);box-shadow:var(--sh-lg);border-radius:20px 20px 0 0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;text-decoration:none;font-size:11px;line-height:14px;font-weight:500;color:var(--subtle);min-height:44px}
  .tabbar a[aria-current="page"]{color:var(--ink);font-weight:700}
  .vswitch{left:16px;translate:none;align-items:flex-start;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .hub-fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:110;width:56px;height:56px;border-radius:16px;background:var(--raised);box-shadow:var(--sh-lg);border:1px solid var(--line-soft)}
  .ob-top{padding:14px 16px}
  .ob-steps .lbl{display:none}
  .ob-body{grid-template-columns:1fr;padding:24px 16px 120px;gap:24px}
  .guide{position:static}
  .slots{grid-template-columns:1fr}
  .tbl-wrap{margin:0 -24px}
  .toasts{left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));align-items:stretch}
  .ob-grid-2{grid-template-columns:1fr!important}
}
@media (max-width: 520px){
  .pixgrid{grid-template-columns:1fr 1fr}
  .pixcard{min-height:170px;padding:16px}
  .pixcard[aria-pressed="true"]{padding:15.5px}
  .dialog{padding:22px}
}

/* ===== ações fixas no rodapé ===== */
.ob-actions,.e-actions{position:fixed!important;left:0;right:0;bottom:0;z-index:60;margin:0!important;display:flex;align-items:center;gap:12px;flex-wrap:nowrap;padding:14px var(--fr) calc(14px + env(safe-area-inset-bottom,0px)) var(--fl)!important;background:color-mix(in srgb,var(--surface) 96%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);box-shadow:0 -1px 0 var(--line-soft)}
.ob-actions{--fl:max(40px,calc((100vw - 1120px)/2 + 348px));--fr:max(40px,calc((100vw - 1120px)/2 + 40px))}
.e-actions{--fl:max(20px,calc((100vw - 560px)/2 + 20px));--fr:var(--fl);justify-content:space-between}
.ob-body{padding-bottom:140px}
.e-main{padding-bottom:140px}
:root[data-route="ob"] .vswitch{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
:root[data-route="ob"] .toasts{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
@media (max-width:860px){.ob-actions{--fl:16px;--fr:16px}.ob-actions .btn-lg{flex:1}.e-actions .btn-lg{flex:1}}
/* criação do agente: rodapé preso ao fim da tela */
.se-wrap{min-height:100%}
.se-body{flex:1}
.se-foot{position:sticky;bottom:0;width:100%;margin-top:auto;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 96%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 -1px 0 var(--line-soft)}
.st-body{display:flex;flex-direction:column}
.st-body .dstep{flex:1}
.studio .dialog-foot{margin-top:auto}

/* Safari: a barra fixa não pode ter ancestral animado; o menu de versões sai de perto da barra */
.e-main{animation:none!important}
.e-main>:not(.e-actions){animation:rise 260ms cubic-bezier(.23,1,.32,1)}
:root[data-route="ob"] .vswitch{top:auto!important;bottom:calc(16px + env(safe-area-inset-bottom,0px))!important;left:16px!important;translate:none!important;align-items:flex-start!important;flex-direction:column!important;z-index:450}
:root[data-route="ob"] .vbtn .tag:not(.tag-flow){display:none}
@media (max-width:860px){:root[data-route="ob"] .vswitch{bottom:calc(88px + env(safe-area-inset-bottom,0px))!important}}

/* menu de versões como botão flutuante colapsável */
.vfab{width:48px;height:48px;padding:0!important;justify-content:center;border-radius:999px!important;gap:0!important;position:relative;transition-property:scale,background-color,box-shadow;transition-duration:180ms;transition-timing-function:cubic-bezier(.23,1,.32,1)}
.vfab:hover{scale:1.06}
.vfab:active{scale:.94}
.vfab-ic{display:grid;place-items:center;transition:rotate 220ms cubic-bezier(.23,1,.32,1)}
.vfab.on .vfab-ic{rotate:90deg}

/* Hubzinho flutuante no onboarding */
.hob{position:fixed;right:20px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:460;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}

/* Hubzinho flutuante: dorme recolhido, acorda quando ativa */
.hob-fab .hubsleep{position:relative;display:grid;place-items:center}
.hob-fab .hubsleep .eye,.hob-fab .hubsleep .lid{transition:opacity 220ms ease}
.hob-fab.asleep .hubsleep .eye{opacity:0}
.hob-fab.asleep .hubsleep .lid{opacity:1}
.hob-fab.asleep .zzz{display:block}
.hob-fab.asleep:hover .hubsleep .eye,.hob-fab.asleep:focus-visible .hubsleep .eye{opacity:1}
.hob-fab.asleep:hover .hubsleep .lid,.hob-fab.asleep:focus-visible .hubsleep .lid{opacity:0}
.hob-fab.asleep:hover .zzz,.hob-fab.asleep:focus-visible .zzz{display:none}
.hob-fab.awake .hubsleep .eye{opacity:1}
.hob-fab.awake .hubsleep .lid{opacity:0}
.hob-fab.awake .zzz{display:none}
.hob-fab.awake .hubsleep svg{animation:hobwake 520ms cubic-bezier(.23,1,.32,1)}
@keyframes hobwake{0%{translate:0 0}30%{translate:0 -6px;scale:1.08}60%{translate:0 0;scale:.98}100%{scale:1}}
@media (prefers-reduced-motion: reduce){.hob-fab.awake .hubsleep svg{animation:none}}

.hob-fab.asleep .hubsleep .eye{animation:none!important;opacity:0!important}

/* easter egg: choque no Hubzinho com dois cliques */
.e-hub{user-select:none;-webkit-user-select:none}
.e-hub-px{position:relative;display:inline-grid;place-items:center;cursor:pointer}
.e-hub-px .spark{position:absolute;opacity:0;pointer-events:none}
.e-hub-px .s1{top:-14px;left:-10px;rotate:-25deg}
.e-hub-px .s2{top:-16px;right:-12px;rotate:20deg}
.e-hub-px .s3{bottom:-6px;right:-16px;rotate:75deg}
.e-hub-px.zap>svg:first-child{animation:pxshock 900ms linear}
.e-hub-px.zap .eye{animation:none!important;transform-box:fill-box;transform-origin:center;scale:1 .3}
.e-hub-px.zap .spark{animation:pxspark 900ms linear}
.e-hub-px.zap .s2{animation-delay:60ms}.e-hub-px.zap .s3{animation-delay:120ms}
@keyframes pxshock{
  0%{translate:0 0;filter:none}
  8%{translate:-3px 1px;filter:brightness(1.9) saturate(.2)}
  16%{translate:3px -1px;filter:invert(1) hue-rotate(180deg)}
  24%{translate:-3px -1px;filter:brightness(1.9) saturate(.2)}
  32%{translate:3px 1px;filter:invert(1) hue-rotate(180deg)}
  40%{translate:-2px 0;filter:brightness(1.6)}
  52%{translate:2px 0;filter:none}
  64%{translate:-1px 1px}
  76%{translate:1px 0}
  100%{translate:0 0;filter:none}}
@keyframes pxspark{0%{opacity:0;scale:.5}10%{opacity:1;scale:1.1}22%{opacity:.15}34%{opacity:1;scale:1}48%{opacity:.2}60%{opacity:.9}80%,100%{opacity:0;scale:.7}}
@media (prefers-reduced-motion: reduce){

  @keyframes pxshocklite{50%{filter:brightness(1.7)}}
