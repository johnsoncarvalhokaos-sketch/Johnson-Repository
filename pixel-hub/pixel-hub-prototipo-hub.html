<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel AI Hub, onboarding e Agent Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700&family=Funnel+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app de três colunas no estilo da referência (menu à esquerda, agente no centro, ajustes à direita), com o primeiro acesso por cima em modal e tela cheia. Só tema claro, de propósito: é a mesma página branca da landing E. */
:root{
  color-scheme:light;
  --bg:#FFFFFF;
  --soft:#FAFAFB;
  --sunken:#F3F4F6;
  --ink:#15161C;
  --ink-2:#4A4C57;
  --muted:#7A7C88;
  --line:#E9EAEE;
  --line-2:#DCDDE3;
  --hover-line:#BFC1CA;
  --brand:#FF5A1F;
  --brand-ink:#C2410C;
  --brand-bg:#FFEEE6;
  --brand-line:#FFD5C3;
  --ok:#12875A;
  --ok-bg:#E3F4EB;
  --blue-ink:#1F4FCC;
  --blue-bg:#E8EFFF;
  --eye:#FFFFFF;
  --gray-px:#E1E2E8;
  --c-mkt:#EC3FAC;
  --c-ven:#FF5A1F;
  --c-fin:#FFAA1C;
  --c-com:#17AE78;
  --c-rh:#7B5CFF;
  --c-ope:#2E6BFF;
  --c-ges:#10A3B3;
  --scrim:rgba(21,22,28,.28);
  --veil:rgba(244,244,247,.55);
  --shadow-s:0 1px 2px rgba(21,22,28,.05),0 8px 22px -14px rgba(21,22,28,.24);
  --shadow-l:0 2px 4px rgba(21,22,28,.04),0 44px 80px -44px rgba(21,22,28,.34);
  --shadow-pop:0 0 0 1px var(--line),0 22px 50px -18px rgba(21,22,28,.32);
  --f-d:'Funnel Display','Funnel Sans',ui-sans-serif,system-ui,sans-serif;
  --f-s:'Funnel Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --side:262px;
  --cfg:372px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-s);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p,ol,ul,dl,dd,figure{margin:0}
ol,ul{padding:0;list-style:none}
h1,h2{font-family:var(--f-d);font-weight:500;letter-spacing:-.03em;text-wrap:balance}
h3,h4{font-size:inherit;font-weight:600}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sp{flex:1}
.muted{color:var(--muted)}
.u{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

/* pixel */
.px{display:block;height:auto;overflow:visible;flex:none}
.px .px-h,.px .px-b{fill:var(--c)}
.px .px-e rect{fill:var(--eye)}
.px .px-l{transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .22s ease-out}
.px .px-e{transform-box:fill-box;transform-origin:50% 50%;animation:px-blink 6.2s infinite;animation-delay:var(--bd,0s)}
.px .px-h{transform-box:fill-box;transform-origin:50% 100%}
@keyframes px-blink{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}96%{transform:scaleY(1)}}
.px.hop{transform-origin:50% 100%;animation:px-hop .62s cubic-bezier(.3,.7,.3,1)}
.px.hop .px-h{animation:px-head .62s cubic-bezier(.3,.7,.3,1)}
.px.jump{transform-origin:50% 100%;animation:px-jump 1.15s cubic-bezier(.3,.7,.3,1) infinite}
@keyframes px-hop{0%{transform:none}14%{transform:scale(1.08,.9)}44%{transform:translateY(-10px) scale(.95,1.07)}72%{transform:scale(1.05,.95)}100%{transform:none}}
@keyframes px-jump{0%{transform:none}8%{transform:scale(1.08,.9)}26%{transform:translateY(-12px) scale(.95,1.07)}42%{transform:scale(1.05,.95)}54%,100%{transform:none}}
@keyframes px-head{0%{transform:none}14%{transform:translateY(2px)}44%{transform:translateY(-2px)}72%{transform:translateY(1.5px)}100%{transform:none}}

/* ícones de ferramenta */
.ic{display:inline-grid;place-items:center;flex:none}
.ic svg{width:var(--is,16px);height:var(--is,16px);fill:none;stroke:var(--ic);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic-c{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-s)}
.ic-c.sm{width:28px;height:28px;--is:14px;box-shadow:none}
.ic-c.off{opacity:.5;border-style:dashed;box-shadow:none}
.abi{display:inline-grid;place-items:center;flex:none}
.abi .u{width:16px;height:16px;color:var(--ink-2)}
.ic-t{--is:14px}
.ic-l{width:26px;height:26px;border-radius:8px;background:var(--soft);border:1px solid var(--line);--is:14px}
.ict{width:18px;height:18px;--is:17px}
.ck{width:20px;height:20px;display:block;flex:none}
.ck circle{fill:var(--ok-bg)}
.ck path{fill:none;stroke:var(--ok);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spin{display:block;width:16px;height:16px;margin:2px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--ink);animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-weight:500;font-size:14.5px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn .u{width:16px;height:16px}
.btn-p{background:var(--ink);color:#fff}
.btn-p:hover:not(:disabled){background:#2A2B33}
.btn-g{background:#fff;color:var(--ink);border-color:var(--line-2)}
.btn-g:hover:not(:disabled){border-color:var(--hover-line)}
.btn:disabled{opacity:.45}
.btn-sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn-lg{height:48px;padding:0 22px;font-size:16px;border-radius:11px}
.btn .ck{width:16px;height:16px}
.ibtn{position:relative;width:32px;height:32px;display:inline-grid;place-items:center;flex:none;padding:0;border:0;background:none;border-radius:8px;color:var(--ink-2)}
.ibtn:hover:not(:disabled){background:var(--sunken);color:var(--ink)}
.ibtn:disabled{opacity:.35}
.ibtn.sm{width:28px;height:28px}
.ibtn.sm .u{width:16px;height:16px}
.lnk{border:0;background:none;padding:4px 6px;border-radius:6px;color:var(--muted);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.lnk:hover{color:var(--ink)}
.lnk .u{width:15px;height:15px}
.lnk2{border:0;background:none;padding:0;color:var(--ink-2);font-size:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.lnk2:hover{color:var(--ink);text-decoration-color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;padding:3px 9px;border-radius:999px;background:var(--ok-bg);color:var(--ok);white-space:nowrap;line-height:1.4}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.wait{background:var(--brand-bg);color:var(--brand-ink)}
.pill.idle{background:var(--sunken);color:var(--muted)}
.pill.blue{background:var(--blue-bg);color:var(--blue-ink)}
.lbl{display:block;font-size:12.5px;font-weight:550;color:var(--muted)}
.eyebrow{font-size:13px;font-weight:600;color:var(--brand-ink)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--brand);transition:width .5s}

/* casca do app */
.shell{--sw:var(--side);--cw:var(--cfg);height:100%;display:grid;grid-template-columns:var(--sw) minmax(0,1fr) var(--cw);transition:filter .3s}
.shell.noagent,.shell.cfg-off{--cw:0px}
.shell.side-off{--sw:0px}
.shell.side-off .side,.shell.noagent .cfg,.shell.cfg-off .cfg{display:none}
.shell.blur{pointer-events:none;user-select:none}
.side{grid-column:1}
.center{grid-column:2}
.cfg{grid-column:3}

/* menu lateral */
.side{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--soft);border-right:1px solid var(--line)}
.side-scroll{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:8px;height:44px;padding:0 0 0 8px;margin-bottom:4px}
.mark{display:grid;grid-template-columns:8px 8px;gap:2px;flex:none}
.mark i{width:8px;height:8px;border-radius:2.5px;background:var(--brand)}
.mark i:nth-child(4){background:none;box-shadow:inset 0 0 0 2px var(--brand)}
.wm{font-family:var(--f-d);font-weight:700;font-size:21px;letter-spacing:-.045em;line-height:1}
.hubtag{font-size:11px;font-weight:600;letter-spacing:.02em;padding:3px 6px;border-radius:6px;background:var(--ink);color:#fff;line-height:1.1;white-space:nowrap}
.brand .tb{margin-left:auto;display:flex}
.agw{position:relative}
.agsel{display:flex;align-items:center;gap:9px;width:100%;height:40px;padding:0 8px;border:0;background:none;border-radius:10px;font-weight:600;font-size:15px;text-align:left}
.agsel:hover{background:#fff}
.agsel .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agsel > .u{color:var(--muted);width:16px;height:16px}
.agsel .px{width:22px}
.ph{display:block;width:22px;height:22px;border-radius:7px;border:1.5px dashed var(--line-2)}
.newc{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;margin:6px 0 10px;border-radius:10px;background:#fff;border:1px solid var(--line-2);font-weight:500;font-size:14.5px;box-shadow:0 1px 2px rgba(21,22,28,.04)}
.newc:hover:not(:disabled){border-color:var(--hover-line)}
.newc:disabled{opacity:.5}
.newc .u{width:16px;height:16px}
.nav{display:flex;flex-direction:column;gap:1px}
.ni{display:flex;align-items:center;gap:11px;width:100%;height:36px;padding:0 10px;border:0;background:none;border-radius:9px;font-size:14.5px;color:var(--ink);text-align:left;white-space:nowrap}
.ni > .u{color:var(--ink-2)}
.ni:hover{background:#fff}
.ni.on{background:#fff;font-weight:550;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(21,22,28,.05)}
.ni .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--sunken);font-size:12px;font-weight:600;color:var(--ink-2);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.sl{font-size:12.5px;color:var(--muted);margin:16px 10px 5px;font-weight:500}
.rs{display:flex;gap:6px}
.rs input{flex:1;min-width:0;height:34px;border:1px solid var(--line-2);border-radius:9px;background:#fff;padding:0 11px;font-size:14px}
.rs input::placeholder{color:var(--muted)}
.rs input:focus{outline:0;border-color:var(--hover-line)}
.rs .ibtn{border:1px solid var(--line-2);background:#fff;width:34px;height:34px}
.rs .ibtn .u{width:16px;height:16px}
.recents{display:flex;flex-direction:column;gap:1px;margin-top:8px}
.nochats{border:1.5px dashed var(--line-2);border-radius:12px;padding:20px 12px;text-align:center;font-weight:600;font-size:14px}
.nochats small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.nores{font-size:13px;color:var(--muted);padding:6px 10px}
.rc{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 10px;border:0;background:none;border-radius:9px;font-size:14px;color:var(--ink-2);text-align:left}
.rc .u{width:16px;height:16px;color:var(--muted)}
.rc span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc:hover{background:#fff}
.rc.on{background:#fff;color:var(--ink);font-weight:550;box-shadow:0 0 0 1px var(--line)}
.side-foot{flex:none;padding:12px 12px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.cred-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:550}
.cred-h b{font-weight:500;color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cred .bar{margin:8px 0 10px}
.cred .btn{width:100%}
.me{display:flex;align-items:center;gap:9px}
.avm{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#2E2F38;color:#fff;font-size:12px;font-weight:600;flex:none;letter-spacing:.02em}
.me-t{flex:1;min-width:0;line-height:1.25}
.me-t b{display:block;font-weight:600;font-size:14px}
.me-t small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dotn{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px var(--soft)}
.menu{position:absolute;left:0;right:0;top:44px;z-index:46;background:#fff;border-radius:12px;box-shadow:var(--shadow-pop);padding:6px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;min-height:36px;padding:6px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:14px}
.menu button:hover{background:var(--sunken)}
.menu .px{width:20px}
.menu .ck{width:16px;height:16px;margin-left:auto}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu .u{width:16px;height:16px;color:var(--ink-2)}

/* centro */
.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}
.top{position:relative;z-index:5;height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px 0 16px;border-bottom:1px solid var(--line)}
.crumb{min-width:0;display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;margin-right:6px}
.crumb b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumb .ct{overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.crumb .sep{color:var(--line-2)}
.proto{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;background:var(--brand-bg);color:var(--brand-ink);font-size:12.5px;font-weight:550;white-space:nowrap;flex:none}
.proto i{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.chk-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 8px;margin-right:4px;border-radius:10px;border:1px solid var(--line-2);background:#fff;font-size:13.5px;font-weight:550;white-space:nowrap}
.chk-btn:hover{border-color:var(--hover-line)}
.chk-btn b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.ring{width:20px;height:20px;transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .5s}
.only-m{display:none}
.shell.side-off #side-open{display:inline-grid}
.shell.cfg-off #cfg-tg .u{transform:rotate(180deg)}
.pop{position:absolute;z-index:46;background:#fff;border-radius:14px;box-shadow:var(--shadow-pop);padding:16px}
.chk{top:52px;right:12px;width:min(330px,calc(100vw - 24px))}
.chk-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.chk-h b{font-weight:600;font-size:15px}
.chk-h small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chk .bar{margin:10px 0 6px}
.chk-l li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.chk-l li:first-child{border-top:0}
.chk-l li.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.chk-l .oc{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
.chk-l .lnk{margin-left:auto;color:var(--ink);font-weight:600;padding:2px 8px;border:1px solid var(--line-2);border-radius:7px;font-size:12.5px}
.chk-l .lnk:hover{border-color:var(--hover-line)}
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto}
.v-agent{display:flex;flex-direction:column;overflow:hidden}

/* agente */
.ascroll{flex:1;min-height:0;overflow-y:auto}
.ainner{max-width:880px;min-height:100%;margin:0 auto;padding:44px 32px 18px;display:flex;flex-direction:column}
.ahead .px{width:66px}
.ahead h1{font-size:40px;line-height:1.08;margin-top:18px;letter-spacing:-.035em}
.ahead .desc{margin-top:6px;font-size:15.5px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.ainner.chat .ahead{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
#a-av{display:block}
.ainner.chat #a-av{grid-row:span 2}
.ainner.chat .ahead .px{width:38px}
.ainner.chat .ahead h1{font-size:21px;margin-top:0;letter-spacing:-.02em}
.ainner.chat .ahead .desc{margin-top:0;font-size:14px}
.ainner.chat .ahead .tools,.ainner.chat .gs{display:none}
.gs{margin-top:auto;padding-top:40px}
.gs-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.gs-h h2{font-family:var(--f-s);font-size:16.5px;font-weight:600;letter-spacing:0}
.gs-h .lnk{margin-left:auto}
.cards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(252px,1fr);gap:12px;overflow-x:auto;padding:14px 4px 10px;margin:-14px -4px 0;scroll-snap-type:x proximity;scrollbar-width:thin}
.card{position:relative;display:flex;flex-direction:column;gap:8px;min-height:170px;padding:16px 16px 14px;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(21,22,28,.04),0 6px 16px -12px rgba(21,22,28,.2);transition:border-color .15s,box-shadow .15s,transform .15s;scroll-snap-align:start}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow-s);transform:translateY(-1px)}
.card-h{display:flex;align-items:center;gap:8px;font-size:15px}
.card-h b{font-weight:600}
.card-h .u{width:17px;height:17px;color:var(--ink-2)}
.card-p{color:var(--muted);font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-t{display:flex;gap:5px;margin-top:auto;padding-top:4px}
.card.hl{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),var(--shadow-s)}
.ctag{position:absolute;top:-11px;left:14px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px}
.okp{margin-left:auto;font-size:12px;font-weight:600;color:var(--ok);background:var(--ok-bg);padding:2px 8px;border-radius:999px}

/* conversa */
#threads{display:contents}
.thread{display:flex;flex-direction:column;gap:22px;padding-top:28px;padding-bottom:8px}
.in{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mu{align-self:flex-end;max-width:min(560px,86%);background:var(--sunken);padding:10px 15px;border-radius:18px 18px 6px 18px;font-size:15px}
.mu .att{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:6px 10px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.mu .att .u{width:15px;height:15px}
.ma{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
.ma > .px{width:28px;margin-top:1px}
.mb{min-width:0;display:flex;flex-direction:column;gap:12px}
.who{display:flex;align-items:baseline;gap:8px;font-size:14px;margin-bottom:-4px}
.who b{font-weight:600}
.who time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mb > p{font-size:15px;line-height:1.55;max-width:62ch}
.wk{border:1px solid var(--line);border-radius:14px;padding:2px 14px}

.pgrid{background:
    radial-gradient(60% 70% at 50% 50%,rgba(255,255,255,.95) 30%,rgba(255,255,255,0) 80%),
    linear-gradient(90deg,#fff 2px,transparent 2px) 0 0/12px 12px,
    linear-gradient(#fff 2px,transparent 2px) 0 0/12px 12px,
    radial-gradient(50% 90% at 0% 100%,#E7DEFF,transparent 72%),
    radial-gradient(50% 90% at 100% 0%,#FFDDEB,transparent 72%),
    radial-gradient(45% 70% at 100% 100%,#FFE4D2,transparent 72%),
    radial-gradient(45% 70% at 0% 0%,#DCE7FF,transparent 72%),

.art{position:relative;margin-top:18px;height:280px;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;padding-top:62px}
.aw{position:relative;width:min(384px,86%);background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 20px 50px -24px rgba(21,22,28,.3);padding:20px 20px 0}
.aw-px{position:absolute;right:18px;bottom:100%;margin-bottom:-1px;display:flex;align-items:flex-end;gap:5px}
.aw-px .px:nth-child(1){width:22px}
.aw-px .px:nth-child(2){width:30px}
.aw-px .px:nth-child(3){width:22px}
.aw-t{display:block;font-family:var(--f-d);font-size:20px;font-weight:600;letter-spacing:-.02em}
.aw-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.aw-ok{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;height:36px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:550;box-shadow:0 1px 2px rgba(21,22,28,.05)}
.aw-ok .ck{width:15px;height:15px}
.aw-l{margin-top:10px;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;-webkit-mask-image:linear-gradient(#000 40%,transparent 96%);mask-image:linear-gradient(#000 40%,transparent 96%)}
.aw-l li{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}

.aw-l span{flex:1;min-width:0;line-height:1.25}
.aw-l b{display:block;font-size:13.5px;font-weight:600}
.aw-l small{display:block;font-size:11.5px;color:var(--muted)}
.aw-l .u{width:15px;height:15px;color:var(--muted)}
.more{margin-top:16px;border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:15px}
.more:hover{color:var(--ink)}
.more .u{width:16px;height:16px;transition:transform .2s}
.more[aria-expanded="true"] .u{transform:rotate(90deg)}
.inc{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inc li{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-radius:11px;background:var(--soft);border:1px solid var(--line);font-size:14px;line-height:1.35}

/* artes dos modais de novidade e consultor */
.phone{position:relative;width:min(330px,84%);background:#fff;border:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 20px 50px -24px rgba(21,22,28,.3);padding:14px 14px 0;display:flex;flex-direction:column;gap:9px;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.phone-h{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.phone-h .px{width:20px}
.phone-h small{margin-left:auto;font-weight:500;color:var(--muted);font-size:11.5px}
.bub{max-width:86%;padding:8px 11px;border-radius:12px 12px 12px 4px;background:var(--sunken);font-size:12.5px;line-height:1.4}
.bub.me{align-self:flex-end;border-radius:12px 12px 4px 12px;background:#DFF5E6}
.qr{display:flex;gap:6px}
.qr span{flex:1;text-align:center;padding:6px 0;border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:600;color:var(--blue-ink)}

/* primeiro acesso */
.ob{position:fixed;inset:0;z-index:80;background:#fff;display:flex;flex-direction:column}
.haze{position:absolute;left:0;right:0;top:0;height:300px;pointer-events:none;
  background:radial-gradient(38% 110% at 12% 0%,rgba(140,170,255,.26),transparent 70%),radial-gradient(34% 110% at 50% 0%,rgba(255,196,150,.18),transparent 70%),radial-gradient(38% 110% at 88% 0%,rgba(255,150,196,.24),transparent 70%)}
.ob-top{position:relative;z-index:1;height:64px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px 0 24px}
.logo{display:flex;align-items:center;gap:8px}
.ob-prog{display:flex;gap:6px;margin-left:14px}
.ob-prog i{width:36px;height:4px;border-radius:2px;background:var(--line-2);transition:background .3s}
.ob-prog i.on{background:var(--ink)}
.ob-step{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ob-body{position:relative;z-index:1;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.ob-form{overflow-y:auto;padding:36px clamp(20px,5vw,72px) 40px}
.ob-in{max-width:580px;margin:0 auto}
.ob-form h1{font-size:clamp(30px,3.2vw,42px);line-height:1.08;margin-top:10px}
.ob-form h1:focus{outline:0}
.ob-lede{margin-top:12px;color:var(--ink-2);font-size:16px;max-width:36em;text-wrap:pretty}
.ob-in > .fld{margin-top:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-r{position:relative;display:inline-flex}
.chip-r input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chip-r span{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:14.5px;font-weight:500;transition:border-color .15s,box-shadow .15s}
.chip-r span .u{width:15px;height:15px;color:var(--ink-2)}
.chip-r:hover span{border-color:var(--hover-line)}
.chip-r input:checked + span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip-r input:focus-visible + span{outline:2px solid var(--brand);outline-offset:2px}
.aopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:24px}
.aopt{position:relative;display:block}
.aopt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.aopt input:disabled{cursor:not-allowed}
.box{display:grid;grid-template-columns:34px minmax(0,1fr) 24px;gap:12px;align-items:center;height:100%;padding:13px 14px;border:1px solid var(--line-2);border-radius:14px;background:#fff;transition:border-color .15s,box-shadow .15s,opacity .15s}
.aopt .px{width:32px}
.aopt b{display:block;font-weight:600;font-size:15px}
.aopt small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35}
.ord{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.aopt:hover .box,.topt:hover .box{border-color:var(--hover-line)}
.aopt input:checked ~ .box,.topt input:checked ~ .box{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.aopt input:checked ~ .box .ord{background:var(--ink);border-color:var(--ink)}
.aopt input:disabled ~ .box{opacity:.45}
.aopt input:focus-visible ~ .box,.topt input:focus-visible ~ .box{outline:2px solid var(--brand);outline-offset:2px}
.aopt.other .box{border-style:dashed;background:var(--soft);grid-template-columns:34px minmax(0,1fr)}
.aopt.other .oi{width:32px;height:32px;border-radius:10px;border:1.5px dashed var(--line-2);display:grid;place-items:center;color:var(--muted)}
.aopt.other .oi .u{width:16px;height:16px}
.topts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:24px}
.topt{position:relative;display:block}
.topt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.topt .box{display:flex;align-items:center;gap:11px;height:54px;padding:0 14px}
.topt b{font-weight:550;font-size:15px}
.topt .tk{margin-left:auto;width:19px;height:19px;color:var(--line-2)}
.topt input:checked ~ .box .tk{color:var(--ok)}
.ob-note{margin-top:16px;font-size:14px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.ob-note .u{width:17px;height:17px;margin-top:1px;color:var(--muted)}
.rec{margin-top:24px;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow-s);background:#fff}
.rec-h{display:flex;gap:16px;align-items:center}
.rec-h .px{width:52px}
.rec-h b{display:block;font-family:var(--f-d);font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.rec-h p{color:var(--muted);font-size:14.5px;margin-top:2px}
.rec-cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.wl li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:5px 0;font-size:14.5px;line-height:1.4}
.tl li{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:14.5px}
.tl small{margin-left:auto;font-size:12.5px;font-weight:550;color:var(--ok);white-space:nowrap}
.tl small.later{color:var(--muted);font-weight:500}
.ob-prev{position:relative;margin:0 16px 16px 0;border:1px solid var(--line);border-radius:24px;overflow:hidden;display:grid;place-items:center;padding:28px}
.pv{position:relative;width:min(340px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-l);padding:22px}
.pv-top{display:flex;justify-content:space-between;align-items:flex-start}
.pv-top .px{width:56px}
.pv-n{display:block;font-family:var(--f-d);font-size:24px;font-weight:600;letter-spacing:-.025em;margin-top:14px;line-height:1.15}
.pv-d{color:var(--muted);font-size:14px;margin-top:4px}
.pv-meta{margin-top:16px;border-top:1px solid var(--line)}
.pv-meta > div{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.pv-meta dt{color:var(--muted);flex:none}
.pv-meta dd{font-weight:550;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-meta dd.pv-tools{display:flex;gap:4px;justify-content:flex-end}
.pv-task{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--sunken);font-size:14px;font-weight:500;line-height:1.4}
.pv-task small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.flo{position:absolute;pointer-events:none}
.flo .px{width:34px}
.flo-a{left:9%;top:12%;transform:rotate(-8deg)}
.flo-b{right:10%;bottom:11%;transform:rotate(7deg)}
.cur{position:absolute;width:22px;height:24px;pointer-events:none;animation:cur-drift 6s ease-in-out infinite}
.cur svg{width:22px;height:24px;display:block;filter:drop-shadow(0 2px 3px rgba(21,22,28,.18))}
.cur b{position:absolute;left:15px;top:20px;padding:2px 9px 3px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#fff;background:var(--cc)}
@keyframes cur-drift{0%,100%{transform:translate(0,0)}35%{transform:translate(-7px,-5px)}70%{transform:translate(4px,-8px)}}
.ob-foot{position:relative;z-index:1;flex:none;display:flex;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--line);background:#fff}
.ob-hint{font-size:13.5px;color:var(--brand-ink);text-align:right}
.build{position:absolute;inset:64px 0 0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow-y:auto}
.build .px{width:84px}
.build h2{font-size:clamp(26px,3vw,36px);line-height:1.1;margin-top:24px}
.build > p{margin-top:8px;color:var(--muted);font-size:15px}
.bl{margin-top:26px;width:min(440px,100%);text-align:left;border:1px solid var(--line);border-radius:16px;padding:4px 16px;background:#fff;box-shadow:var(--shadow-s)}
.bl li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.bl li:first-child{border-top:0}

.scrim{position:fixed;inset:0;z-index:55;background:var(--scrim)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:120;display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 32px);padding:11px 16px;border-radius:12px;background:var(--ink);color:#fff;font-size:14px;box-shadow:0 16px 40px -14px rgba(21,22,28,.5)}
.toast .u{width:17px;height:17px;color:#7BE0A9}
.toast.in{animation:toast-in .3s cubic-bezier(.2,.7,.2,1)}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,8px)}}

/* telas menores */
@media (min-width:1181px){
  .shell.cfg-off #cfg-tg .u{transform:rotate(180deg)}
}
@media (max-width:1180px){
  .shell{--cw:0px}
  .shell .cfg{grid-column:auto;display:flex;position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(var(--cfg),100%);transform:translateX(102%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.7,.2,1),visibility 0s .28s;box-shadow:-30px 0 60px -30px rgba(21,22,28,.35)}
  .shell.noagent .cfg{display:none}
  .shell.cfg-open .cfg{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.7,.2,1)}
  #cfg-x{display:inline-grid}
  #cfg-tg .u{transform:rotate(180deg)}
  .ob-body{grid-template-columns:minmax(0,1fr) minmax(0,.85fr)}
}
@media (max-width:980px){
  .ob-body{grid-template-columns:minmax(0,1fr)}
  .ob-prev{display:none}
  .ments{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kp-g{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:860px){
  .shell{--sw:0px}
  .shell .side{grid-column:auto;display:flex;position:fixed;top:0;left:0;bottom:0;z-index:61;width:min(292px,86%);transform:translateX(-102%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.7,.2,1),visibility 0s .28s;box-shadow:30px 0 60px -30px rgba(21,22,28,.35)}
  .shell.side-open .side{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.7,.2,1)}
  .only-m{display:inline-grid}
  .ainner{padding:28px 20px 14px}
  .ahead h1{font-size:32px}
  .cwrap{padding:6px 14px 8px}
  .page{padding:28px 20px 56px}
  .plr{grid-template-columns:34px minmax(0,1fr) auto;row-gap:4px}
  .plr .n,.plr .when{display:none}
  .trl li{grid-template-columns:minmax(0,1fr) auto}
  .trl .tn,.trl .bar{display:none}
}
@media (max-width:640px){
  .top{padding:0 8px 0 8px}
  .crumb{display:none}
  .proto .pl{display:none}
  .chk-btn span{display:none}
  .hide-m{display:none}
  .aopts,.topts{grid-template-columns:minmax(0,1fr)}
  .rec-cols{grid-template-columns:minmax(0,1fr)}
  .rec{padding:18px}
  .ob-top{padding:0 8px 0 16px;gap:10px}
  .ob-top .proto,.ob-step{display:none}
  .ob-prog{margin-left:auto}
  .ob-prog i{width:26px}
  .ob-form{padding:24px 16px 32px}
  .ob-foot{padding:12px 16px}
  .dlg-b{padding:26px 20px 20px}
  .dlg h2{font-size:22px}
  .feat{grid-template-columns:minmax(0,1fr);gap:12px;margin-top:20px}
  .art{height:244px;padding-top:56px}
  .aw{width:92%}
  .inc{grid-template-columns:minmax(0,1fr)}
  .dlg-f{flex-wrap:wrap;padding:14px 16px}
  .dlg-f .note{display:none}
  .dlg-f .btn{flex:1 1 100%}
  .dlg-f .btn-p{order:-1}
  .evt{margin-left:0}
  .ahead h1{font-size:28px}
  .phd h1{font-size:30px}
  .tile b{font-size:24px}
  .wk7{padding:12px;gap:4px}
  .hz{grid-template-columns:40px minmax(0,1fr)}
  .hz .btn{grid-column:1 / -1;justify-self:start}
  .hz .px{width:38px}
  .mu{max-width:92%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}


/* ===== protótipo de trabalho na linguagem AI Hub: peças que o fluxo validado pede ===== */
body{ overflow:hidden; }
#app{ height:100%; }
.logo .wm{ font-size:21px; }
.ob .haze{ z-index:0; }
.ob-top, .ob-foot{ position:relative; z-index:2; }
.ob-step{ max-width:340px; overflow:hidden; text-overflow:ellipsis; }

/* abertura: landing */
.lp{ position:fixed; inset:0; overflow-y:auto; background:#fff; }
.lp .haze{ position:absolute; left:0; right:0; top:0; height:340px; pointer-events:none; z-index:0; background:radial-gradient(38% 110% at 12% 0%,rgba(140,170,255,.30),transparent 70%),radial-gradient(34% 110% at 50% 0%,rgba(255,196,150,.22),transparent 70%),radial-gradient(38% 110% at 88% 0%,rgba(255,150,196,.30),transparent 70%); }
.lp .wrap{ max-width:1080px; margin-inline:auto; padding-inline:24px; position:relative; z-index:1; }
.news{ position:relative; z-index:1; display:block; width:max-content; max-width:calc(100% - 32px); margin:0 auto; padding:5px 16px 6px; border-radius:0 0 10px 10px; text-align:center; color:#fff; font-size:14px; font-weight:500; background:linear-gradient(90deg,#8E86F0,#E8967B 50%,#E679B1); }
.navwrap{ position:sticky; top:14px; z-index:40; padding-inline:16px; margin-top:14px; }
.lnav{ max-width:1080px; margin-inline:auto; display:flex; align-items:center; gap:18px; padding:7px 7px 7px 18px; background:rgba(255,255,255,.88); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 28px -16px rgba(21,22,28,.22); }
.lnav .logo .wm{ font-size:25px; }
.lnav .mark{ grid-template-columns:9px 9px; gap:2.5px; }
.lnav .mark i{ width:9px; height:9px; border-radius:3px; }
.nav-r{ margin-left:auto; display:flex; align-items:center; gap:18px; font-size:15.5px; }
.hero{ position:relative; z-index:1; padding-block:180px 170px; text-align:center; }
.hero h1{ font-size:clamp(44px,6vw,80px); line-height:1; letter-spacing:-.04em; max-width:12.5em; margin-inline:auto; }
.hero h1:focus{ outline:0; }
.lede{ max-width:31em; margin:26px auto 0; font-size:clamp(17px,1.45vw,20px); color:var(--ink); text-wrap:pretty; }
.ctas{ display:flex; justify-content:center; gap:10px; margin-top:34px; flex-wrap:wrap; }
.hero-meta{ display:inline-flex; align-items:center; gap:7px; margin-top:16px; font-size:14px; color:var(--muted); }
.hero-meta .u{ width:15px; height:15px; }
.stage{ position:absolute; inset:0; max-width:1380px; margin-inline:auto; pointer-events:none; }
.cl{ position:absolute; width:240px; height:210px; animation:cl-float 8s ease-in-out infinite; }
.cl > .px{ position:absolute; left:78px; top:48px; transform:rotate(var(--r,0deg)); }
.cl .ic-c{ position:absolute; }
.cur.dark b{ color:#4A2E00; }
@keyframes cl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cl-a{ left:1%; top:20px; }
.cl-b{ right:2%; top:40px; animation-delay:-2s; --r:-7deg; }
.cl-c{ left:7%; bottom:0; animation-delay:-4s; --r:6deg; }
.cl-d{ right:5%; bottom:-10px; animation-delay:-6s; }
.pvs{ padding-block:40px 0; }
.logos{ text-align:center; }
.logos p{ font-size:15px; color:var(--muted); }
.logo-row{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:18px 40px; margin-top:26px; }

const V4_STEPS={admin:["Visão geral","Diagnóstico","Plano Agêntico","Onboarding da empresa"],membro:["Visão geral","Diagnóstico pessoal","Ponto de partida","Trilha"],individual:["Visão geral","Diagnóstico","Plano Agêntico","Onboarding coletivo"]};
function v4Q(p){
  const persona=p==="admin"?"admin":"pessoal";
  const ctx = p==="admin" ? [
      {id:"nome",t:"Como você se chama?",type:"text",ph:"Seu nome"},
      {id:"cargo",t:"Qual é o seu cargo?",type:"text",ph:"Ex.: Diretora de operações"},
      {id:"empresa",t:"Qual é o nome da sua empresa?",type:"text",ph:"Nome da empresa"},
      {id:"setor",t:"Em qual setor ela atua?",type:"text",ph:"Ex.: clínicas de estética",llm:"setor"},
      {id:"pessoas",t:"Quantas pessoas trabalham na empresa?",type:"single",opts:["Só eu","2–10","11–50","51–100","mais de 100"]}]
    : p==="membro" ? [
      {id:"nome",t:"Como você se chama?",type:"text",ph:"Seu nome"},
      {id:"cargo",t:"Qual é o seu cargo?",type:"text",ph:"Ex.: Analista comercial"},
      {id:"areaP",t:"Em qual área você atua?",type:"text",ph:"Ex.: Comercial"}]
    : [
      {id:"nome",t:"Como você se chama?",type:"text",ph:"Seu nome"},
      {id:"trabalho",t:"Com o que você trabalha?",type:"text",ph:"Ex.: consultoria de RH para pequenas empresas",llm:"atuacao"},
      {id:"empresa",t:"Em qual empresa ou negócio você atua?",type:"text",ph:"Nome da empresa ou negócio",alt:"Trabalho por conta própria"},
      {id:"setor",t:"Em qual setor você atua?",type:"text",ph:"Ex.: serviços",llm:"setor"}];
  const mat=V4_MAT[persona].map((m,i)=>({id:"mat"+i,dim:m[0],t:m[1],type:"single",opts:m[2]}));
  const inefT = p==="admin" ? "Quais áreas da empresa você sente que têm mais ineficiência e mais processos feitos de forma manual?" : p==="membro" ? "Na sua rotina, onde você sente mais ineficiência e trabalho manual?" : "Quais áreas do seu trabalho ou negócio você sente que têm mais ineficiência e mais processos feitos de forma manual?";
  const procT = p==="admin" ? "Nessas áreas, existe alguma atividade ou processo em que você acha que faria muito sentido aplicar um agente de IA?" : p==="membro" ? "Existe alguma atividade ou processo da sua rotina em que você acha que faria muito sentido aplicar um agente de IA?" : "Existe alguma atividade ou processo em que você acha que faria muito sentido aplicar um agente de IA?";
  return [...ctx,...mat,{id:"inef",t:inefT,sub:"Selecione até duas.",type:"multi",max:2,opts:V4_INEF[p]},{id:"proc",t:procT,type:"yesno"}];
}
function v4Organize(kind,txt){ const t=txt.trim(); if(kind==="setor"){ const m=SETORES.find(s=>t.toLowerCase().includes(s.toLowerCase().split(" ")[0].slice(0,5))); return m||t.charAt(0).toUpperCase()+t.slice(1); } return t.charAt(0).toUpperCase()+t.slice(1); }
function v4AreaFromText(t){ for(const [re,a] of V4_KW) if(re.test(t)) return a; return null; }
function v4NeedsClar(txt){ return !v4AreaFromText(txt) || txt.trim().split(/\s+/).length<4; }
function v4ClarOpts(kind){ const v=S.v; const chosen=((v.a.inef||[]).map(x=>V4_MAP[x]).filter(Boolean)); const list=[...V4_AREAS].sort((a,b)=>(chosen.includes(b[1])?1:0)-(chosen.includes(a[1])?1:0)); return [...list.map(x=>x[0]), kind==="area"?"Nenhuma delas":"Ainda não sei dizer"]; }
function v4Compute(){
  const v=S.v, persona=S.profile==="admin"?"admin":"pessoal", M=V4_MAT[persona];
  const sc=M.map((m,i)=>{ const k=m[2].indexOf(v.a["mat"+i]); return k<0?0:k/(m[2].length-1); });
  const avg=sc.reduce((x,y)=>x+y,0)/sc.length; const si_=Math.min(4,Math.floor(avg*5));
  const low=sc.indexOf(Math.min(...sc)); const gargalo=M[low][0];
  const inef=(v.a.inef||[]).filter(x=>x!=="Outra"&&x!=="Não sei identificar.");
  let areas=inef.map(x=>V4_MAP[x]).filter(Boolean); if(v.a.otherArea) areas.push(v.a.otherArea);
  const procTxt=(v.a.proc&&v.a.proc!=="no")?v.a.proc:"";
  const procArea=procTxt?(v.a.procArea||v4AreaFromText(procTxt)):null;
  if(!areas.length) areas=[procArea||"relatorios"]; areas=[...new Set(areas)];
  const mainArea=procArea||areas[0]; const cat=V4_CAT[mainArea];
  const prim=Object.assign({},cat.opps[0],{cat:mainArea,relato:procTxt||""});
  const pool=[...new Set([mainArea,...areas])]; const outras=[];
  for(let k=0;k<3&&outras.length<3;k++) pool.forEach(a=>{ const o=V4_CAT[a].opps[k]; if(o&&o.id!==prim.id&&outras.length<3) outras.push(Object.assign({},o,{cat:a})); });
  const destino = si_>=4 ? "Escalar a operação agêntica com governança" : `Chegar ao estágio ${V4_STAGES[si_+1]}`;
  return {stage:V4_STAGES[si_],si:si_,destino,gargalo,areas,mainArea,cat,prim,outras,procTxt,sc,low};
}
function v4Gains(c){ const v=S.v, p=c.prim; const H=V4_PORTE_H[v.a.pessoas]||[6,10]; const r=p.red||[.3,.5]; const lo=Math.round(H[0]*4.3*r[0]), hi=Math.max(lo+1,Math.round(H[1]*4.3*r[1])); const area=c.cat.area;
  const rev=(area==="vendas"||area==="marketing")?{v:"Oportunidades recuperadas",n:area==="vendas"?"Mais orçamentos voltando a andar":"Mais campanhas no ar no mesmo tempo",pr:area==="vendas"?"Se 1 em cada 10 orçamentos parados voltar a andar. O valor depende do seu ticket médio; o Consultor calcula com os seus números.":"Se o tempo liberado for para novas campanhas. O valor depende do seu histórico de conversão."}:{v:"Indireto",n:"O tempo liberado volta para o que gera receita",pr:"Não estimamos faturamento direto para esse tipo de processo sem uma referência validada."};
  return {H,r,lo,hi,flo:lo*60,fhi:hi*60,rev}; }

function snapshot(){ const v=S.v; const {hist,...rest}=v; v.hist.push(JSON.stringify(rest)); }
function desfazer(){ const v=S.v; if(!v.hist.length) return; const prev=JSON.parse(v.hist.pop()); Object.assign(v,prev,{hist:v.hist}); R(); }
function bot(t){ S.v.log.push({r:"bot",t}); }
function seguir(ack){ const v=S.v; v.typing=true; R(); setTimeout(()=>{ v.typing=false; if(ack) bot(ack); v.qi++; v.sel=[]; v.other=""; const n=v4Q(S.profile).length; if(v.qi>=n){ v.done=true; bot("Pronto. Com isso eu já consigo montar a primeira versão do seu Plano Agêntico."); R(); setTimeout(()=>ir("gen"),RM()?200:900); return; } R(); }, RM()?60:420); }
function responder(val,label){
  const v=S.v, Qs=v4Q(S.profile), q=Qs[v.qi]; if(!q||v.typing) return; snapshot();
  v.a[q.id]=val; v.log.push({r:"bot",t:q.t}); v.log.push({r:"me",t:(label||(Array.isArray(val)?val.join(", "):String(val)))+(q.id==="proc"&&v.attach&&val!=="no"?`, com o anexo ${v.attach}`:"")});
  let ack="";
  if(q.id==="nome") ack=`Prazer, ${String(val).trim().split(/\s+/)[0]}.`;
  else if(q.llm){ const org=v4Organize(q.llm,String(val)); v.a[q.id+"Org"]=org; ack=q.llm==="setor"?`Anotei o setor como ${org}.`:`Entendi: ${org}.`; }
  else if(q.id==="pessoas") ack="Obrigado. Agora seis perguntas rápidas para entender em que ponto da jornada vocês estão.";
  else if(q.id==="mat5") ack="Já tenho o retrato do estágio. Agora quero entender onde dói mais.";
  else if(q.id==="inef"){ const o=v.other.trim(); if(Array.isArray(val)&&val.includes("Outra")&&o){ const a=v4AreaFromText(o); v.a.otherArea=a; v.a.otherTxt=o; if(a) ack=`Entendi “${o}” como algo próximo de ${lc1(V4_CAT[a].areaN)}.`; else { v.clar={kind:"area",txt:o}; bot(`Só para eu localizar bem: “${o}” fica mais perto de qual destas áreas?`); v.sel=[]; v.other=""; R(); return; } } }
  if(q.id==="mat0"&&S.profile!=="admin") ack="Seis perguntas rápidas sobre o seu uso de IA.";
  if(q.id==="proc"){ if(v.attach){ v.a.procAttach=v.attach; v.attach=null; } if(val==="no") ack="Sem problema. Vou sugerir oportunidades com base nas áreas, no setor e no estágio."; else if(v4NeedsClar(String(val))){ v.procMode=null; v.clar={kind:"proc",txt:String(val)}; bot("Para eu entender melhor: em qual área esse processo acontece?"); R(); return; } else { const ar=v4AreaFromText(String(val)); ack=`Entendi. Isso tem tudo a ver com ${lc1(V4_CAT[ar].areaN)}: vou colocar como prioridade do seu plano.`; } v.procMode=null; }
  seguir(ack);
}
function esclarecer(opt){ const v=S.v, c=v.clar; if(!c) return; const hit=V4_AREAS.find(x=>x[0]===opt); v.log.push({r:"me",t:opt});
  let ack; if(c.kind==="area"){ v.a.otherArea=hit?hit[1]:null; ack=hit?`Combinado: vou tratar “${c.txt}” junto de ${lc1(hit[0])}.`:`Anotei “${c.txt}” como uma área própria.`; }
  else { v.a.procArea=hit?hit[1]:null; ack=hit?`Entendi. Vou colocar esse processo de ${lc1(hit[0])} como prioridade do seu plano.`:"Sem problema. Vou colocar esse processo como prioridade e a gente refina no Agent Builder."; }
  v.clar=null; seguir(ack); }

    foot=rodapeAB("Continuar",d.genDone,"",d.genDone?"":"Gerando o pacote"); }
  if(d.s===7){ const E=[["Baixe o Starter Kit","O arquivo .zip fica na sua pasta de downloads.","O arquivo aparece nos seus downloads."],["Importe no Hermes","No painel do Hermes, abra Importar configuração e selecione o arquivo, sem descompactar.","O Hermes mostra o nome e a missão do agente."],["Teste no Telegram","Mande “oi” para o agente e confira a apresentação nova.","Ele se apresenta com a nova configuração."]];
    const labs=["Baixei o Starter Kit","Importei no Hermes","O agente respondeu com a nova configuração"]; const tools=abTools(d); const fim=d.instConf;
    b=`<p class="eyebrow">Download e instalação</p><h1 id="focus-h" tabindex="-1">Instale o Starter Kit</h1><p class="ob-lede">Baixe o pacote e instale no Hermes que já está rodando. Uma etapa de cada vez.</p>
    <ol class="bl inst">${E.map((e,i)=>{ const cur=i===d.di&&!fim; return `<li class="${cur?"atual":""}">${d.dl[i]?ck():(cur?'<span class="spin"></span>':'<span class="oc"></span>')}<div class="blt2"><b>${e[0]}</b>${cur?`<p>${e[1]}</p>${i===0?`<button class="btn btn-g" data-act="abBaixar" style="margin-top:10px;align-self:flex-start">${u("down")}Baixar Starter Kit (.zip)</button>`:`<div class="art vid pgrid"><span class="play">${u("play")}</span><small>${esc(e[0].toLowerCase())}</small></div>`}<div class="res"><span class="muted">Resultado esperado</span><span>${e[2]}</span></div><div class="ma tip">${px("hub",24)}<div class="mb"><div class="who"><b>Consultor Pixel AI</b></div><p>${i===2?"Se ele responder como antes, reinicie o Hermes pelo painel. Continua igual? Me chame.":"Dúvida nesta etapa? Me chame no chat; se for técnico, passo para o suporte."}</p></div></div>`:(d.dl[i]?`<small class="muted">${e[2]}</small>`:"")}</div></li>`; }).join("")}</ol>
    ${fim?`<div class="sug"><span class="sug-i ok">${u("check")}</span><div class="sug-t"><b>Instalação confirmada por você</b><span>A primeira vitória acontece na Trilha, com a responsabilidade prioritária rodando num caso real.</span></div></div>`:""}
    <div class="cs0"><div class="cs-h"><h3>Depois: ativação das ferramentas</h3></div><p class="help" style="margin-top:4px">O agente conduz a ativação com você no Telegram, pelo Composio. A Pixel não acessa as contas.</p><div class="rows">${tools.map(t=>`<div class="row">${lg(t)}<span class="rt"><b>${esc(t)}</b></span><span class="pill wait">A conectar</span></div>`).join("")}</div></div>`;
    foot=rodapeAB(fim?"Concluir":labs[d.di]); }
  if(S.scr==="abfim"){ semPrev=true; const tools=abTools(d);
    b=`<div class="empty fimab"><div class="e-px">${px("cinza",40)}${px(d.area,72,{cls:"jump"})}${px("cinza",40)}</div><h1 id="focus-h" tabindex="-1">O ${esc(abNome())} está configurado</h1><p>Configuração e planejamento prontos. A primeira vitória acontece na Trilha, com “${esc(lc1(abPrio(d).t))}” rodando num caso real.</p>
      <div class="kp" style="width:min(640px,100%);margin-top:24px;text-align:left"><div class="kp-g"><div class="kpi"><small>Configuração</small><b>Pronta</b></div><div class="kpi"><small>Hermes</small><b>${d.instConf?"Confirmado":"Pendente"}</b></div><div class="kpi"><small>Ferramentas</small><b>${tools.length} a conectar</b></div><div class="kpi"><small>Primeira entrega</small><b>Na Trilha</b></div></div></div></div>`;
    foot=obFoot(null,"","Ir para a Trilha","irTrilha"); }
  const nseg=8, at=S.scr==="abfim"?7:d.s;
  return `<div class="ob">${obTop(nseg,at,passo,"sairAB")}<div class="haze"></div>
    <div class="ob-body ${semPrev?"one":""}"><div class="ob-form" id="scroller"><div class="ob-in ${semPrev?"wide":""}">${b}</div></div>${semPrev?"":previa()}</div>${foot}${catModal()}</div>`; }

function catModal(){ const d=S.ab; if(!d||!d.modal) return ""; const ferr=d.modal==="tools"; const q=(d.catQ||"").toLowerCase();
  const have=ferr?abTools(d):abSkills(d).ready; const list=ferr?TOOL_CAT.filter(t=>!have.includes(t)):SKILL_CAT.filter(([k])=>!have.includes(k)).map(x=>x[0]);
  const fil=list.filter(x=>!q||x.toLowerCase().includes(q)); const nsel=Object.values(d.mSel).filter(Boolean).length;
  return `<div class="ov veu" role="dialog" aria-modal="true" aria-labelledby="cat-t" data-act="catFora"><div class="dlg" style="width:min(560px,100%)"><button class="ibtn dx" data-act="catFechar" aria-label="Fechar">${u("x")}</button><div class="dlg-b"><h2 id="cat-t">${ferr?"Adicionar ferramentas":"Adicionar skills"}</h2><p class="dsub">${ferr?"Catálogo de integrações do Composio. A conexão acontece depois, no Telegram.":"Capacidades extras que o agente pode usar."}</p>
    <div class="rs" style="margin-top:16px"><input id="cat-q" data-bind="ab.catQ" data-live="1" value="${esc(d.catQ)}" placeholder="${ferr?"Buscar ferramenta":"Buscar skill"}"></div>
    <div class="rows" style="margin-top:10px">${fil.map(x=>`<label class="row ckr2">${ferr?lg(x):`<span class="ri">${u("sparkle")}</span>`}<span class="rt"><b>${esc(x)}</b>${ferr?"":`<small>${esc((SKILL_CAT.find(s=>s[0]===x)||[])[1]||"")}</small>`}</span><input type="checkbox" data-act="catSel" data-arg="${esc(x)}" ${d.mSel[x]?"checked":""}></label>`).join("")||'<p class="empty-r">Nada encontrado.</p>'}</div></div>
    <div class="dlg-f"><span class="note">${nsel} selecionada${nsel===1?"":"s"}</span><button class="btn btn-g" data-act="catFechar">Cancelar</button><button class="btn btn-p" data-act="catAdd" ${nsel?"":"disabled"}>Adicionar ao agente</button></div></div></div>`; }

/* ===================== render, olhar dos personagens e ações extras ===================== */
function syncChrome(){ document.querySelectorAll("[data-pf]").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.pf===S.profile))); const grp={ov:"ov",chat:"chat",gen:"sum",sum:"sum",sched:"sched",trilha:"trilha",ab:"ab",abfim:"ab",caso:"trilha",checkpoint:"checkpoint",marco:"marco"}[S.scr]; document.querySelectorAll("[data-salto]").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.salto===grp))); }
function R(){ const app=document.getElementById("app"); const sc=document.getElementById("scroller"); const keep=sc&&!FOCO?sc.scrollTop:0; app.innerHTML=view(); syncChrome(); S.hop=false;
  const ns=document.getElementById("scroller");
  if(S.scr==="chat"){ requestAnimationFrame(()=>{ if(ns) ns.scrollTop=ns.scrollHeight; }); const t=document.querySelector("#t-in:not([disabled]),#v4-proc"); if(t&&!REC) t.focus({preventScroll:true}); }
  else if(ns&&!FOCO) ns.scrollTop=keep;
  if(FOCO){ FOCO=false; if(ns) ns.scrollTop=0; const h=document.getElementById("focus-h"); if(h) h.focus({preventScroll:true}); }
  if(S.scr==="ab"&&S.ab.s===6&&!S.ab.genDone&&!GEN_T) gerarKit(); }
document.addEventListener("mousemove",e=>{ if(RM()) return; document.querySelectorAll(".px[data-look]").forEach(p=>{ const r=p.getBoundingClientRect(); if(!r.width) return; const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2); const m=Math.hypot(dx,dy)||1; const k=Math.min(1,m/300); p.style.setProperty("--lx",(dx/m*2.4*k).toFixed(2)+"px"); p.style.setProperty("--ly",(dy/m*2*k).toFixed(2)+"px"); }); },{passive:true});


Object.assign(A,{
  verCases:()=>{ const c=document.getElementById("cases"); if(c) c.scrollIntoView({behavior:RM()?"auto":"smooth"}); },
  premissas:()=>{ S.prem=!S.prem; R(); },
  irResumo:()=>ir("sum"),
  probs:()=>{ S.probs=!S.probs; R(); },
  maisIdioma:()=>{ S.idioma=!S.idioma; R(); },
  menuM:()=>{ S.sideOpen=!S.sideOpen; R(); }
});
["abPath","abTpl","abTog","abPrio","abAuto","abPub"].forEach(k=>{ const f=A[k]; if(!f) return; A[k]=(...a)=>{ S.hop=true; return f(...a); }; });
const _ir=ir; ir=function(s){ S.probs=false; return _ir(s); };
document.addEventListener("click",e=>{ if(e.target.closest(".proto-b")){ e.stopPropagation(); painel(); const pn=document.getElementById("tw-pan"); pn.classList.toggle("lp-pos",S.scr==="ov"); } },true);
R();
